# project.conf — PRESERVED KICKOFF RECORD: Turnips for Halloween
#
# Moved out of the repo root on 2026-09-22. This is the only copy of the answers
# that /ux-kickoff produced when it was dry-run for real (Step 0 -> 0b -> 0c ->
# 1-4 -> 5, check-roster.sh exiting 0). EXAMPLE-TURNIPS.md refers to this run;
# TURNIPS-INTENT-SPEC.md frontmatter does NOT carry the roster, so deleting this
# would have destroyed the record.
#
# It lives here rather than at the root because a skeleton someone else clones
# must not ship with another project owners pre-filled.

# project.conf — WHAT THIS FILE IS
#
# The single configuration file for this whole toolkit. Every one of the 20 check
# scripts reads it instead of hardcoding your product name, owners, file paths or
# gate files — so the same scripts work on any project just by editing this file,
# not by editing the scripts.
#
# WHEN YOU EDIT IT
#
#   Once, at setup — either by hand, or guided: run /ux-kickoff for the RACI/owner
#   fields, or just fill in PROJECT_NAME/GATE_1-3/INTENT_SPEC yourself. See
#   QUICKSTART.md for the full walkthrough.
#
#   Again, whenever an owner changes, a path moves, or you switch PROCESS_TIER.
#
#   You do NOT edit this file to fix a specific check failing — a red check means
#   go fix the FILE it points at (ux.md, OPEN.md, EVIDENCE.md...), not this config.
#   This file only says WHERE things are and WHO is accountable; it holds none of
#   the actual project content.
#
# HOW THIS FILE RELATES TO THE UX-WIRED INTENT SPEC
#
#   INTENT_SPEC below names your project's ONE canonical document — start it from
#   templates/UX-INTENT-SPEC.template.md, the version where RACI, evidence status,
#   change requests and scoped sign-off are load-bearing sections, not an org-chart
#   footnote. check-trace.sh resolves every criterion's `traces_to:` against it.
#
#   ROSTER, ACCOUNTABLE_OWNER, RESEARCH_OWNER, RISK_FUNCTION, ESCALATION_PATH and
#   EVIDENCE_BASIS below are NOT this project's source of truth for those things —
#   they're a MIRROR of six fields already living in that document's own
#   frontmatter (`roster:`, `accountable_owner:`, `research_owner:`,
#   `risk_function:`, `escalation_path:`, `evidence_basis:`). The mirror exists
#   only because check-roster.sh and check-tier.py read config, not markdown
#   frontmatter — they need SOMEWHERE mechanical to look. /ux-kickoff writes both
#   copies together so they can't drift; if you edit one by hand, edit the other.
#
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT IS NOT TRUE, AND USED TO BE CLAIMED HERE. This file said "there is no palette,
# no product name and no owner hardcoded in any checker." The product name and owner
# half is correct; the palette half was false, and it was false in the one file every
# adopter is told to read and edit. Corrected 2026-09-18 after a cold clone caught it:
#
#   scripts/check-design.py  branches on the literal token names `ochre` and `cadmium`
#                            and prescribes `--ink` / `--ultramarine` / `--violet`
#   scripts/contrast.py      hardcodes a nine-colour palette
#   check-eng.sh             hardcodes the FLOOR criterion ids CLR-01/CLR-02 and UXI-13
#
# Those three carry the design system this skeleton was extracted from. If your tokens
# are named differently, they will report nonsense — confidently. Either port them to
# your palette or drop them from CI until you have; they are the least portable part of
# this repo and the honest move is to say so here rather than in a footnote.

PROJECT_NAME="Turnips for Halloween"

# Mechanical build-correctness (gates, drift, design lint) vs. human-process
# facilitation (RACI, escalation, evidence ownership, never-events). Most teams
# want both — "full" is the default and always has been. "skinny" is for a team
# whose own human process is already tight and doesn't need this repo's version
# of it. See README-SKINNY.md before choosing skinny; it names exactly what goes
# quiet and says plainly that the split is a judgment call, not yet run against
# a real skinny-tier team.
PROCESS_TIER="full"

# Canonical intent document. check-trace.sh validates every criterion's
# traces_to: pointer against this file. Leave empty if you have no intent spec —
# check-trace.sh will exit 5 and say so, which is a finding, not a skip.
INTENT_SPEC="TURNIPS-INTENT-SPEC.md"

# The artifact check-design.py lints. Leave empty until a build exists.
BUILD=""

# ---- ROSTER & RACI -----------------------------------------------------------
# Who is on the project and what they hold, filled by a kickoff (see the
# /ux-kickoff skill) or by hand. Accountability is a property of a DECISION, not
# of the project as a whole — real teams end up with several people each
# accountable for a different area, and that is correct RACI, not a defect.
# READ BY: ./check-roster.sh. One line per person; blank RACI cells are fine —
# UNASSIGNED is a legal value, unasked is not.
#
# format: NAME | PROJECT ROLE | PRODUCT-RACI | DESIGN-RACI | RESEARCH-RACI | ENGINEERING-RACI
ROSTER=(
  "Beth Connor | Solo founder — product, design, research | R | R/A | R/A | UNASSIGNED"
  "Sponge Bob | Product Exec / accountable executive | A | UNASSIGNED | UNASSIGNED | UNASSIGNED"
)

# Who signs a T2 waiver (consequence lands on a user). Must be a real person or
# a named role — "the team" is not an accountable owner.
ACCOUNTABLE_OWNER="Beth Connor"

# Who co-signs a T3 waiver (consequence lands on the company).
RISK_FUNCTION="Legal — Matlock"

# Who is assigned to research on this project, and therefore whose job it is to set
# up the evidence layer (EVIDENCE.md) and choose what form it takes.
#
# MUST BE A PERSON, NOT A FUNCTION. "UX", "research", "the team" are all rejected by
# check-evidence.sh, on the same argument ROLES.md already makes about accountable
# owners: a register owned by everyone is owned by nobody. Setting up where evidence
# lives is a judgment somebody makes; a function name cannot make it.
RESEARCH_OWNER="Beth Nam"

# How strictly to read CLAUDE.md §9b's PROCEED-FLAGGED constraints — an onboarding
# choice, because it is a question about your house style, not about correctness.
#
# §9b says PROCEED-FLAGGED means: mark outputs provisional, surface [CS:] tags visibly,
# do not claim validation. J-4 in check-judgment.sh looks for those in machine_behavior:.
# The question is whether they are a required token set or a posture you can express in
# your own words.
#
#   note  (default)  print which of the three are absent; do not affect the exit code.
#   warn             treat their absence as a finding — exit 25.
#
# THE DEFAULT IS EVIDENCE-BACKED, NOT A GUESS. Swept against the corpus this skeleton
# came from: 28 files declared PROCEED-FLAGGED with a machine_behavior:, exactly two
# lacked all three phrasings, and both were correct — they said "no synthesis presented
# as settled" and "do not claim any of this is committed to their roadmap." A 100%
# false-positive rate. Choose `warn` only if your team decides the three phrasings are
# literal required vocabulary; a check that reddens correct files gets ignored.
J4_MODE="note"

# Who a signature conflict, or a refusal to sign, goes to. Nothing in this repo
# adjudicates a conflict itself — check-roster.sh only makes its absence visible,
# via an OPEN.md HUMAN row. TESTED defaults to false honestly: naming a path is
# not the same as it having held under a real disagreement.
ESCALATION_PATH="Beth Connor"
ESCALATION_PATH_TESTED="false"

# Evidence basis of the document named in INTENT_SPEC — separate from that
# document's own workflow status. "I don't know" resolves to HYPOTHESES: a
# positive claim requires someone able to point at evidence, and admitting a
# first draft is a guess is not a penalty. READ BY: ./check-roster.sh, which
# reports this — it does not judge it.
#   HYPOTHESES  nobody can point at evidence for the load-bearing claims yet
#   FINDINGS    every load-bearing claim has a source someone can point at
#   MIXED       some of each
EVIDENCE_BASIS="HYPOTHESES"

# Gate files, in gate order. Read by check-gates.sh — these are the only place
# the filenames live, so renaming a gate file means editing here and nowhere else.
# Point two keys at the SAME file to merge two gates into one document; the
# inheritance check dedupes and will not ask a file to inherit from itself.
# This example carries an Intent Spec ONLY — there are no gate files in this directory,
# so all three pointers are deliberately empty. A named file that does not exist is a
# broken pointer and hard-fails check-gates.sh before any other check runs; that is the
# correct behaviour and the reason these are blank rather than hopeful.
GATE_1=""
GATE_2=""
GATE_3=""

# The source register check-drift.sh hashes against. Defaults to MANIFEST.md.
MANIFEST="MANIFEST.md"

# ---- evidence wiring (read by check-gates.sh, check-claims.sh) --------------
# FINDINGS: the evidence file claims point at with rests_on:. A project with no
# findings yet leaves this as-is; the check flags an '## Evidence' section that
# points at a file which does not exist, and stays quiet otherwise.
FINDINGS="findings.yaml"

# CORPUS_PATHS: where to look for evidence that might already exist elsewhere.
# Space-separated. Used by check-claims.sh to suggest candidates — it only ever
# prints paths, never content.
CORPUS_PATHS=""

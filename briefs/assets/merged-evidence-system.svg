<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010">
  <style>
    .paper { fill:#efe7d6; }
    .t   { font-family:'Space Mono',Menlo,monospace; fill:#1a1612; }
    .h   { font-family:'Space Mono',Menlo,monospace; font-weight:700; letter-spacing:.08em; fill:#1a1612; }
    .sm  { font-family:'Space Mono',Menlo,monospace; font-size:11px; fill:#1a1612; opacity:.75; }
    .xs  { font-family:'Space Mono',Menlo,monospace; font-size:10px; fill:#1a1612; opacity:.66; }
    .bn  { fill:#f7f0df; stroke:#1F3C96; stroke-width:2.5; }
    .bc  { fill:#f7f0df; stroke:#D8472B; stroke-width:2.5; }
    .sh2 { fill:#f7f0df; stroke:#C99A2E; stroke-width:2.5; }
    .gap { fill:#E8B93A; stroke:#1a1612; stroke-width:2; }
    .band{ fill:#1a1612; opacity:.045; }
    .sd  { fill:#1a1612; opacity:.15; }
    .ar  { stroke:#1a1612; stroke-width:2.2; fill:none; }
  </style>
  <rect class="paper" x="0" y="0" width="1440" height="1010"/>

  <text class="h" x="40" y="42" font-size="21">THE MERGED EVIDENCE SYSTEM — three layers, three different failures</text>
  <text class="sm" x="40" y="64">Each layer has its own artifact, its own validator, and its own way of being wrong. A layer can be perfect and the one below it still sinks the product.</text>

  <!-- legend -->
  <rect class="bn"  x="40"  y="80" width="16" height="16"/><text class="xs" x="64"  y="93">research owns · Beth Nam</text>
  <rect class="bc"  x="250" y="80" width="16" height="16"/><text class="xs" x="274" y="93">UX/product owns · Beth C</text>
  <rect class="sh2" x="470" y="80" width="16" height="16"/><text class="xs" x="494" y="93">shared — both must hold</text>
  <rect class="gap" x="680" y="80" width="16" height="16"/><text class="xs" x="704" y="93">gap — nothing covers this yet</text>
  <text class="xs" x="940" y="93">Numbered gaps are listed in MERGE-NOTES.md, worst first.</text>

  <!-- column headers -->
  <text class="h" x="212" y="128" font-size="12" opacity=".8">THE ARTIFACT</text>
  <text class="h" x="620" y="128" font-size="12" opacity=".8">WHAT CHECKS IT</text>
  <text class="h" x="1004" y="128" font-size="12" opacity=".8">THE QUESTION IT ANSWERS</text>
  <text class="h" x="1258" y="128" font-size="12" opacity=".8">IF IT FAILS</text>

  <!-- ============ LAYER 1 ============ -->
  <rect class="band" x="30" y="142" width="1380" height="196"/>
  <text class="h" x="46" y="176" font-size="15" fill="#1F3C96">LAYER 1</text>
  <text class="h" x="46" y="196" font-size="13" fill="#1F3C96">EVIDENCE</text>
  <text class="xs" x="46" y="216">what we</text>
  <text class="xs" x="46" y="230">actually</text>
  <text class="xs" x="46" y="244">found out</text>

  <rect class="sd" x="206" y="164" width="392" height="150"/>
  <rect class="bn" x="200" y="158" width="392" height="150"/>
  <text class="h"  x="216" y="184" font-size="14">findings.yaml</text>
  <text class="sm" x="216" y="206">claim_type · population_fidelity · claim_scope</text>
  <text class="sm" x="216" y="224">n per instrument · fieldwork_date · review_by</text>
  <text class="sm" x="216" y="242">status · coverage · invalidates_if</text>
  <text class="t"  x="216" y="266" font-size="12" font-weight="700">confidence: ← only a human sets this</text>
  <text class="xs" x="216" y="286">+ the Confluence study page (full evidence)</text>
  <text class="xs" x="216" y="302">+ evidence-rules v0.2 · G14–G18 · the taxonomy</text>

  <rect class="sd" x="626" y="164" width="350" height="98"/>
  <rect class="bn" x="620" y="158" width="350" height="98"/>
  <text class="h"  x="636" y="184" font-size="13">validate_findings.py</text>
  <text class="sm" x="636" y="206">schema · required fields · caps not</text>
  <text class="sm" x="636" y="224">violated inside a single record</text>
  <text class="xs" x="636" y="248">hers · not running in our repo yet → gap 5</text>

  <text class="t"  x="1004" y="188" font-size="13" font-weight="700">Is this finding</text>
  <text class="t"  x="1004" y="208" font-size="13" font-weight="700">labelled honestly?</text>
  <text class="sm" x="1004" y="234">Right rung, real n, named</text>
  <text class="sm" x="1004" y="252">population, still in date.</text>

  <text class="t"  x="1258" y="188" font-size="12" font-weight="700">We believe</text>
  <text class="t"  x="1258" y="206" font-size="12" font-weight="700">something</text>
  <text class="t"  x="1258" y="224" font-size="12" font-weight="700">false.</text>

  <!-- seam 1 -->
  <path class="ar" d="M396 314 L396 356" marker-end="url(#am)"/>
  <rect class="gap" x="424" y="322" width="26" height="26"/><text class="xs" x="431" y="340" font-size="13" font-weight="700">1</text>
  <text class="sm" x="462" y="332" font-size="11" font-weight="700">THE SEAM WHERE MOST DAMAGE HAPPENS — a sound finding, used past what it licenses.</text>
  <text class="xs" x="462" y="348">Both systems are weakest here and it is the layer neither of you built for. This is where the work is.</text>

  <!-- ============ LAYER 2 ============ -->
  <rect class="band" x="30" y="364" width="1380" height="268"/>
  <text class="h" x="46" y="398" font-size="15" fill="#C99A2E">LAYER 2</text>
  <text class="h" x="46" y="418" font-size="13" fill="#C99A2E">INTERPRETATION</text>
  <text class="xs" x="46" y="438">what we say</text>
  <text class="xs" x="46" y="452">it means</text>
  <text class="xs" x="46" y="474" font-weight="700">the contested</text>
  <text class="xs" x="46" y="488" font-weight="700">middle</text>

  <rect class="sd" x="206" y="386" width="392" height="108"/>
  <rect class="sh2" x="200" y="380" width="392" height="108"/>
  <text class="h"  x="216" y="406" font-size="14">ux.md — inline prose claims</text>
  <text class="sm" x="216" y="428">[CS:] · [R]/[D]/[A]/[?] · [WOBBLY] · [THIN]</text>
  <text class="t"  x="216" y="450" font-size="12" font-weight="700" fill="#1F3C96">+ proposed: [R:obs]/[R:said] [SCOPE:] [FIT:]</text>
  <text class="xs" x="216" y="470">a tag per sentence — tells a READER what holds it up</text>
  <text class="xs" x="216" y="486">owner: · research_check: ← the two-name rule, ours</text>

  <rect class="sd" x="206" y="510" width="392" height="118"/>
  <rect class="bc" x="200" y="504" width="392" height="118"/>
  <text class="h"  x="216" y="530" font-size="14">ux.md — ## Evidence block</text>
  <text class="sm" x="216" y="552">rests_on: · asserted_at: · stance: · handling:</text>
  <text class="sm" x="216" y="570">inherited_on: ← drift against fieldwork_date</text>
  <text class="xs" x="216" y="592">a record per dependency — tells a MACHINE what to enforce</text>
  <text class="xs" x="216" y="608">different object from a tag — nothing says so → gap 2</text>

  <rect class="sd" x="626" y="386" width="350" height="98"/>
  <rect class="bn" x="620" y="380" width="350" height="98"/>
  <text class="h"  x="636" y="406" font-size="13">research.md v2.2 + GATE 16</text>
  <text class="sm" x="636" y="428">keep the verb on the rung · don't widen</text>
  <text class="sm" x="636" y="446">scope · counts not rates · state absences</text>
  <text class="xs" x="636" y="470" font-weight="700">prose rules — READ by an agent, enforced by nobody</text>

  <rect class="sd" x="626" y="510" width="350" height="118"/>
  <rect class="bc" x="620" y="504" width="350" height="118"/>
  <text class="h"  x="636" y="530" font-size="13">check-gates.sh · evidence check</text>
  <text class="sm" x="636" y="552">recomputes the ceiling from L1 fields</text>
  <text class="sm" x="636" y="570">fails only an overclaim · flags the rest</text>
  <text class="xs" x="636" y="614" font-weight="700">the prose above it is unchecked → gap 3</text>
  <text class="xs" x="636" y="596">runs · exits 1 · reads the block, not the prose</text>

  <text class="t"  x="1004" y="410" font-size="13" font-weight="700">Does this claim</text>
  <text class="t"  x="1004" y="430" font-size="13" font-weight="700">exceed its evidence?</text>
  <text class="sm" x="1004" y="456">More certain, more general,</text>
  <text class="sm" x="1004" y="474">more quantified, more</text>
  <text class="sm" x="1004" y="492">behavioural, or more current</text>
  <text class="sm" x="1004" y="510">than what is under it.</text>
  <text class="xs" x="1004" y="536">Her one rule and our ceiling</text>
  <text class="xs" x="1004" y="552">check are the same sentence,</text>
  <text class="xs" x="1004" y="568">reached from opposite ends.</text>

  <text class="t"  x="1258" y="410" font-size="12" font-weight="700">We believe</text>
  <text class="t"  x="1258" y="428" font-size="12" font-weight="700">something</text>
  <text class="t"  x="1258" y="446" font-size="12" font-weight="700">true, and</text>
  <text class="t"  x="1258" y="464" font-size="12" font-weight="700">act beyond</text>
  <text class="t"  x="1258" y="482" font-size="12" font-weight="700">it.</text>
  <text class="xs" x="1258" y="508">Nobody downstream</text>
  <text class="xs" x="1258" y="524">can see the gap</text>
  <text class="xs" x="1258" y="540">from where they</text>
  <text class="xs" x="1258" y="556">are standing.</text>

  <!-- seam 2 -->
  <path class="ar" d="M396 628 L396 652" marker-end="url(#am)"/>
  <rect class="gap" x="424" y="620" width="26" height="26"/><text class="xs" x="431" y="638" font-size="13" font-weight="700">4</text>
  <text class="sm" x="462" y="630" font-size="11" font-weight="700">A requirement keeps its id but loses its basis — the UXI row outlives the finding that justified it.</text>
  <text class="xs" x="462" y="646">inherited_on vs fieldwork_date catches drift at L2. Nothing re-checks a §5 row after research re-grades.</text>

  <!-- ============ LAYER 3 ============ -->
  <rect class="band" x="30" y="660" width="1380" height="212"/>
  <text class="h" x="46" y="694" font-size="15" fill="#D8472B">LAYER 3</text>
  <text class="h" x="46" y="714" font-size="13" fill="#D8472B">COMMITMENT</text>
  <text class="xs" x="46" y="734">what we</text>
  <text class="xs" x="46" y="748">promised</text>
  <text class="xs" x="46" y="762">to build</text>

  <rect class="sd" x="206" y="682" width="392" height="164"/>
  <rect class="bc" x="200" y="676" width="392" height="164"/>
  <text class="h"  x="216" y="702" font-size="14">Intent Spec §5 → vision.md → design.md</text>
  <text class="sm" x="216" y="724">UXI-## · one canonical table · append-only</text>
  <text class="sm" x="216" y="742">basis: [R]/[D]/[A]/[?] per row</text>
  <text class="sm" x="216" y="760">criteria inherit forward, never dropped</text>
  <text class="sm" x="216" y="778">confidence_regime per document</text>
  <text class="xs" x="216" y="800">OPEN.md · CONTESTED ← hand-rolled shim for</text>
  <text class="xs" x="216" y="816">her requested contradicts / superseded_by → gap 6</text>
  <text class="xs" x="216" y="836">constitution VII · CLAUDE.md · ux-kickoff = the wiring</text>

  <rect class="sd" x="626" y="682" width="350" height="122"/>
  <rect class="bc" x="620" y="676" width="350" height="122"/>
  <text class="h"  x="636" y="702" font-size="13">check-gates.sh · chain checks</text>
  <text class="sm" x="636" y="724">criteria inheritance · §5 resolution</text>
  <text class="sm" x="636" y="742">regime gating · owner/research_check</text>
  <text class="sm" x="636" y="760">evidence_basis vs its own rows</text>
  <text class="xs" x="636" y="784">runs · exits 1 · three legs wired</text>

  <text class="t"  x="1004" y="706" font-size="13" font-weight="700">Did a user need get</text>
  <text class="t"  x="1004" y="726" font-size="13" font-weight="700">dropped or drift?</text>
  <text class="sm" x="1004" y="752">And is the document honest</text>
  <text class="sm" x="1004" y="770">about being unfinished?</text>
  <text class="xs" x="1004" y="796">Unticked is fine. Silence is not.</text>

  <text class="t"  x="1258" y="706" font-size="12" font-weight="700">We knew the</text>
  <text class="t"  x="1258" y="724" font-size="12" font-weight="700">right thing</text>
  <text class="t"  x="1258" y="742" font-size="12" font-weight="700">and built</text>
  <text class="t"  x="1258" y="760" font-size="12" font-weight="700">something</text>
  <text class="t"  x="1258" y="778" font-size="12" font-weight="700">else.</text>

  <!-- footer gaps -->
  <rect class="sd" x="46" y="898" width="1364" height="84"/>
  <rect class="sh2" x="40" y="892" width="1364" height="84"/>
  <text class="h" x="58" y="916" font-size="12">STILL UNRESOLVED, AND WHO DECIDES</text>
  <text class="sm" x="58" y="938" font-size="11">2 · two grammars in one file — is the ## Evidence block what rule 1 prohibits? HERS TO RULE   ·   3 · nothing checks prose, so GATE 16 is unenforced — BUILD IT, ours</text>
  <text class="sm" x="58" y="956" font-size="11">5 · evidence-rules v0.2 is canonical and not in hand — ASK   ·   7 · three words mean "confidence": [CS:], confidence:, confidence_regime — NAME THEM APART</text>
  <text class="sm" x="58" y="974" font-size="11">8 · G14–G18 fire at spec_ready, our gates at run — declare the order   ·   9 · three copies of the packet, one canonical, unowned — YOURS, and it blocks the edit</text>

  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1a1612"/>
    </marker>
  </defs>
</svg>

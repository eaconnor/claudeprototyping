<!DOCTYPE html>
<html lang="en" data-apx-mode="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>QBR Analyst — Onboarding → Always Current → Draft Review · Laissez Faire Fellows · Apex Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ── APEX BRIDGE — TOKEN CONTRACT (ported verbatim from qbr-draft-flow.html — light-surface, purple-accent crib. Do not swap for the skill's generic dark-navy palette.) ── */
:root {
  --br-color-brand-primary:       #0066cc;
  --br-color-brand-primary-hover: #0052a3;
  --br-color-brand-primary-tint:  #e6f0fa;
  --br-color-brand-accent:        #6d28d9;

  --br-color-surface-app:         #f4f6fb;
  --br-color-surface-panel:       #ffffff;
  --br-color-surface-elevated:    #eef1f8;
  --br-color-surface-sunken:      #e6eaf3;
  --br-color-surface-hover:       #f0f3f8;

  --br-color-ink-primary:         #0d1424;
  --br-color-ink-secondary:       #45506b;
  --br-color-ink-muted:           #6b7790;
  --br-color-ink-inverse:         #ffffff;

  --br-color-border-subtle:       #d8deeb;
  --br-color-border-default:      #c3ccdd;
  --br-color-border-strong:       #94a0b8;

  --br-color-state-success:       #16a34a;
  --br-color-state-success-tint:  #dcfce7;
  --br-color-state-warning:       #d97706;
  --br-color-state-warning-tint:  #fef3c7;
  --br-color-state-danger:        #dc2626;
  --br-color-state-danger-tint:   #fee2e2;
  --br-color-state-info:          #0284c7;
  --br-color-state-info-tint:     #e0f2fe;

  --br-font-family-sans:  "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --br-font-family-brand: "Manrope", -apple-system, sans-serif;
  --br-font-family-mono:  "JetBrains Mono", ui-monospace, monospace;

  --br-radius-sm: 4px;
  --br-radius-md: 6px;
  --br-radius-lg: 10px;

  --br-shadow-sm: 0 1px 2px rgba(15,23,42,.05);
  --br-shadow-md: 0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.05);
  --br-shadow-lg: 0 4px 12px rgba(15,23,42,.10), 0 1px 4px rgba(15,23,42,.06);

  --topbar-bg:     #0a1730;
  --topbar-border: var(--br-color-brand-primary);
  --rail-bg:       #f0eafa;
  --rail-border:   #a78bfa;
  --alpha-accent:  #a78bfa;
  --alpha-soft:    rgba(167,139,250,0.13);
}

[data-apx-mode="dark"] {
  --br-color-surface-app:        #0b1220;
  --br-color-surface-panel:      #111827;
  --br-color-surface-elevated:   #1e293b;
  --br-color-surface-sunken:     #0f172a;
  --br-color-surface-hover:      #1e293b;
  --br-color-ink-primary:        #f1f5f9;
  --br-color-ink-secondary:      #cbd5e1;
  --br-color-ink-muted:          #94a3b8;
  --br-color-border-subtle:      #1e293b;
  --br-color-border-default:     #334155;
  --br-color-border-strong:      #475569;
  --br-color-brand-primary-tint: #0c2845;
  --br-color-state-success-tint: rgba(22,163,74,.18);
  --br-color-state-warning-tint: rgba(217,119,6,.18);
  --br-color-state-danger-tint:  rgba(220,38,38,.18);
  --br-color-state-info-tint:    rgba(2,132,199,.18);
  --br-shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --br-shadow-md: 0 1px 3px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.3);
  --br-shadow-lg: 0 10px 25px rgba(0,0,0,.55), 0 4px 10px rgba(0,0,0,.35);
  --rail-bg: #16112e;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: var(--br-color-surface-app);
  color: var(--br-color-ink-primary);
  font-family: var(--br-font-family-sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; }
table { font-family: var(--br-font-family-sans); }

/* ── TOPBAR ───────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 100; height: 48px;
  background: var(--topbar-bg);
  border-bottom: 2px solid var(--topbar-border);
  display: flex; align-items: center; gap: 12px; padding: 0 24px;
}
.topbar-wordmark {
  font-family: var(--br-font-family-brand);
  font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.92);
  letter-spacing: 0.04em; text-transform: uppercase;
}
.topbar-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.15); }
.topbar-title { font-size: 13px; color: rgba(255,255,255,0.65); }
.topbar-spacer { flex: 1; }
.topbar-badge {
  font-family: var(--br-font-family-mono); font-size: 11px;
  background: rgba(167,139,250,0.2); color: var(--alpha-accent);
  border: 1px solid rgba(167,139,250,0.35); border-radius: 4px; padding: 2px 8px;
}
.theme-btn {
  font-family: var(--br-font-family-mono); font-size: 11px; color: rgba(255,255,255,0.45);
  background: none; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; padding: 3px 10px;
}
.theme-btn:hover { color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.35); }

/* ── APP SHELL: SIDE NAV + MAIN ───────────────────────── */
.app-shell { display: flex; align-items: flex-start; }
.side-nav {
  width: 232px; flex-shrink: 0; background: var(--br-color-surface-panel);
  border-right: 1px solid var(--br-color-border-subtle); padding: 20px 14px;
  display: flex; flex-direction: column; gap: 3px;
  position: sticky; top: 48px; height: calc(100vh - 48px); overflow-y: auto;
}
.side-nav-label {
  font-family: var(--br-font-family-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--br-color-ink-muted); padding: 4px 10px 8px;
}
.side-nav-item {
  display: flex; flex-direction: column; gap: 2px; text-align: left; background: none;
  border: none; border-radius: var(--br-radius-md); padding: 10px 12px;
  color: var(--br-color-ink-secondary); font-size: 13px; font-weight: 600;
}
.side-nav-item:hover { background: var(--br-color-surface-hover); }
.side-nav-item.active { background: var(--br-color-brand-primary-tint); color: var(--br-color-brand-primary); }
.side-nav-item .sn-sub { font-size: 11px; font-weight: 400; color: var(--br-color-ink-muted); }
.side-nav-item.active .sn-sub { color: var(--br-color-brand-primary); opacity: .85; }
.side-nav-foot {
  margin-top: auto; font-size: 10.5px; color: var(--br-color-ink-muted); padding: 12px 10px 4px;
  border-top: 1px solid var(--br-color-border-subtle); line-height: 1.5;
}
.main-view { flex: 1; min-width: 0; }
.page { max-width: 1180px; margin: 0 auto; padding: 28px 24px 56px; display: flex; flex-direction: column; gap: 24px; }

.section-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.section-title { font-family: var(--br-font-family-mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--br-color-ink-muted); }
.section-hr { flex: 1; height: 1px; background: var(--br-color-border-subtle); }
.stage-label {
  font-family: var(--br-font-family-mono); font-size: 10px; font-weight: 700;
  color: var(--br-color-brand-accent); background: rgba(109,40,217,0.08);
  border: 1px solid rgba(109,40,217,0.25); border-radius: 4px; padding: 2px 8px;
  text-transform: uppercase; letter-spacing: 0.06em;
}

/* ── PAGE TITLE BLOCK ─────────────────────────────────── */
.page-title-block {
  background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-subtle);
  border-radius: var(--br-radius-lg); padding: 20px 24px; box-shadow: var(--br-shadow-sm);
  display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;
}
.page-title-block h1 { font-family: var(--br-font-family-brand); font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.page-title-block .sub { font-size: 13px; color: var(--br-color-ink-secondary); }

/* ── DRAFT REVIEW TAB STRIP ───────────────────────────────── */
.dr-tabstrip { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--br-color-border-default); padding-bottom: 0; }
.dr-tab {
  font-family: var(--br-font-family-sans); font-size: 12.5px; font-weight: 700; cursor: pointer;
  border: none; border-radius: var(--br-radius-sm) var(--br-radius-sm) 0 0; padding: 9px 14px;
  background: var(--br-color-surface-panel); color: var(--br-color-ink-secondary); opacity: .72;
  transition: opacity .15s;
}
.dr-tab:hover { opacity: 1; }
.dr-tab.active { opacity: 1; box-shadow: inset 0 -3px 0 currentColor; }
.dr-tab.finalized { opacity: 1; }
.dr-tab.green { color: var(--br-color-state-success); }
.dr-tab.blue { color: var(--br-color-brand-primary); }
.dr-tab.gold { color: var(--br-color-state-warning); }
.dr-tab.green.active, .dr-tab.green.finalized { background: var(--br-color-state-success-tint); }
.dr-tab.blue.active, .dr-tab.blue.finalized { background: var(--br-color-brand-primary-tint); }
.dr-tab.gold.active, .dr-tab.gold.finalized { background: var(--br-color-state-warning-tint); }

.dr-finalize-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-default);
  border-radius: var(--br-radius-md); padding: 10px 14px; margin-top: 4px;
}
.dr-finalize-bar .dfb-status { font-size: 12.5px; font-weight: 600; color: var(--br-color-ink-secondary); }
.dr-finalize-bar.done { border-color: rgba(22,163,74,.4); background: var(--br-color-state-success-tint); }
.dr-finalize-bar.done .dfb-status { color: var(--br-color-state-success); }

#dr-followup-notes {
  width: 100%; min-height: 90px; font-size: 12.5px; font-family: var(--br-font-family-sans); padding: 10px;
  border: 1px solid var(--br-color-border-default); border-radius: var(--br-radius-sm); background: var(--br-color-surface-app);
  color: var(--br-color-ink-primary); resize: vertical;
}
.meta-pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill {
  font-family: var(--br-font-family-mono); font-size: 11px; padding: 3px 10px; border-radius: 99px;
  border: 1px solid var(--br-color-border-default); color: var(--br-color-ink-secondary);
  background: var(--br-color-surface-elevated); white-space: nowrap;
}
.pill.status {
  border-color: var(--br-color-border-strong); color: var(--br-color-ink-secondary);
  font-weight: 700; transition: all .3s ease;
}
.pill.status.ready { background: var(--br-color-state-success-tint); color: var(--br-color-state-success); border-color: rgba(22,163,74,.35); }

.breadcrumb-link {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700;
  color: var(--br-color-brand-primary); background: none; border: none; padding: 0;
}
.breadcrumb-link:hover { text-decoration: underline; }

/* ── A-TAG NOTE ───────────────────────────────────────── */
.a-tag-note {
  font-family: var(--br-font-family-mono); font-size: 10.5px; color: var(--br-color-state-warning);
  background: var(--br-color-state-warning-tint); border: 1px solid rgba(217,119,6,.35);
  border-radius: var(--br-radius-md); padding: 7px 12px; width: fit-content;
}

.scope-banner {
  font-size: 12.5px; color: var(--br-color-brand-primary); background: var(--br-color-brand-primary-tint);
  border: 1px solid rgba(0,102,204,.3); border-radius: var(--br-radius-sm); padding: 9px 12px;
}
.scope-banner code { font-family: var(--br-font-family-mono); font-size: 11px; }

/* ── WIZARD ───────────────────────────────────────────── */
.wizard-wrap { display: flex; flex-direction: column; gap: 20px; }
.stepper {
  display: flex; align-items: center; background: var(--br-color-surface-panel);
  border: 1px solid var(--br-color-border-subtle); border-radius: var(--br-radius-lg);
  padding: 16px 20px; box-shadow: var(--br-shadow-sm); overflow-x: auto;
}
.step { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.step-circle {
  width: 26px; height: 26px; border-radius: 99px; display: flex; align-items: center; justify-content: center;
  font-family: var(--br-font-family-mono); font-size: 12px; font-weight: 700;
  border: 2px solid var(--br-color-border-default); color: var(--br-color-ink-muted); flex-shrink: 0;
}
.step-label { font-size: 12px; color: var(--br-color-ink-muted); font-weight: 600; white-space: nowrap; }
.step.active .step-circle { border-color: var(--br-color-brand-primary); background: var(--br-color-brand-primary); color: #fff; }
.step.active .step-label { color: var(--br-color-brand-primary); }
.step.done .step-circle { border-color: var(--br-color-state-success); background: var(--br-color-state-success-tint); color: var(--br-color-state-success); }
.step.done .step-label { color: var(--br-color-state-success); }
.step-connector { flex: 0 0 28px; height: 2px; background: var(--br-color-border-subtle); margin: 0 4px; }
.step-connector.done { background: var(--br-color-state-success); }

.wizard-pane {
  background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-subtle);
  border-radius: var(--br-radius-lg); box-shadow: var(--br-shadow-sm); padding: 24px 26px;
  display: flex; flex-direction: column; gap: 18px;
}
.wizard-pane h2 { font-family: var(--br-font-family-brand); font-size: 17px; font-weight: 800; }
.wizard-pane .pane-sub { font-size: 13px; color: var(--br-color-ink-secondary); margin-top: -8px; }
.wizard-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.wizard-footer .wf-left { display: flex; gap: 10px; }

.btn {
  font-size: 12.5px; font-weight: 600; padding: 8px 16px; border-radius: var(--br-radius-md);
  border: 1px solid var(--br-color-border-default); background: var(--br-color-surface-panel);
  color: var(--br-color-ink-secondary);
}
.btn:hover { background: var(--br-color-surface-hover); }
.btn.accept { border-color: rgba(22,163,74,.4); color: var(--br-color-state-success); }
.btn.accept:hover { background: var(--br-color-state-success-tint); }
.btn.edit { border-color: rgba(0,102,204,.4); color: var(--br-color-brand-primary); }
.btn.edit:hover { background: var(--br-color-brand-primary-tint); }
.btn.dispute { border-color: rgba(220,38,38,.4); color: var(--br-color-state-danger); }
.btn.dispute:hover { background: var(--br-color-state-danger-tint); }
.btn.dispute-link {
  border: none; background: none; text-decoration: underline; color: var(--br-color-ink-muted);
  padding: 4px 0; font-weight: 500;
}
.btn.dispute-link:hover { color: var(--br-color-state-danger); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: none; }
.btn.primary { background: var(--br-color-brand-primary); border-color: var(--br-color-brand-primary); color: #fff; font-weight: 700; padding: 10px 20px; }
.btn.primary:hover { background: var(--br-color-brand-primary-hover); }
.btn.save { border-color: rgba(0,102,204,.5); background: var(--br-color-brand-primary); color: #fff; }
.btn.save:hover { background: var(--br-color-brand-primary-hover); }
.btn.cancel { color: var(--br-color-ink-muted); }
.btn.add-q { border-color: rgba(0,102,204,.4); color: var(--br-color-brand-primary); }

.coworker-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
@media (max-width: 860px) { .coworker-grid { grid-template-columns: 1fr; } }
.coworker-card {
  border: 1px solid var(--br-color-border-subtle); border-radius: var(--br-radius-md); padding: 16px;
  display: flex; flex-direction: column; gap: 8px; background: var(--br-color-surface-elevated);
}
.coworker-card.active { border-color: var(--br-color-brand-primary); background: var(--br-color-brand-primary-tint); }
.coworker-card.done { border-color: rgba(22,163,74,.35); }
.cc-name { font-weight: 700; font-size: 13.5px; }
.cc-desc { font-size: 12px; color: var(--br-color-ink-secondary); line-height: 1.5; }
.cc-status {
  font-family: var(--br-font-family-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
  padding: 3px 9px; border-radius: 99px; width: fit-content; border: 1px solid; font-weight: 700;
}
.cc-status.done { color: var(--br-color-state-success); background: var(--br-color-state-success-tint); border-color: rgba(22,163,74,.4); }
.cc-status.active { color: var(--br-color-brand-primary); background: #fff; border-color: var(--br-color-brand-primary); }
.cc-status.later { color: var(--br-color-ink-muted); background: var(--br-color-surface-panel); border-color: var(--br-color-border-default); }

.onboard-card {
  background: var(--br-color-surface-elevated); border: 1px solid var(--br-color-border-default);
  border-radius: var(--br-radius-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
}
.onboard-card h3 { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--br-color-ink-secondary); }
.onboard-card h4 { font-size: 12px; font-weight: 700; color: var(--br-color-ink-primary); margin-bottom: 4px; }
.onboard-card .oc-lede { font-size: 13px; color: var(--br-color-ink-primary); }

.upload-drop {
  display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
  border: 2px dashed var(--br-color-border-strong); border-radius: var(--br-radius-md);
  padding: 22px 16px; text-align: center; background: var(--br-color-surface-panel);
}
.upload-drop:hover { border-color: var(--br-color-brand-primary); background: var(--br-color-brand-primary-tint); }
.upload-drop .ud-icon { font-size: 22px; color: var(--br-color-brand-primary); }
.upload-drop .ud-text { font-size: 13px; font-weight: 600; color: var(--br-color-ink-primary); }
.upload-drop .ud-sub { font-size: 11px; color: var(--br-color-ink-muted); font-family: var(--br-font-family-mono); }
.upload-list { display: flex; flex-direction: column; gap: 6px; }
.upload-row {
  display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 6px 10px;
  background: var(--br-color-surface-panel); border-radius: var(--br-radius-sm); border: 1px solid var(--br-color-border-subtle);
}
.upload-row .ul-name { flex: 1; font-weight: 600; }
.upload-row .ul-size { color: var(--br-color-ink-muted); font-family: var(--br-font-family-mono); font-size: 11px; }
.upload-row .ul-remove { background: none; border: none; cursor: pointer; color: var(--br-color-ink-muted); font-size: 13px; padding: 2px 4px; }
.upload-row .ul-remove:hover { color: var(--br-color-state-danger); }
#ob-notes {
  width: 100%; min-height: 70px; font-size: 12.5px; font-family: var(--br-font-family-sans); padding: 10px;
  border: 1px solid var(--br-color-border-default); border-radius: var(--br-radius-sm); background: var(--br-color-surface-app);
  color: var(--br-color-ink-primary); resize: vertical;
}
.hist-section { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid var(--br-color-border-subtle); }
.hist-section:first-of-type { border-top: none; padding-top: 0; }
.hist-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--br-color-ink-primary); display: flex; flex-direction: column; gap: 6px; }
.hist-promises { display: flex; flex-direction: column; gap: 8px; }
.hist-promise-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  font-size: 13px; padding: 8px 10px; background: var(--br-color-surface-panel); border-radius: var(--br-radius-sm);
}
.hist-promise-row .hp-main { flex: 1; min-width: 200px; }
.hp-untracked { font-size: 11px; color: var(--br-color-ink-muted); font-style: italic; }

.mini-table { width: 100%; border-collapse: collapse; font-size: 12.5px; background: var(--br-color-surface-panel); border-radius: var(--br-radius-sm); }
.mini-table th {
  text-align: left; font-family: var(--br-font-family-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--br-color-ink-muted); padding: 7px 10px; border-bottom: 1px solid var(--br-color-border-default);
}
.mini-table td { padding: 8px 10px; border-bottom: 1px solid var(--br-color-border-subtle); }
.mini-table tr:last-child td { border-bottom: none; }
.mini-table .more-row td { color: var(--br-color-ink-muted); font-style: italic; font-size: 11.5px; }

.field-select {
  font-size: 12.5px; font-family: var(--br-font-family-sans); padding: 6px 10px; border-radius: var(--br-radius-sm);
  border: 1px solid var(--br-color-border-default); background: var(--br-color-surface-app); color: var(--br-color-ink-primary);
}

.branch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 700px) { .branch-grid { grid-template-columns: 1fr; } }
.branch-option {
  border: 2px solid var(--br-color-border-default); border-radius: var(--br-radius-md); padding: 16px;
  background: var(--br-color-surface-elevated); display: flex; flex-direction: column; gap: 6px; text-align: left;
}
.branch-option:hover { border-color: var(--br-color-brand-primary); }
.branch-option.selected { border-color: var(--br-color-brand-primary); background: var(--br-color-brand-primary-tint); }
.branch-option .bo-title { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.branch-option .bo-desc { font-size: 12px; color: var(--br-color-ink-secondary); line-height: 1.5; }
.branch-option .bo-cs { font-family: var(--br-font-family-mono); font-size: 10px; color: var(--br-color-ink-muted); }

.vl-card {
  background: var(--br-color-surface-elevated); border: 1px solid var(--br-color-border-default);
  border-radius: var(--br-radius-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
}
.vl-input-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vl-input-row label { font-size: 13px; font-weight: 600; color: var(--br-color-ink-primary); }
.vl-input-row input {
  width: 110px; font-size: 13px; font-family: var(--br-font-family-mono); padding: 8px 10px;
  border-radius: var(--br-radius-md); border: 1px solid var(--br-color-border-default);
  background: var(--br-color-surface-app); color: var(--br-color-ink-primary);
}
.vl-distinguish {
  font-size: 11.5px; color: var(--br-color-ink-muted); border-top: 1px dashed var(--br-color-border-subtle);
  padding-top: 10px; line-height: 1.55;
}
.vl-distinguish strong { color: var(--br-color-ink-secondary); }
.vl-echo { font-size: 12.5px; color: var(--br-color-brand-primary); font-weight: 600; }

.magic-panel {
  background: linear-gradient(135deg, var(--br-color-brand-primary-tint), var(--br-color-surface-panel));
  border: 1px solid rgba(0,102,204,.25); border-radius: var(--br-radius-lg); padding: 26px;
  display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center;
}
.magic-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; width: 100%; }
@media (max-width: 700px) { .magic-grid { grid-template-columns: 1fr; } }
.magic-stat { display: flex; flex-direction: column; gap: 4px; }
.magic-stat .ms-num { font-family: var(--br-font-family-mono); font-size: 34px; font-weight: 800; color: var(--br-color-brand-primary); }
.magic-stat.risk .ms-num { color: var(--br-color-state-danger); }
.magic-stat.overdue .ms-num { color: var(--br-color-state-warning); }
.magic-stat .ms-label { font-size: 12px; color: var(--br-color-ink-secondary); }
.compute-btn {
  font-size: 14px; font-weight: 700; padding: 13px 26px; border-radius: var(--br-radius-md);
  background: var(--br-color-brand-primary); color: #fff; border: none;
}
.compute-btn:hover { background: var(--br-color-brand-primary-hover); }
.magic-tier-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.cadence-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.cadence-table th {
  text-align: left; font-family: var(--br-font-family-mono); font-size: 10.5px; text-transform: uppercase;
  color: var(--br-color-ink-muted); padding: 8px 12px; border-bottom: 1px solid var(--br-color-border-default);
}
.cadence-table td { padding: 11px 12px; border-bottom: 1px solid var(--br-color-border-subtle); vertical-align: middle; }
.cadence-note {
  background: var(--br-color-state-warning-tint); border: 1px solid rgba(217,119,6,.3); border-radius: var(--br-radius-md);
  padding: 12px 16px; font-size: 12.5px; color: var(--br-color-ink-primary);
}

/* ── ALWAYS CURRENT ───────────────────────────────────── */
.ac-summary {
  display: flex; gap: 22px; flex-wrap: wrap; background: var(--topbar-bg); border-radius: var(--br-radius-lg);
  padding: 18px 22px; color: #fff; box-shadow: var(--br-shadow-md);
}
.ac-summary-stat { display: flex; flex-direction: column; gap: 2px; }
.ac-summary-stat .val { font-family: var(--br-font-family-mono); font-size: 24px; font-weight: 800; }
.ac-summary-stat .lbl { font-size: 11.5px; color: rgba(255,255,255,.68); max-width: 180px; }
.ac-summary-note { margin-left: auto; align-self: center; font-size: 11px; color: rgba(255,255,255,.55); font-style: italic; }

.ac-filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ac-filter-chip {
  font-family: var(--br-font-family-mono); font-size: 11.5px; padding: 6px 14px; border-radius: 99px;
  border: 1px solid var(--br-color-border-default); background: var(--br-color-surface-panel); color: var(--br-color-ink-secondary);
}
.ac-filter-chip.active { background: var(--br-color-brand-primary); color: #fff; border-color: var(--br-color-brand-primary); }

.ac-table-wrap {
  background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-subtle);
  border-radius: var(--br-radius-lg); box-shadow: var(--br-shadow-sm); overflow: hidden;
}
.ac-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ac-table th {
  text-align: left; font-family: var(--br-font-family-mono); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--br-color-ink-muted); padding: 10px 16px;
  border-bottom: 1px solid var(--br-color-border-default); background: var(--br-color-surface-elevated);
}
.ac-table td { padding: 11px 16px; border-bottom: 1px solid var(--br-color-border-subtle); }
.ac-row { }
.ac-row-live { cursor: pointer; }
.ac-row-live:hover { background: var(--br-color-surface-hover); }
.ac-row-dim { cursor: pointer; }
.ac-row-dim:hover { background: var(--br-color-surface-hover); }
.ac-live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 99px; background: var(--br-color-state-success); margin-right: 6px; }
.cadence-tag, .risk-tag {
  font-family: var(--br-font-family-mono); font-size: 10.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid; font-weight: 700;
}
.cadence-tag.on-track { background: var(--br-color-state-success-tint); color: var(--br-color-state-success); border-color: rgba(22,163,74,.4); }
.cadence-tag.overdue { background: var(--br-color-state-warning-tint); color: var(--br-color-state-warning); border-color: rgba(217,119,6,.4); }
.risk-tag.flagged { background: var(--br-color-state-danger-tint); color: var(--br-color-state-danger); border-color: rgba(220,38,38,.4); }
.risk-tag.clear { background: var(--br-color-surface-elevated); color: var(--br-color-ink-muted); border-color: var(--br-color-border-default); }

.tierbadge {
  display: inline-flex; align-items: center; gap: 3px; font-family: var(--br-font-family-mono);
  font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; border: 1px solid;
  text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap;
}
.tierbadge.measured    { background: var(--br-color-state-success-tint); color: var(--br-color-state-success); border-color: rgba(22,163,74,.4); }
.tierbadge.benchmarked { background: var(--br-color-state-info-tint);    color: var(--br-color-state-info);    border-color: rgba(2,132,199,.4); }
.tierbadge.estimated   { background: var(--br-color-state-warning-tint); color: var(--br-color-state-warning); border-color: rgba(217,119,6,.4); }
.tierbadge.unverified  { background: var(--br-color-state-danger-tint);  color: var(--br-color-state-danger);  border-color: rgba(220,38,38,.4); }
.tierbadge.tier-a { background: var(--br-color-state-success-tint); color: var(--br-color-state-success); border-color: rgba(22,163,74,.4); }
.tierbadge.tier-b { background: var(--br-color-state-info-tint); color: var(--br-color-state-info); border-color: rgba(2,132,199,.4); }
.tierbadge.tier-c { background: var(--br-color-state-warning-tint); color: var(--br-color-state-warning); border-color: rgba(217,119,6,.4); }
.tierbadge.tier-d { background: var(--br-color-surface-elevated); color: var(--br-color-ink-muted); border-color: var(--br-color-border-default); }

.status-pill {
  font-family: var(--br-font-family-mono); font-size: 9.5px; font-weight: 700; padding: 2px 7px;
  border-radius: 4px; border: 1px solid var(--br-color-border-default); color: var(--br-color-ink-muted);
  background: var(--br-color-surface-elevated); white-space: nowrap;
}
.status-pill.accepted  { background: var(--br-color-state-success-tint); color: var(--br-color-state-success); border-color: rgba(22,163,74,.4); }
.status-pill.edited    { background: var(--br-color-brand-primary-tint); color: var(--br-color-brand-primary); border-color: rgba(0,102,204,.4); }
.status-pill.escalated { background: rgba(109,40,217,0.10); color: var(--br-color-brand-accent); border-color: rgba(109,40,217,.4); }
.status-pill.resolved  { background: var(--br-color-state-success-tint); color: var(--br-color-state-success); border-color: rgba(22,163,74,.4); }
.status-pill.flagged   { background: var(--br-color-state-warning-tint); color: var(--br-color-state-warning); border-color: rgba(217,119,6,.4); }

.toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--br-color-ink-primary); color: #fff; font-size: 13px;
  padding: 12px 18px; border-radius: var(--br-radius-md); box-shadow: var(--br-shadow-lg); z-index: 500;
  max-width: 340px; opacity: 0; transform: translateY(10px); transition: all .25s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ── CYCLE MEMORY STRIP ───────────────────────────────── */
.cycle-strip {
  background: var(--topbar-bg); border-radius: var(--br-radius-md); padding: 12px 20px;
  display: flex; flex-wrap: wrap; gap: 16px; align-items: center; cursor: pointer;
  border: none; text-align: left; width: 100%;
}
.cycle-strip:hover { background: #0d1e3d; }
.cycle-strip .cs-label {
  font-family: var(--br-font-family-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.08em; color: rgba(255,255,255,0.45); flex-shrink: 0;
}
.cycle-strip .cs-text { font-size: 13px; color: rgba(255,255,255,0.85); flex: 1; }
.cycle-strip .cs-text strong { color: #fff; }
.cycle-strip .cs-progress {
  font-family: var(--br-font-family-mono); font-size: 12px; font-weight: 700;
  color: var(--br-color-state-warning); background: rgba(217,119,6,0.18);
  border: 1px solid rgba(217,119,6,0.35); border-radius: 99px; padding: 3px 10px;
}
.cycle-strip .cs-arrow { color: var(--alpha-accent); font-family: var(--br-font-family-mono); font-size: 12px; }

/* ── GAP BANNER ───────────────────────────────────────── */
.gap-banner {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: var(--br-radius-md);
  background: var(--br-color-state-warning-tint); border: 1px solid rgba(217,119,6,0.35);
  cursor: pointer; width: 100%; text-align: left;
}
.gap-banner:hover { border-color: rgba(217,119,6,0.55); }
.gap-banner .gb-icon { font-size: 18px; }
.gap-banner .gb-text { font-size: 13px; color: var(--br-color-ink-primary); flex: 1; }
.gap-banner .gb-text strong { font-family: var(--br-font-family-mono); }
.gap-banner .gb-cta { font-family: var(--br-font-family-mono); font-size: 11px; color: var(--br-color-state-warning); font-weight: 700; white-space: nowrap; }

/* ── CARD GRID (stage 3 content blocks) ──────────────── */
.block-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
@media (max-width: 860px) { .block-grid { grid-template-columns: 1fr; } }

.content-card {
  background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-subtle);
  border-radius: var(--br-radius-lg); padding: 18px 20px; box-shadow: var(--br-shadow-sm);
  display: flex; flex-direction: column; gap: 10px;
}
.content-card h3 {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--br-color-ink-muted); display: flex; align-items: center; gap: 8px;
}
.content-card p { font-size: 13px; color: var(--br-color-ink-secondary); line-height: 1.6; }
.content-card .cs-tag { font-family: var(--br-font-family-mono); font-size: 10px; color: var(--br-color-ink-muted); opacity: .7; }

.ask-highlight {
  background: var(--br-color-brand-primary-tint); border: 1px solid rgba(0,102,204,0.25);
  border-radius: var(--br-radius-md); padding: 10px 14px; font-size: 13px; color: var(--br-color-ink-primary);
}
.ask-highlight strong { color: var(--br-color-brand-primary); }

/* ── REHEARSE TOGGLE ──────────────────────────────────── */
.rehearse-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.rehearse-chip {
  font-size: 12px; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--br-color-border-default);
  background: var(--br-color-surface-elevated); color: var(--br-color-ink-secondary);
}
.rehearse-chip:hover { border-color: var(--br-color-brand-primary); }
.rehearse-chip.selected {
  background: var(--br-color-brand-primary-tint); color: var(--br-color-brand-primary);
  border-color: var(--br-color-brand-primary); font-weight: 600;
}
.rehearse-chip.selected::before { content: '✓ '; }

/* ── STAGE 4 HEADER ROW ───────────────────────────────── */
.stage4-header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.stage4-eyebrow { font-size: 12px; color: var(--br-color-ink-muted); }

/* ── EVIDENCE TRAIL ── */
.evidence-trail {
  background: var(--br-color-surface-sunken); border: 1px solid var(--br-color-border-default);
  border-radius: var(--br-radius-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
}
.et-label {
  display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px;
  font-family: var(--br-font-family-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--br-color-ink-muted);
}
.et-label .et-owner { color: var(--br-color-brand-accent); }
.et-rows { display: flex; flex-direction: column; gap: 6px; }
.et-row {
  display: grid; grid-template-columns: 150px 1fr auto; gap: 10px; align-items: start;
  font-family: var(--br-font-family-mono); font-size: 11.5px; padding-bottom: 6px;
  border-bottom: 1px dashed var(--br-color-border-subtle);
}
.et-row:last-child { border-bottom: none; padding-bottom: 0; }
.et-source { color: var(--br-color-ink-secondary); font-weight: 700; white-space: nowrap; }
.et-source .et-src-type { display: block; font-size: 9.5px; color: var(--br-color-ink-muted); font-weight: 400; text-transform: uppercase; letter-spacing: .04em; }
.et-reading { color: var(--br-color-ink-primary); font-family: var(--br-font-family-sans); font-size: 12px; line-height: 1.45; }
.et-flag {
  font-family: var(--br-font-family-mono); font-size: 9.5px; font-weight: 700; padding: 2px 8px;
  border-radius: 99px; border: 1px solid; white-space: nowrap; align-self: start;
}
.et-flag.match    { background: var(--br-color-state-success-tint); color: var(--br-color-state-success); border-color: rgba(22,163,74,.4); }
.et-flag.mismatch { background: var(--br-color-state-warning-tint); color: var(--br-color-state-warning); border-color: rgba(217,119,6,.4); }
.et-flag.single   { background: var(--br-color-state-danger-tint); color: var(--br-color-state-danger); border-color: rgba(220,38,38,.4); }
.et-reconciliation {
  font-family: var(--br-font-family-sans); font-size: 12px; color: var(--br-color-ink-secondary);
  border-top: 1px solid var(--br-color-border-default); padding-top: 10px; line-height: 1.5;
}
.et-reconciliation strong { color: var(--br-color-ink-primary); }
.et-cs { display: block; font-family: var(--br-font-family-mono); font-size: 9.5px; color: var(--br-color-ink-muted); opacity: .8; margin-top: 6px; }

/* ── STAGE 4 GRID ─────────────────────────────────────── */
.stage4-grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .stage4-grid { grid-template-columns: 1fr; } }

.findings-sidebar {
  background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-subtle);
  border-radius: var(--br-radius-lg); box-shadow: var(--br-shadow-sm); overflow: hidden;
  display: flex; flex-direction: column;
}
.fs-label {
  font-family: var(--br-font-family-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--br-color-ink-muted); padding: 12px 16px 8px;
}
.finding-item {
  display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; background: none; border: none;
  border-top: 1px solid var(--br-color-border-subtle); padding: 12px 16px; color: var(--br-color-ink-primary);
}
.finding-item:hover { background: var(--br-color-surface-hover); }
.finding-item.active { background: var(--br-color-brand-primary-tint); border-left: 3px solid var(--br-color-brand-primary); padding-left: 13px; }
.finding-item:focus-visible { outline: 2px solid var(--br-color-brand-primary); outline-offset: -2px; }
.fi-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.fi-title { font-size: 12.5px; font-weight: 600; }
.fi-cat { font-family: var(--br-font-family-mono); font-size: 10px; color: var(--br-color-ink-muted); }

/* ── FINDING DETAIL CANVAS ────────────────────────────── */
.finding-canvas {
  background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-subtle);
  border-radius: var(--br-radius-lg); box-shadow: var(--br-shadow-sm); padding: 22px 24px;
  min-height: 420px; display: flex; flex-direction: column; gap: 16px;
}
.fd-header { display: flex; flex-direction: column; gap: 6px; }
.fd-header-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fd-header h2 { font-size: 17px; font-weight: 700; }
.evidence-note {
  font-family: var(--br-font-family-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--br-color-ink-muted); background: var(--br-color-surface-elevated);
  border: 1px solid var(--br-color-border-subtle); border-radius: 4px; padding: 4px 10px; width: fit-content;
}

.four-part {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  background: var(--br-color-surface-elevated); border-radius: var(--br-radius-md); padding: 14px;
}
@media (max-width: 700px) { .four-part { grid-template-columns: 1fr; } }
.fp-row { display: flex; flex-direction: column; gap: 4px; }
.fp-label {
  font-family: var(--br-font-family-mono); font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--br-color-brand-accent);
}
.fp-row p { font-size: 13px; color: var(--br-color-ink-primary); line-height: 1.55; }

.fd-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.fd-note {
  font-size: 12.5px; padding: 10px 14px; border-radius: var(--br-radius-md); border: 1px solid;
  display: none;
}
.fd-note.show { display: block; }
.fd-note.accepted { background: var(--br-color-state-success-tint); border-color: rgba(22,163,74,.35); color: var(--br-color-state-success); }
.fd-note.escalated { background: rgba(109,40,217,0.08); border-color: rgba(109,40,217,.35); color: var(--br-color-brand-accent); }
.fd-note.resolved { background: var(--br-color-state-success-tint); border-color: rgba(22,163,74,.35); color: var(--br-color-state-success); }
.fd-note.flagged { background: var(--br-color-state-warning-tint); border-color: rgba(217,119,6,.35); color: var(--br-color-state-warning); }

.fd-edit-panel { display: none; flex-direction: column; gap: 8px; }
.fd-edit-panel.show { display: flex; }
.fd-edit-panel textarea {
  width: 100%; min-height: 72px; font-family: var(--br-font-family-sans); font-size: 13px;
  padding: 10px 12px; border-radius: var(--br-radius-md); border: 1px solid var(--br-color-border-default);
  background: var(--br-color-surface-app); color: var(--br-color-ink-primary); resize: vertical;
}
.fd-edit-panel .edit-actions { display: flex; gap: 8px; }

/* decision prompt */
.decision-prompt {
  background: var(--br-color-state-warning-tint); border: 1px solid rgba(217,119,6,0.35);
  border-radius: var(--br-radius-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
}
.decision-prompt .dp-question { font-size: 14px; font-weight: 600; color: var(--br-color-ink-primary); }
.dp-options { display: flex; gap: 10px; flex-wrap: wrap; }
.dp-btn {
  font-size: 12.5px; font-weight: 600; padding: 10px 16px; border-radius: var(--br-radius-md);
  border: 1px solid var(--br-color-border-strong); background: var(--br-color-surface-panel);
  color: var(--br-color-ink-primary); flex: 1; min-width: 220px; text-align: left;
}
.dp-btn:hover { border-color: var(--br-color-brand-primary); }
.dp-btn .dp-btn-label { display: block; font-weight: 700; margin-bottom: 2px; }
.dp-btn .dp-btn-sub { display: block; font-size: 11px; color: var(--br-color-ink-muted); font-weight: 400; }
.dp-btn.known .dp-btn-label { color: var(--br-color-state-success); }
.dp-btn.unknown .dp-btn-label { color: var(--br-color-state-warning); }
.dp-btn.repull .dp-btn-label { color: var(--br-color-brand-primary); }

/* ── CONSULTATIVE QUESTIONS ───────────────────────────── */
.consult-card {
  background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-subtle);
  border-radius: var(--br-radius-lg); box-shadow: var(--br-shadow-sm); padding: 20px 22px;
  display: flex; flex-direction: column; gap: 12px;
}
.consult-card h3 { font-size: 13px; font-weight: 700; }
.consult-card .consult-sub { font-size: 12px; color: var(--br-color-ink-muted); }
.question-list { display: flex; flex-direction: column; gap: 8px; list-style: none; }
.question-list li {
  font-size: 13px; color: var(--br-color-ink-primary); padding: 10px 14px; border-radius: var(--br-radius-md);
  background: var(--br-color-surface-elevated); border-left: 3px solid var(--br-color-brand-accent);
}
.add-question-row { display: flex; gap: 8px; margin-top: 4px; }
.add-question-row input {
  flex: 1; font-size: 13px; font-family: var(--br-font-family-sans); padding: 9px 12px;
  border-radius: var(--br-radius-md); border: 1px solid var(--br-color-border-default);
  background: var(--br-color-surface-app); color: var(--br-color-ink-primary);
}
.add-question-row input:focus { outline: 2px solid var(--br-color-brand-primary); outline-offset: 1px; }

/* ── BRADLEY RAIL ── */
.bradley-rail {
  background: var(--rail-bg); border: 1px solid var(--rail-border); border-radius: var(--br-radius-lg);
  padding: 20px 24px; box-shadow: var(--br-shadow-md); display: flex; flex-direction: column; gap: 16px;
}
.rail-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.rail-title { font-family: var(--br-font-family-mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--br-color-brand-accent); }
.rail-badge { font-family: var(--br-font-family-mono); font-size: 10px; background: var(--alpha-soft); color: var(--alpha-accent); border: 1px solid rgba(167,139,250,0.35); border-radius: 4px; padding: 2px 8px; }
.rail-blurb { font-size: 13px; color: var(--br-color-ink-secondary); }
.rail-dual { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 580px) { .rail-dual { grid-template-columns: 1fr; } }
.rail-block { background: var(--br-color-surface-panel); border-radius: var(--br-radius-md); padding: 12px 14px; border: 1px solid var(--br-color-border-subtle); }
.rail-block-label { font-family: var(--br-font-family-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; font-weight: 700; }
.rail-block.nailed .rail-block-label { color: var(--br-color-state-success); }
.rail-block.hurt .rail-block-label { color: var(--br-color-state-danger); }
.rail-block ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.rail-block li { font-size: 12px; color: var(--br-color-ink-secondary); padding-left: 14px; position: relative; }
.rail-block.nailed li::before { content: '✓'; position: absolute; left: 0; color: var(--br-color-state-success); font-size: 11px; }
.rail-block.hurt li::before { content: '!'; position: absolute; left: 0; color: var(--br-color-state-danger); font-size: 11px; font-weight: 700; }
.cs-inline { font-family: var(--br-font-family-mono); font-size: 10px; color: var(--br-color-ink-muted); opacity: .8; }

.rail-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.route-card { background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-subtle); border-radius: var(--br-radius-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.route-card .rc-team { font-family: var(--br-font-family-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--br-color-brand-accent); margin-bottom: 4px; }
.route-card .rc-action { font-size: 12px; font-weight: 600; color: var(--br-color-ink-primary); }
.route-card .rc-why { font-size: 11px; color: var(--br-color-ink-muted); }
.route-card .rc-risk { font-size: 11px; color: var(--br-color-state-danger); font-style: italic; }
.route-card .rc-roi { font-size: 11px; color: var(--br-color-ink-secondary); background: var(--br-color-surface-elevated); border-radius: 4px; padding: 6px 8px; margin-top: 2px; }
.route-card .rc-roi b { color: var(--br-color-ink-primary); }

.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

/* ── NIST CSF 2.0 FUNCTION BADGES — six functions, six colors ── */
.nist-fn {
  display: inline-flex; align-items: center; gap: 4px; font-family: var(--br-font-family-mono);
  font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 4px; border: 1px solid;
  text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap;
}
.nist-fn.gv { background: rgba(109,40,217,.08); color: #6d28d9; border-color: rgba(109,40,217,.35); }
.nist-fn.id { background: rgba(2,132,199,.08); color: #0284c7; border-color: rgba(2,132,199,.35); }
.nist-fn.pr { background: rgba(22,163,74,.08); color: #16a34a; border-color: rgba(22,163,74,.35); }
.nist-fn.de { background: rgba(217,119,6,.08); color: #d97706; border-color: rgba(217,119,6,.35); }
.nist-fn.rs { background: rgba(220,38,38,.08); color: #dc2626; border-color: rgba(220,38,38,.35); }
.nist-fn.rc { background: rgba(15,23,42,.06); color: #45506b; border-color: rgba(69,80,107,.3); }

/* ── RISK LEVEL — severity, distinct axis from defensibility tier ── */
.risklevel {
  display: inline-flex; align-items: center; gap: 3px; font-family: var(--br-font-family-mono);
  font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; border: 1px solid;
  text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap;
}
.risklevel.high   { background: var(--br-color-state-danger-tint);  color: var(--br-color-state-danger);  border-color: rgba(220,38,38,.4); }
.risklevel.medium { background: var(--br-color-state-warning-tint); color: var(--br-color-state-warning); border-color: rgba(217,119,6,.4); }
.risklevel.low     { background: var(--br-color-state-info-tint);   color: var(--br-color-state-info);    border-color: rgba(2,132,199,.4); }

/* ── SECURITY SCORE PANEL ─────────────────────────────── */
.score-panel {
  background: linear-gradient(135deg, var(--topbar-bg), #14264a); border-radius: var(--br-radius-lg);
  padding: 20px 24px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
  box-shadow: var(--br-shadow-md); color: #fff;
}
.score-dial { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
.score-dial .sd-num { font-family: var(--br-font-family-mono); font-size: 40px; font-weight: 800; line-height: 1; transition: color .3s ease; }
.score-dial .sd-num.good { color: #4ade80; }
.score-dial .sd-num.mid  { color: #fbbf24; }
.score-dial .sd-num.bad  { color: #f87171; }
.score-dial .sd-of { font-family: var(--br-font-family-mono); font-size: 11px; color: rgba(255,255,255,.5); }
.score-body { flex: 1; min-width: 220px; }
.score-body .sb-label { font-family: var(--br-font-family-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: rgba(255,255,255,.55); margin-bottom: 4px; }
.score-body .sb-sources { font-size: 12px; color: rgba(255,255,255,.75); line-height: 1.5; }
.score-tally { display: flex; gap: 14px; flex-wrap: wrap; }
.score-tally .st-item { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 46px; }
.score-tally .st-num { font-family: var(--br-font-family-mono); font-size: 18px; font-weight: 800; }
.score-tally .st-num.high { color: #f87171; } .score-tally .st-num.medium { color: #fbbf24; } .score-tally .st-num.low { color: #38bdf8; }
.score-tally .st-lbl { font-size: 9.5px; color: rgba(255,255,255,.55); text-transform: uppercase; letter-spacing: .04em; }
.score-cs { width: 100%; font-family: var(--br-font-family-mono); font-size: 10px; color: rgba(255,255,255,.4); margin-top: -8px; }

/* ── NEW HARNESS CAPABILITIES (growth/upsell roadmap) ─── */
.capability-card {
  background: var(--br-color-surface-panel); border: 1px solid var(--br-color-border-subtle);
  border-radius: var(--br-radius-lg); box-shadow: var(--br-shadow-sm); padding: 18px 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.cap-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.cap-table th {
  text-align: left; font-family: var(--br-font-family-mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--br-color-ink-muted); padding: 8px 10px; border-bottom: 1px solid var(--br-color-border-default);
}
.cap-table td { padding: 10px 10px; border-bottom: 1px solid var(--br-color-border-subtle); vertical-align: top; }
.cap-table tr:last-child td { border-bottom: none; }
.cap-gap { font-weight: 700; color: var(--br-color-ink-primary); }
.cap-rec { color: var(--br-color-ink-secondary); font-size: 12px; line-height: 1.5; }
.cap-source { font-family: var(--br-font-family-mono); font-size: 10px; color: var(--br-color-brand-accent); display: block; margin-top: 3px; }
.priority-pill { font-family: var(--br-font-family-mono); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
.priority-pill.high { background: var(--br-color-state-danger-tint); color: var(--br-color-state-danger); border-color: rgba(220,38,38,.4); }
.priority-pill.medium { background: var(--br-color-state-warning-tint); color: var(--br-color-state-warning); border-color: rgba(217,119,6,.4); }
.priority-pill.low { background: var(--br-color-surface-elevated); color: var(--br-color-ink-muted); border-color: var(--br-color-border-default); }

/* ── ENVIRONMENT SUMMARY (Current Climate, condensed) ─── */
.env-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; }
.env-stat { background: var(--br-color-surface-elevated); border-radius: var(--br-radius-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.env-stat .es-num { font-family: var(--br-font-family-mono); font-size: 20px; font-weight: 800; color: var(--br-color-brand-primary); }
.env-stat .es-lbl { font-size: 11px; color: var(--br-color-ink-muted); }
.env-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.env-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed var(--br-color-border-subtle); }
.env-row:last-child { border-bottom: none; }
.env-row .er-name { color: var(--br-color-ink-primary); font-weight: 600; }
.env-row .er-detail { color: var(--br-color-ink-muted); text-align: right; }

/* ── ALWAYS CURRENT — risk reason ──────────────────────── */
.risk-reason { font-size: 11px; color: var(--br-color-ink-muted); display: block; margin-top: 2px; max-width: 220px; }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <span class="topbar-wordmark">Apex Bridge</span>
  <div class="topbar-divider"></div>
  <span class="topbar-title" id="tb-title">QBR Analyst · Onboarding — Laissez Faire Fellows</span>
  <div class="topbar-spacer"></div>
  <span class="topbar-badge" id="tb-badge">Tier 2 · Direction</span>
  <button class="theme-btn" onclick="document.documentElement.setAttribute('data-apx-mode', document.documentElement.getAttribute('data-apx-mode')==='dark' ? 'light' : 'dark')">
    Toggle dark
  </button>
</header>

<div class="app-shell">
  <!-- SIDE NAV -->
  <nav class="side-nav" aria-label="QBR Analyst pages">
    <div class="side-nav-label">Laissez Faire Fellows · QBR Analyst</div>
    <button class="side-nav-item" data-view="onboarding" onclick="setView('onboarding')">
      <span>① Onboarding</span>
      <span class="sn-sub">Activate the Coworker — first time</span>
    </button>
    <button class="side-nav-item" data-view="alwaysCurrent" onclick="setView('alwaysCurrent')">
      <span>② Always Current</span>
      <span class="sn-sub">Portfolio · 142 clients</span>
    </button>
    <button class="side-nav-item" data-view="draftReview" onclick="setView('draftReview')">
      <span>③ Draft Review</span>
      <span class="sn-sub">Ridgemont Financial Services</span>
    </button>
    <div class="side-nav-foot">
      Multi-page hi-fi extension of <code>qbr-draft-flow.html</code> (Tier 1). Onboarding shape adapted from FSN-82692 (a different Coworker) — see banner. <span style="opacity:.8;">[CS: MEDIUM]</span>
    </div>
  </nav>

  <!-- MAIN VIEW MOUNT -->
  <main class="main-view" id="main-view"></main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   SHARED STATE
   ══════════════════════════════════════════════════════════ */
let currentView = 'onboarding';

const TOPBAR_META = {
  onboarding:   { title: 'QBR Analyst · Onboarding — Laissez Faire Fellows', badge: 'Tier 2 · Direction' },
  alwaysCurrent:{ title: 'QBR Analyst · Always Current — Laissez Faire Fellows', badge: 'Tier 2 · Direction' },
  draftReview:  { title: 'QBR Coworker · Draft Review — Ridgemont Financial Services', badge: 'Tier 1 · Concept' }
};

function setView(name) {
  currentView = name;
  const main = document.getElementById('main-view');
  main.innerHTML = views[name]();
  document.querySelectorAll('.side-nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  const meta = TOPBAR_META[name];
  document.getElementById('tb-title').textContent = meta.title;
  document.getElementById('tb-badge').textContent = meta.badge;
  if (name === 'onboarding') initOnboarding();
  if (name === 'alwaysCurrent') initAlwaysCurrent();
  if (name === 'draftReview') initDraftReview();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  main.querySelector('.page')?.scrollIntoView({ block: 'start' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

const views = {};

/* ══════════════════════════════════════════════════════════
   PAGE 1 — ONBOARDING (wizard pattern, 5 panes)
   Adapts FSN-82692's Steps 3–7 shape (a different Coworker's spec)
   to QBR Analyst, per qbr-system-blueprint §11/§14.
   ══════════════════════════════════════════════════════════ */

let obStep = 1;
const OB_STEP_LABELS = ['Choose Coworker', 'Configure', 'Import history', 'Value Ledger baseline', 'First computation', 'Schedule'];
let obTemplateChoice = null;   // 'template' | 'import'
let obBaselineHours = '';
let obComputed = false;
let obShowRaw = false;
function obToggleRaw() { obShowRaw = !obShowRaw; renderOnboarding(); }

let obUploadedFiles = [];
let obHistoryExtracted = false;
let obHistoryNotes = '';

const EBR_HISTORY = {
  lastCycle: 'Q2 2026 EBR — Ridgemont Financial Services',
  takeaways: [
    'Onboarded 2 new office locations mid-quarter; RMM coverage lagged the move by roughly 3 weeks before both sites were fully enrolled.',
    'Board asked, informally, whether backup coverage would hold up under a GLBA audit — no formal answer was recorded either way.',
    'Derek Iannotti (owner) said the IT risk policy conversation "needs to happen properly, not in a EBR slide" — opened, not closed.'
  ],
  promises: [
    { who: 'Jordan Ellis (N-able)', what: 'Re-run the backup enrollment audit before the next review', linkedFindingId: 'f2' },
    { who: 'Derek Iannotti (Ridgemont)', what: 'Circulate the draft IT risk management policy for review by end of quarter', linkedFindingId: 'f5' },
    { who: 'Ridgemont IT lead', what: 'Look at MFA enforcement across remaining accounts next cycle', linkedFindingId: 'f12' }
  ],
  risks: [
    { note: 'Legacy remote access appliance — logged as "monitor," no remediation plan committed.', linkedFindingId: 'f4' },
    { note: 'A handful of dormant accounts came up in conversation but were never logged as a formal finding.', linkedFindingId: 'f10' }
  ]
};

function obPromiseStatus(linkedFindingId) {
  const f = findings.find(x => x.id === linkedFindingId);
  if (!f) return { label: 'Not tracked this cycle', cls: '' };
  if (f.status === 'pending') return { label: 'Not yet honored — still open this cycle', cls: 'high' };
  if (f.status === 'flagged') return { label: 'Carried forward — named again, not closed', cls: 'medium' };
  return { label: 'Honored — resolved this cycle', cls: 'low' };
}

function obHandleUpload(input) {
  const files = Array.from(input.files || []);
  files.forEach(file => obUploadedFiles.push({ name: file.name, size: file.size }));
  renderOnboarding();
}

function obRemoveUpload(idx) {
  obUploadedFiles.splice(idx, 1);
  renderOnboarding();
}

function obExtractHistory() {
  obHistoryExtracted = true;
  renderOnboarding();
}

const OB_PREVIEW_CLIENTS = [
  { name: 'Meridian Trust Credit Union', mrr: '$4,600/mo', tier: 'tier-a', tierLabel: 'A' },
  { name: 'Ridgemont Financial Services', mrr: '$2,750/mo', tier: 'tier-b', tierLabel: 'B' },
  { name: 'Cascade Dental Partners', mrr: '$2,900/mo', tier: 'tier-b', tierLabel: 'B' },
  { name: 'Briarwood Outfitters', mrr: '$1,050/mo', tier: 'tier-c', tierLabel: 'C' },
  { name: 'Maple & Co. Bookkeeping', mrr: '$610/mo', tier: 'tier-d', tierLabel: 'D' }
];

const OB_INDUSTRY_ROWS = [
  { name: 'Meridian Trust Credit Union', industry: 'Financial Services', flag: 'GLBA · NCUA ACET · FFIEC CAT' },
  { name: 'Ridgemont Financial Services', industry: 'Financial Services', flag: 'GLBA' },
  { name: 'Briarwood Outfitters', industry: 'Retail', flag: '— none flagged' },
  { name: 'Maple & Co. Bookkeeping', industry: 'Professional Services', flag: '— none flagged' }
];

function stepperHtml() {
  return `
    <div class="stepper">
      ${OB_STEP_LABELS.map((label, i) => {
        const n = i + 1;
        const cls = n === obStep ? 'active' : (n < obStep ? 'done' : '');
        const circle = n < obStep ? '✓' : n;
        const connector = i < OB_STEP_LABELS.length - 1 ? `<div class="step-connector ${n < obStep ? 'done' : ''}"></div>` : '';
        return `<div class="step ${cls}"><div class="step-circle">${circle}</div><span class="step-label">${label}</span></div>${connector}`;
      }).join('')}
    </div>
  `;
}

function renderOnboardingPane() {
  if (obStep === 1) {
    return `
      <div class="wizard-pane">
        <h2>Choose your Coworker</h2>
        <p class="pane-sub">Priya's account already runs Harness for Ticket Triage & Dispatch, connected during that Coworker's own onboarding — your PSA, RMM, and MDR connections already exist. This step is just picking which Coworker to activate next. <span class="cs-inline">[CS: HIGH — FSN-82692 §3 Step 3 pattern]</span></p>
        <div class="coworker-grid">
          <div class="coworker-card done">
            <div class="cc-name">Ticket Triage &amp; Dispatch</div>
            <div class="cc-desc">Reviews open tickets, classifies them, routes to the right queue.</div>
            <span class="cc-status done">✓ Active — already running</span>
          </div>
          <div class="coworker-card active">
            <div class="cc-name">QBR Analyst</div>
            <div class="cc-desc">Builds the Always Current portfolio view and drafts each client's quarterly review.</div>
            <span class="cc-status active">● Setting up now</span>
          </div>
          <div class="coworker-card">
            <div class="cc-name">Incident Response RCA</div>
            <div class="cc-desc">Reviews a closed incident and produces a root cause analysis.</div>
            <span class="cc-status later">Set up later</span>
          </div>
        </div>
      </div>
    `;
  }
  if (obStep === 2) {
    return `
      <div class="wizard-pane">
        <h2>Configure QBR Analyst</h2>
        <p class="pane-sub">Because HaloPSA is already connected (Ticket Triage's onboarding), the client list and each client's MRR are already in hand — QBR Analyst only needs three more inputs. <span class="cs-inline">[CS: HIGH — blueprint §14, "answered for her"]</span></p>

        <div class="onboard-card">
          <h3>(a) Client list &amp; tiers</h3>
          <p class="oc-lede">142 clients found in HaloPSA, tiered by MRR × RiskScore — review before continuing.</p>
          <table class="mini-table">
            <thead><tr><th>Client</th><th>MRR</th><th>Tier</th></tr></thead>
            <tbody>
              ${OB_PREVIEW_CLIENTS.map(c => `<tr><td>${c.name}</td><td>${c.mrr}</td><td><span class="tierbadge ${c.tier}">${c.tierLabel}</span></td></tr>`).join('')}
              <tr class="more-row"><td colspan="3">+ 137 more — full list reviewable after setup</td></tr>
            </tbody>
          </table>
          <span class="cs-tag">[A — illustrative subset; fictional data, no real HaloPSA pull behind this]</span>
        </div>

        <div class="onboard-card">
          <h3>(b) Industry — drives compliance framework flags</h3>
          <p class="oc-lede">Each client's industry decides which framework(s) show up in their draft, and whether a countersign is required.</p>
          <table class="mini-table">
            <thead><tr><th>Client</th><th>Industry</th><th>Frameworks flagged</th></tr></thead>
            <tbody>
              ${OB_INDUSTRY_ROWS.map(r => `
                <tr><td>${r.name}</td>
                <td><select class="field-select"><option ${r.industry==='Financial Services'?'selected':''}>Financial Services</option><option ${r.industry==='Retail'?'selected':''}>Retail</option><option ${r.industry==='Healthcare'?'selected':''}>Healthcare</option><option ${r.industry==='Manufacturing'?'selected':''}>Manufacturing</option><option ${r.industry==='Professional Services'?'selected':''}>Professional Services</option></select></td>
                <td style="font-family:var(--br-font-family-mono); font-size:11px; color:var(--br-color-ink-secondary);">${r.flag}</td></tr>
              `).join('')}
            </tbody>
          </table>
          <span class="cs-tag">[A — illustrative subset of 142; industry field per blueprint §14]</span>
        </div>

        <div class="onboard-card">
          <h3>(c) Starting point — template or import?</h3>
          <p class="oc-lede">Per blueprint §11's Stage 0 finding — cover both branches, no forced default.</p>
          <div class="branch-grid">

const RISK_WEIGHTS = { high: 5, medium: 2, low: 1 };

const RISK_TALLY = () => {
  const t = { high: 0, medium: 0, low: 0 };
  findings.forEach(f => { if (f.riskLevel && f.status === 'pending') t[f.riskLevel]++; });
  return t;
};

function computeSecurityScore() {
  let deduction = 0;
  findings.forEach(f => {
    if (f.riskLevel && f.status === 'pending') deduction += RISK_WEIGHTS[f.riskLevel] || 0;
  });
  return Math.max(0, Math.min(100, 100 - deduction));
}

let scoreShowWhy = false;
function scoreToggleWhy() { scoreShowWhy = !scoreShowWhy; renderScorePanel(); }

function renderScorePanel() {
  const panel = document.getElementById('score-panel');
  if (!panel) return;
  const score = computeSecurityScore();
  const tally = RISK_TALLY();
  const cls = score >= 75 ? 'good' : score >= 50 ? 'mid' : 'bad';
  const resolvedCount = findings.filter(f => f.status !== 'pending').length;
  const pendingRisky = findings.filter(f => f.riskLevel && f.status === 'pending')
    .sort((a, b) => RISK_WEIGHTS[b.riskLevel] - RISK_WEIGHTS[a.riskLevel]);
  const deduction = 100 - score;
  const bySeverity = ['high', 'medium', 'low'].map(lvl => {
    const items = pendingRisky.filter(f => f.riskLevel === lvl);
    return { lvl, items, subtotal: items.length * RISK_WEIGHTS[lvl] };
  }).filter(g => g.items.length);
  panel.innerHTML = `
    <div class="score-dial">
      <div class="sd-num ${cls}">${score}</div>
      <div class="sd-of">/ 100</div>
    </div>
    <div class="score-body">
      <div class="sb-label">Harness Security Score \u2014 Ridgemont Financial Services</div>
      <div class="sb-sources">Composite rollup across N-central, Adlumin, Cove, Inforcer, Entra ID &amp; uSecure. Recalculates live as findings below are resolved in Stage 4. ${resolvedCount}/${findings.length} findings resolved so far.</div>
    </div>
    <div class="score-tally">
      <div class="st-item"><span class="st-num high">${tally.high}</span><span class="st-lbl">High \u2014 open</span></div>
      <div class="st-item"><span class="st-num medium">${tally.medium}</span><span class="st-lbl">Medium \u2014 open</span></div>
      <div class="st-item"><span class="st-num low">${tally.low}</span><span class="st-lbl">Low \u2014 open</span></div>
    </div>
    <button class="btn ghost" onclick="scoreToggleWhy()" style="border-color:rgba(255,255,255,.35); color:#fff; margin-top:4px;">${scoreShowWhy ? 'Hide the math \u25b2' : `Why ${score}? Show the math \u25bc`}</button>
    ${scoreShowWhy ? `
      <div class="evidence-trail" style="width:100%; text-align:left; background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.2);">
        <div class="et-label" style="color:#fff;"><span>100 starting points, minus every open finding still pending in Stage 4</span><span>Deducted: ${deduction}</span></div>
        <div class="et-rows">
          ${bySeverity.map(g => `
            <div class="et-row" style="border-color:rgba(255,255,255,.12);">
              <span class="et-source" style="color:#fff;">${g.lvl[0].toUpperCase()+g.lvl.slice(1)} risk<span class="et-src-type" style="color:rgba(255,255,255,.6);">${g.items.length} open \u00d7 ${RISK_WEIGHTS[g.lvl]} pts</span></span>
              <span class="et-reading" style="color:rgba(255,255,255,.85);">${g.items.map(f => f.title).join(', ')}</span>
              <span class="et-flag mismatch">\u2212${g.subtotal}</span>
            </div>
          `).join('')}
          ${!bySeverity.length ? `<div class="et-row" style="border-color:rgba(255,255,255,.12);"><span class="et-reading" style="color:rgba(255,255,255,.85);">Every finding with a risk level has been resolved \u2014 nothing left deducting.</span></div>` : ''}
        </div>
        <div class="et-reconciliation" style="color:rgba(255,255,255,.85); border-color:rgba(255,255,255,.15);">
          <strong>100 \u2212 ${deduction} = ${score}.</strong> Resolving a finding in Stage 4 (Accept, or an ask-client/gap resolution) removes it from this list and the score recalculates live \u2014 nothing here is a static illustration once you start working the register.
        </div>
      </div>
    ` : ''}
    <div class="score-cs">[CS: LOW \u2014 illustrative composite; Inforcer's real product scores M365 config only (see finding below) \u2014 this rollup number is a Harness-native synthesis, not a claim about any one vendor's actual scoring model]</div>
  `;

function renderEvidenceTrail(f) {
  const ev = f.evidence;
  if (!ev) return '';
  const flagText = { match: 'Agrees', mismatch: 'Mismatch', single: 'Single source' };
  const rows = ev.rows.map(r => `
    <div class="et-row">
      <span class="et-source">${r.source}<span class="et-src-type">${r.type}</span></span>
      <span class="et-reading">${r.reading}</span>
      <span class="et-flag ${r.flag}">${flagText[r.flag]}</span>
    </div>
  `).join('');
  return `
    <div class="evidence-trail">
      <div class="et-label"><span>Jordan's evidence trail <span class="et-owner">— his register, read-only to Priya</span></span><span>Sourced from Laissez Faire Fellows' stack</span></div>
      <div class="et-rows">${rows}</div>
      <div class="et-reconciliation">
        <strong>Reconciliation:</strong> ${(f.status === 'resolved' && ev.reconciliationResolved) ? ev.reconciliationResolved : ev.reconciliation}
        <span class="et-cs">${ev.csTag}</span>
      </div>
    </div>
  `;
}

function selectFinding(id) {
  selectedId = id;
  renderSidebar();
  renderCanvas();
  document.querySelector('.finding-canvas')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function acceptFinding(id) {
  const f = findings.find(x => x.id === id);
  f.status = 'accepted';
  renderSidebar(); renderCanvas(); updateDraftStatus();
}

function disputeFinding(id) {
  const f = findings.find(x => x.id === id);
  f.status = 'escalated';
  renderSidebar(); renderCanvas(); updateDraftStatus();
}

function toggleEdit(id) {
  const panel = document.getElementById('edit-panel-' + id);
  panel.classList.toggle('show');
}

function saveEdit(id) {
  const f = findings.find(x => x.id === id);
  const text = document.getElementById('edit-text-' + id).value;
  f.meaning = text;
  f.status = 'edited';
  renderSidebar(); renderCanvas(); updateDraftStatus();
}

function resolveGap(kind) {
  const f = findings.find(x => x.id === 'f2');
  if (kind === 'known') {
    f.tier = 'measured';
    f.tierLabel = '✓ Measured';
    f.status = 'resolved';
  } else {
    f.status = 'flagged';
  }
  renderSidebar(); renderCanvas(); updateDraftStatus();
}

function resolveAskClient(id, path) {
  const f = findings.find(x => x.id === id);
  if (path === 'confirmed') {
    f.tier = 'benchmarked';
    f.tierLabel = '≈ Benchmarked';
    f.status = 'resolved';
  } else if (path === 'gap') {
    f.status = 'flagged';
  } else if (path === 'repull') {
    showToast('Re-checked ' + (f.evidence && f.evidence.rows.length ? f.evidence.rows[0].source : 'the stack') + ' — still no record. This stays a client question.');
    return;
  }
  renderSidebar(); renderCanvas(); updateDraftStatus();
}

function updateDraftStatus() {
  const pill = document.getElementById('draft-status-pill');
  if (!pill) return;
  const doneCount = DR_TABS.filter(t => drFinalized[t.key]).length;
  if (drAllFinalized()) {
    pill.textContent = 'Draft status: Ready for the meeting';
    pill.classList.add('ready');
  } else {
    pill.textContent = `Draft status: In review — ${doneCount}/${DR_TABS.length} sections finalized`;
    pill.classList.remove('ready');
  }
}

function renderQuestions() {
  const list = document.getElementById('question-list');
  if (!list) return;
  list.innerHTML = questions.map(q => `<li>${q}</li>`).join('');
}

function drWireAgendaTab() {
  document.querySelectorAll('.rehearse-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.rehearse-chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
    });
  });
}

function drWireRiskTab() {
  const form = document.getElementById('add-question-form');
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const input = document.getElementById('new-question');
      const val = input.value.trim();
      if (!val) return;
      questions.push(val);
      input.value = '';
      renderQuestions();
    });
  }
}

function renderDraftReview() {
  document.querySelectorAll('.dr-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === drTab);
    b.classList.toggle('finalized', !!drFinalized[b.dataset.tab]);
    b.innerHTML = (drFinalized[b.dataset.tab] ? '✓ ' : '') + DR_TABS.find(t => t.key === b.dataset.tab).label;
  });
  const mount = document.getElementById('dr-tab-mount');
  if (!mount) return;
  mount.innerHTML = DR_RENDERERS[drTab]();
  if (drTab === 'agenda') drWireAgendaTab();
  if (drTab === 'climate') renderScorePanel();
  if (drTab === 'risk') { renderSidebar(); renderCanvas(); renderQuestions(); drWireRiskTab(); }
  updateDraftStatus();
}

function initDraftReview() {
  selectedId = null;
  findings.forEach(f => { if (f.id === 'f2') { f.tier = 'estimated'; f.tierLabel = '~ Estimated'; } f.status = 'pending'; });
  questions = [
    "You mentioned onboarding two new locations this quarter — are those the same 2 endpoints we're seeing unenrolled, or something separate?",
    "With GLBA audit season coming in Q4, does the board want a written confirmation on backup coverage, or is verbal sign-off enough this cycle?"
  ];
  drTab = 'agenda';
  drFinalized = { agenda: false, climate: false, risk: false, employee: false, hardware: false, roadmap: false, referrals: false, followup: false };
  drFollowupNotes = '';
  renderDraftReview();
}

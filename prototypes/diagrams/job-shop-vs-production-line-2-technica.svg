<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="'Space Mono', Menlo, monospace">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1a1612"/>
    </marker>
    <pattern id="grid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="rgba(26,22,18,.055)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="760" fill="#efe7d6"/>
  <rect width="1400" height="760" fill="url(#grid2)"/>

  <text x="56" y="60" font-size="27" font-weight="700" fill="#1a1612">WHAT BREAKS IF WE AUTOMATE THE JOB-SHOP HALF</text>
  <text x="56" y="88" font-size="15" fill="#1a1612" opacity=".75">Technica's real EBR, sorted. Each row on the right is one thing an automator gets confidently wrong.</text>

  <!-- column heads -->
  <rect x="56" y="112" width="380" height="40" fill="#1a1612"/>
  <text x="74" y="138" font-size="13" font-weight="700" fill="#efe7d6">THE STEP</text>

  <rect x="440" y="112" width="384" height="40" fill="#1a1612"/>
  <text x="458" y="138" font-size="13" font-weight="700" fill="#efe7d6">WHAT AN AUTOMATOR DOES WITH IT</text>

  <rect x="828" y="112" width="516" height="40" fill="#1a1612"/>
  <text x="846" y="138" font-size="13" font-weight="700" fill="#efe7d6">SO WHAT — THE FAILURE, NAMED</text>

  <!-- ROW 1 -->
  <rect x="56" y="152" width="1288" height="88" fill="#f7f0df" stroke="#1a1612" stroke-width="1.5"/>
  <rect x="56" y="152" width="8" height="88" fill="#D8472B"/>
  <text x="74" y="182" font-size="14" font-weight="700" fill="#1a1612">Accepted deviations</text>
  <text x="74" y="204" font-size="12" fill="#1a1612" opacity=".8">Gaps the technician already</text>
  <text x="74" y="221" font-size="12" fill="#1a1612" opacity=".8">signed off on, with a reason.</text>
  <text x="458" y="182" font-size="12.5" fill="#1a1612">Has no record of those decisions,</text>
  <text x="458" y="200" font-size="12.5" fill="#1a1612">so it re-raises every one of them</text>
  <text x="458" y="218" font-size="12.5" fill="#1a1612">as a fresh finding.</text>
  <text x="846" y="182" font-size="12.5" font-weight="700" fill="#D8472B">Re-raise forty accepted items once and he</text>
  <text x="846" y="200" font-size="12.5" font-weight="700" fill="#D8472B">never opens the tool again.</text>
  <text x="846" y="222" font-size="12" fill="#1a1612" opacity=".75">Highest-risk item on the list. Suppression is the feature.</text>

  <!-- ROW 2 -->
  <rect x="56" y="240" width="1288" height="88" fill="#efe7d6" stroke="#1a1612" stroke-width="1.5"/>
  <rect x="56" y="240" width="8" height="88" fill="#D8472B"/>
  <text x="74" y="270" font-size="14" font-weight="700" fill="#1a1612">Temporary exclusions</text>
  <text x="74" y="292" font-size="12" fill="#1a1612" opacity=".8">Someone pulled out of a policy</text>
  <text x="74" y="309" font-size="12" fill="#1a1612" opacity=".8">while on leave, never restored.</text>
  <text x="458" y="270" font-size="12.5" fill="#1a1612">Cannot tell that from a deliberate</text>
  <text x="458" y="288" font-size="12.5" fill="#1a1612">exclusion — a service account, a</text>
  <text x="458" y="306" font-size="12.5" fill="#1a1612">shared mailbox. Picks one.</text>
  <text x="846" y="270" font-size="12.5" font-weight="700" fill="#D8472B">Identical data, opposite finding.</text>
  <text x="846" y="292" font-size="12" fill="#1a1612" opacity=".75">Either a live compliance hole reported as fine, or a</text>
  <text x="846" y="310" font-size="12" fill="#1a1612" opacity=".75">deliberate config raised as a failure. Both damage trust.</text>

  <!-- ROW 3 -->
  <rect x="56" y="328" width="1288" height="88" fill="#f7f0df" stroke="#1a1612" stroke-width="1.5"/>
  <rect x="56" y="328" width="8" height="88" fill="#D8472B"/>
  <text x="74" y="358" font-size="14" font-weight="700" fill="#1a1612">Disagreeing sources</text>
  <text x="74" y="380" font-size="12" fill="#1a1612" opacity=".8">Three N-central reports disagree</text>
  <text x="74" y="397" font-size="12" fill="#1a1612" opacity=".8">on counts. Two disagree on MFA.</text>
  <text x="458" y="358" font-size="12.5" fill="#1a1612">Picks whichever source answered</text>
  <text x="458" y="376" font-size="12.5" fill="#1a1612">first and prints one clean number.</text>
  <text x="458" y="394" font-size="12.5" fill="#1a1612">Re-deriving is slower, so it won't.</text>
  <text x="846" y="358" font-size="12.5" font-weight="700" fill="#D8472B">A number that reads as authoritative and is arbitrary.</text>
  <text x="846" y="380" font-size="12" fill="#1a1612" opacity=".75">It is also the denominator under two other findings, so the</text>
  <text x="846" y="398" font-size="12" fill="#1a1612" opacity=".75">error does not stay in one cell.</text>

  <!-- ROW 4 -->
  <rect x="56" y="416" width="1288" height="88" fill="#efe7d6" stroke="#1a1612" stroke-width="1.5"/>
  <rect x="56" y="416" width="8" height="88" fill="#D8472B"/>
  <text x="74" y="446" font-size="14" font-weight="700" fill="#1a1612">Per-person security data</text>
  <text x="74" y="468" font-size="12" fill="#1a1612" opacity=".8">Who clicked the phishing test.</text>
  <text x="74" y="485" font-size="12" fill="#1a1612" opacity=".8">Who gave up credentials.</text>
  <text x="458" y="446" font-size="12.5" fill="#1a1612">Reports the data it was given —</text>
  <text x="458" y="464" font-size="12.5" fill="#1a1612">which means naming the employee</text>
  <text x="458" y="482" font-size="12.5" fill="#1a1612">in a client-facing document.</text>
  <text x="846" y="446" font-size="12.5" font-weight="700" fill="#D8472B">That is an HR and legal event, not a data question.</text>
  <text x="846" y="468" font-size="12" fill="#1a1612" opacity=".75">The rule is: report a count, then stop and flag. A human</text>
  <text x="846" y="486" font-size="12" fill="#1a1612" opacity=".75">decides whether this client has any basis for naming anyone.</text>

  <!-- ROW 5 -->
  <rect x="56" y="504" width="1288" height="80" fill="#f7f0df" stroke="#1a1612" stroke-width="1.5"/>
  <rect x="56" y="504" width="8" height="80" fill="#C99A2E"/>
  <text x="74" y="534" font-size="14" font-weight="700" fill="#1a1612">Business goals · referrals</text>
  <text x="74" y="556" font-size="12" fill="#1a1612" opacity=".8">The template has no fields here</text>
  <text x="74" y="573" font-size="12" fill="#1a1612" opacity=".8">that are not a live question.</text>
  <text x="458" y="534" font-size="12.5" fill="#1a1612">There is nothing to pull, so it</text>
  <text x="458" y="552" font-size="12.5" fill="#1a1612">writes something plausible and</text>
  <text x="458" y="570" font-size="12.5" fill="#1a1612">presents it in the same voice.</text>
  <text x="846" y="534" font-size="12.5" font-weight="700" fill="#D8472B">Already happened: an "Email Gap" built from assumed</text>
  <text x="846" y="552" font-size="12.5" font-weight="700" fill="#D8472B">facts was presented as a finding, not as an assumption.</text>
  <text x="846" y="572" font-size="12" fill="#1a1612" opacity=".75">An honest empty table beats a scripted ask.</text>

  <!-- ROW 6 -->
  <rect x="56" y="584" width="1288" height="80" fill="#efe7d6" stroke="#1a1612" stroke-width="1.5"/>
  <rect x="56" y="584" width="8" height="80" fill="#1a1612"/>
  <text x="74" y="614" font-size="14" font-weight="700" fill="#1a1612">Missing data</text>
  <text x="74" y="636" font-size="12" fill="#1a1612" opacity=".8">Nothing watches for incidents at</text>
  <text x="74" y="653" font-size="12" fill="#1a1612" opacity=".8">all. That is not a small gap.</text>
  <text x="458" y="614" font-size="12.5" fill="#1a1612">Returns nothing, and nothing</text>
  <text x="458" y="632" font-size="12.5" fill="#1a1612">renders as a blank or a tick.</text>
  <text x="846" y="614" font-size="12.5" font-weight="700" fill="#D8472B">A system that goes quiet reads as all clear.</text>
  <text x="846" y="636" font-size="12" fill="#1a1612" opacity=".75">Absence has to come out as a finding. No automator</text>
  <text x="846" y="654" font-size="12" fill="#1a1612" opacity=".75">volunteers the thing it was never given.</text>

  <!-- footer -->
  <rect x="56" y="686" width="1288" height="52" fill="#1F3C96"/>
  <text x="76" y="710" font-size="14" font-weight="700" fill="#efe7d6">Two practical notes: Vertesia ships no PSA connectors, so every integration is ours to build — "use what's there" does not cover the</text>
  <text x="76" y="730" font-size="14" font-weight="700" fill="#efe7d6">production-line half either. And the grading rules exist on paper, never checked against how the technician actually grades.</text>
</svg>

name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ux-kickoff-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: roster & RACI filled
        run: |
          # Warns rather than blocks, matching every other check in this skeleton —
          # "gates do not block work" is the house rule ux-spec-skeleton established,
          # and an unfilled roster at kickoff is the normal state of early work, the
          # same way a red Gate 1/2/3 is. Placeholders don't fail a build; they fail
          # the moment someone tries to act on a decision nobody actually owns.
          ./check-roster.sh; c=$?
          case $c in
            0)  ;;
            3)  echo "::warning::project.conf missing or ROSTER unparsable" ;;
            33) echo "::warning::a roster/RACI field is a placeholder, not an answer yet" ;;
            *)  echo "::warning::check-roster.sh exit $c" ;;
          esac

      - name: gate criteria
        run: ./check-gates.sh || echo "::warning::gates red — the normal state of honest work in progress"

      - name: human decisions outstanding
        run: ./check-blocked.sh || echo "::warning::a HUMAN row stands — someone owes a decision"

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <style>
    .p  { fill: #efe7d6; }
    .cd { fill: #f7f0df; stroke: #1a1612; stroke-width: 2.5; }
    .rs { fill: #f7f0df; stroke: #1F3C96; stroke-width: 3; }
    .px { fill: #f7f0df; stroke: #D8472B; stroke-width: 3; }
    .sh { fill: #1a1612; opacity: .18; }
    .t  { font-family: 'Space Mono', Menlo, monospace; fill: #1a1612; }
    .h  { font-family: 'Space Mono', Menlo, monospace; font-weight: 700; letter-spacing: .09em; }
    .sm { font-family: 'Space Mono', Menlo, monospace; font-size: 12px; fill: #1a1612; opacity: .72; }
    .ar { stroke: #1a1612; stroke-width: 2.5; fill: none; }
    .arb{ stroke: #1F3C96; stroke-width: 2.5; fill: none; }
    .ard{ stroke: #D8472B; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
  </style>
  <rect class="p" x="0" y="0" width="1120" height="620"/>

  <text class="h" x="40"  y="38" font-size="15" fill="#1F3C96">RESEARCH SIDE</text>
  <text class="sm" x="40" y="58">research owns it · research grades it</text>
  <text class="h" x="650" y="38" font-size="15" fill="#D8472B">PRODUCT SIDE</text>
  <text class="sm" x="650" y="58">product / design own it · they may only cite</text>

  <line x1="608" y1="76" x2="608" y2="590" stroke="#1a1612" stroke-width="1.5" stroke-dasharray="4 6" opacity=".45"/>

  <!-- sources -->
  <rect class="sh" x="46" y="96"  width="380" height="62"/>
  <rect class="rs" x="40" y="90"  width="380" height="62"/>
  <text class="t h" x="60" y="122" font-size="14">Datadump · Condens · Confluence</text>
  <text class="sm" x="60" y="142">raw material · deep dives · transcripts</text>

  <path class="arb" d="M230 158 L230 200" marker-end="url(#ab)"/>

  <!-- findings.yaml -->
  <rect class="sh" x="46" y="206" width="380" height="150"/>
  <rect class="rs" x="40" y="200" width="380" height="150"/>
  <text class="t h" x="60" y="232" font-size="17" fill="#1F3C96">findings.yaml</text>
  <text class="sm" x="60" y="256">claim_type · population_fidelity</text>
  <text class="sm" x="60" y="276">claim_scope · n per instrument</text>
  <text class="sm" x="60" y="296">review_by · fieldwork_date</text>
  <text class="t" x="60" y="324" font-size="13" font-weight="700">confidence:  ← only research sets this</text>
  <text class="sm" x="60" y="342" font-size="11">13 rows, all ungraded today</text>

  <!-- validator -->
  <rect class="sh" x="446" y="206" width="132" height="76"/>
  <rect class="rs" x="440" y="200" width="132" height="76"/>
  <text class="t h" x="454" y="226" font-size="11">validate_</text>
  <text class="t h" x="454" y="242" font-size="11">findings.py</text>
  <text class="sm" x="454" y="262" font-size="10">is it labelled</text>
  <text class="sm" x="454" y="274" font-size="10">honestly?</text>
  <path class="arb" d="M440 238 L424 238" marker-end="url(#ab)"/>

  <!-- rests_on pointer — routed clear of the validator, into ux.md, which is
       where an interpretation cites the evidence it rests on -->
  <path class="ard" d="M420 330 L592 330 L592 143 L644 143" marker-end="url(#ar)"/>
  <text class="t" x="438" y="308" font-size="13" font-weight="700" fill="#D8472B">rests_on:</text>
  <text class="sm" x="438" y="326" font-size="10.5">a pointer — nothing</text>
  <text class="sm" x="438" y="342" font-size="10.5">is copied across</text>

  <!-- gate files -->
  <rect class="sh" x="656" y="116" width="200" height="66"/>
  <rect class="px" x="650" y="110" width="200" height="66"/>
  <text class="t h" x="668" y="138" font-size="15">ux.md</text>
  <text class="sm" x="668" y="160">right problem</text>

  <rect class="sh" x="656" y="226" width="200" height="66"/>
  <rect class="px" x="650" y="220" width="200" height="66"/>
  <text class="t h" x="668" y="248" font-size="15">vision.md</text>
  <text class="sm" x="668" y="270">right thing</text>

  <rect class="sh" x="656" y="336" width="200" height="66"/>
  <rect class="px" x="650" y="330" width="200" height="66"/>
  <text class="t h" x="668" y="358" font-size="15">design.md</text>
  <text class="sm" x="668" y="380">right build</text>

  <path class="ar" d="M750 182 L750 220" marker-end="url(#am)"/>
  <path class="ar" d="M750 292 L750 330" marker-end="url(#am)"/>
  <text class="sm" x="764" y="206" font-size="11">criteria travel forward</text>
  <text class="sm" x="764" y="316" font-size="11">and may not be dropped</text>

  <!-- intent spec, aligned with ux.md which authors the criteria -->
  <rect class="sh" x="896" y="116" width="186" height="86"/>
  <rect class="cd" x="890" y="110" width="186" height="86"/>
  <text class="t h" x="906" y="136" font-size="13">Intent Spec §5</text>
  <text class="sm" x="906" y="157" font-size="11">the canonical table</text>
  <text class="sm" x="906" y="174" font-size="11">every UXI-## id</text>
  <text class="sm" x="906" y="191" font-size="11">resolves here</text>
  <path class="ar" d="M850 143 L890 143" marker-end="url(#am)"/>

  <!-- check -->
  <rect class="sh" x="656" y="446" width="418" height="96"/>
  <rect class="px" x="650" y="440" width="418" height="96"/>
  <text class="t h" x="668" y="470" font-size="16" fill="#D8472B">check-gates.sh</text>
  <text class="t" x="668" y="496" font-size="13">Does anything here claim MORE than</text>
  <text class="t" x="668" y="514" font-size="13">these findings license?</text>
  <text class="sm" x="668" y="532" font-size="9.8">recomputes the ceiling · never grades a finding</text>

  <path class="ar" d="M750 396 L750 440" marker-end="url(#am)"/>

  <!-- footer -->
  <rect class="cd" x="40" y="440" width="546" height="96"/>
  <text class="t h" x="58" y="468" font-size="13">TWO CHECKS · ONE FILE · DIFFERENT QUESTIONS</text>
  <text class="sm" x="58" y="492" font-size="11.5">Hers guards the evidence. Mine guards the interpretation of it.</text>
  <text class="sm" x="58" y="510" font-size="11.5">Neither works alone: a valid findings file with an overclaiming</text>
  <text class="sm" x="58" y="528" font-size="11.5">problem statement still ships a lie.</text>

  <text class="sm" x="40" y="578" font-size="11">Re-grading a finding changes what every document resting on it is allowed to say. That is the loop.</text>

  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1a1612"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1F3C96"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#D8472B"/>
    </marker>
  </defs>
</svg>

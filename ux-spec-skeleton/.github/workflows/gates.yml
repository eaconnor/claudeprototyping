name: gates

# Implements the policy table in EXIT-CODES.md. The rule:
#
#   FLOOR — can harm a user            -> fail the build
#   CANNOT EVALUATE — precondition missing -> warn, NEVER pass silently
#   FIT — everything else              -> warn, never block
#
# The split is why engineering can live with this. A gate that blocks a merge over
# unfinished polish gets switched off within a fortnight, and the accessibility
# gate goes with it.
#
# WHY THIS BRANCHES ON EXACT CODES rather than on zero/non-zero: the first version
# of this file put ./check-eng.sh in the blocking job, and a FRESH CLONE FAILED CI
# immediately — exit 12, "unevaluated", because a clone has no build yet. That is a
# false red on day one, which is the fastest possible way to teach a team to ignore
# every script in this repo. Caught by actually cloning it, 2026-09-16. Branch on
# the code or do not gate at all.

on: [push, pull_request]

jobs:
  floor:
    name: FLOOR — blocks the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: never events (20 = incident)
        run: |
          ./check-never.sh; c=$?
          [ $c -eq 0 ] || { echo "::error::never event, exit $c — stop and investigate, do not score it"; exit 1; }

      - name: waivers (15 = a never event was waived · 16 = malformed)
        run: |
          ./check-waivers.sh; c=$?
          case $c in
            0) ;;
            15) echo "::error::a never event was waived — that is an incident, not a waiver"; exit 1 ;;
            16) echo "::error::waiver ledger malformed, or a bypass has no predicted cost"; exit 1 ;;
            *)  echo "::warning::check-waivers.sh exit $c"; ;;
          esac

      - name: engineering FLOOR (10 = can harm a user · 12 = unevaluated, warns)
        run: |
          ./check-eng.sh; c=$?
          case $c in
            0)  ;;
            10) echo "::error::FLOOR — this build can harm a user"; exit 1 ;;
            11) echo "::warning::off-roadmap (FIT)"; ;;
            12) echo "::warning::a gate eng owns is UNEVALUATED — not passing, not failing. Set BUILD in project.conf."; ;;
            *)  echo "::warning::check-eng.sh exit $c"; ;;
          esac

      - name: skill registry resolves (21 = a registered capability does not exist)
        run: |
          ./check-skills.sh; c=$?
          case $c in
            0)  ;;
            21) echo "::error::a registered skill name does not exist on disk — enforcement link 3 is broken"; exit 1 ;;
            5)  echo "::warning::check-skills.sh could not evaluate — no registry found"; ;;
            *)  echo "::warning::check-skills.sh exit $c"; ;;
          esac

      - name: source drift (19 = conflict · 22 = misdeclared · 18 = stale, warns)
        run: |
          ./check-drift.sh; c=$?
          case $c in
            0)  ;;
            18) echo "::warning::sources are STALE — reconcile when you next touch this"; ;;
            19) echo "::error::CONFLICT — a source is missing or unregistered"; exit 1 ;;
            22) echo "::error::drift: claims a better state than the hashes show. Fix the field."; exit 1 ;;
            5)  echo "::warning::check-drift.sh could not evaluate — no manifest rows or no built_from:"; ;;
            *)  echo "::warning::check-drift.sh exit $c"; ;;
          esac

      - name: human layer — references resolve, status fence current
        run: |
          # Exact-code branching, not zero/non-zero. 26 is a dangling pointer that
          # sends a person to a file that is not there — that fails. 27 is only a
          # regenerable block being out of date, which must never fail a build.
          ./check-human.sh; c=$?
          case $c in
            0)  ;;
            26) echo "::error::the human layer references something that does not exist"; exit 1 ;;
            27) echo "::warning::STATUS fence is stale — run ./check-human.sh --write"; ;;
            5)  echo "::warning::check-human.sh could not evaluate — no README pair found"; ;;
            *)  echo "::warning::check-human.sh exit $c"; ;;
          esac

      - name: evidence homes exist (28 = onboarding incomplete · 29 = broken locator)
        run: |
          # 28 fails. That is the point of the gate: a project with nowhere its evidence
          # lives has not been onboarded, and a fresh clone SHOULD be red here until the
          # research owner sets it up. Neither CI nor an agent may do that setup.
          ./check-evidence.sh; c=$?
          case $c in
            0)  ;;
            28) echo "::error::no owned evidence home — the research owner must set this up"; exit 1 ;;
            29) echo "::error::an EVIDENCE.md row points at a path that does not exist"; exit 1 ;;
            5)  echo "::warning::check-evidence.sh could not evaluate — EVIDENCE.md missing or unparsable"; ;;
            *)  echo "::warning::check-evidence.sh exit $c"; ;;
          esac

      - name: judgment contract (23 = unacknowledged · 24 = incoherent · 25 = under-specified, warns)
        run: |
          ./check-judgment.sh; c=$?
          case $c in
            0)  ;;
            23) echo "::error::unfilled judgment slots with nothing keeping them provisional — an execute phase would be told to proceed and told nothing about what must stay blank"; exit 1 ;;
            24) echo "::error::authorization incoherence — permissive regime with no sign-off, or a BLOCKED file authorizing work"; exit 1 ;;
            25) echo "::warning::regime declared without its defining constraints (see exit 25)"; ;;
            5)  echo "::warning::check-judgment.sh could not evaluate — no confidence_regime: found in any gate file"; ;;
            *)  echo "::warning::check-judgment.sh exit $c"; ;;
          esac

      - name: value register is honest (13 = no costs recorded)
        run: |
          ./check-value.sh; c=$?
          case $c in
            0)  ;;
            13) echo "::error::value register is malformed, or records no costs — a register with only wins is a case study"; exit 1 ;;
            14) echo "::error::VALUE.md missing"; exit 1 ;;
            *)  echo "::warning::check-value.sh exit $c"; ;;
          esac

  fit:
    name: FIT — reports, never blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gate criteria
        run: ./check-gates.sh || echo "::warning::gates red — the normal state of honest work in progress"
      - name: human decisions outstanding
        run: ./check-blocked.sh || echo "::warning::a HUMAN row stands — someone owes a decision"
      - name: criterion traces
        run: ./check-trace.sh || echo "::warning::trace problem, or no intent spec (exit 5 = could not evaluate)"
      - name: design system
        run: python3 scripts/check-design.py || echo "::warning::design-system finding, or no build to lint"
      - name: signature tiering
        run: python3 scripts/check-tier.py || echo "::warning::tiering integrity — see exit 17, 'a bottleneck with a diagram'"
      - name: conformance report
        run: python3 scripts/ux-score.py

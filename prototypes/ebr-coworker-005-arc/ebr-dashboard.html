<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBR Coworker — HARNESS</title>
<!-- The EBR coworker as it lives IN HARNESS: a standalone UX dashboard inside the real product shell.
     Chrome + IA are grounded in the real HARNESS UI (Beth's screenshot 2026-08-27, acp.n-able.dev):
       left nav Runbooks · Experts · MCP configs · Coworkers · Execution · Value Ledger;
       coworker tabs Overview · Configuration · Versions · Runs · Audit · Promotion;
       status chips Tenant · Active · Assisted; actions Edit · Pause · Clone · Archive; Value → Time saved.
     Light, restrained (eng reality). The "extra-beautiful Apex-UI data viz" is the risk register on the
     Overview tab. Themed via CSS vars — flip :root for the dark Apex-UI-vision cut ("other versions later").
     All data fictional (CLAUDE.md §9b). RAG = functional grades. No emoji; monochrome SVG icons. -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* HARNESS light (eng reality) */
    --canvas:#f5f5f7; --surface:#fff; --hover:#fafafa;
    --nav:#17131f; --nav-fg:#c3bdd0; --nav-fg-2:#7c7590; --nav-on-bg:#2a2140;
    --ink:#18171c; --text:#45464a; --text-2:#6b6c72;
    --line:#e7e7ec; --line-2:#d7d7de;
    --apex:#8500cc; --apex-soft:rgba(133,0,204,.07); --purple:#a24dff; --cyan:#0a95c4; --cyan-soft:#e7f6fb;
    --red:#c0392b; --red-soft:#fbecea; --amber:#a56a00; --amber-soft:#f8eeda; --green:#137a46; --green-soft:#e7f6ee; --held:#8a8a93;
    --r:6px; --r-lg:10px; --r-pill:999px;
    --sh:0 1px 2px rgba(20,10,40,.05),0 1px 3px rgba(20,10,40,.05);
    --sh-lg:0 4px 20px -6px rgba(20,10,40,.14);
    --font-h:'Manrope',-apple-system,sans-serif; --font-b:'Inter',-apple-system,sans-serif; --font-m:'Inter',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--canvas);color:var(--text);font-family:var(--font-b);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit} button{font-family:inherit}

  /* top bar */
  .top{display:flex;align-items:center;gap:14px;height:52px;padding:0 18px;background:var(--nav);color:#fff}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-h);font-weight:800;font-size:15px;letter-spacing:.04em;color:#fff}
  .brand .n{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--apex),var(--purple));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
  .top .spacer{flex:1}
  .top .ic{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--nav-fg);cursor:pointer}
  .top .ic:hover{background:rgba(255,255,255,.08);color:#fff}
  .top .ic svg{width:18px;height:18px}

  .shell{display:grid;grid-template-columns:216px 1fr;min-height:calc(100vh - 52px)}
  .nav{background:var(--nav);padding:14px 12px;display:flex;flex-direction:column}
  .nav .grp{font-family:var(--font-m);font-size:9.5px;letter-spacing:.12em;color:var(--nav-fg-2);padding:6px 10px 8px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);font-size:13.5px;color:var(--nav-fg);margin-bottom:1px}
  .nav a .i{width:18px;height:18px;display:inline-flex;flex:none;opacity:.9} .nav a .i svg{width:18px;height:18px}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.on{background:var(--nav-on-bg);color:#fff}
  .nav a.on .i{opacity:1}
  .nav .user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid rgba(255,255,255,.08);color:var(--nav-fg);font-size:12.5px}
  .nav .user .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--apex),var(--cyan));color:#fff;font-family:var(--font-h);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}

  .main{background:var(--canvas);overflow-y:auto}
  .head{padding:20px 32px 0;background:var(--surface);border-bottom:1px solid var(--line)}
  .crumb{font-size:12.5px;color:var(--text-2);margin-bottom:10px}
  .crumb a:hover{color:var(--apex)} .crumb .sep{opacity:.4;margin:0 6px}
  .title-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .back{width:30px;height:30px;border:1px solid var(--line-2);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer}
  .back:hover{background:var(--hover)}
  h1{font-family:var(--font-h);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:-.01em}
  .chips{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .chip{font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--text-2)}
  .chip.active{background:var(--green-soft);border-color:transparent;color:var(--green)} .chip.active .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .chip.mode{background:var(--apex-soft);border-color:transparent;color:var(--apex)}
  .btns{display:flex;gap:8px;margin-bottom:16px}
  .btn{font-family:var(--font-h);font-weight:600;font-size:13px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:var(--r);padding:7px 14px;cursor:pointer}
  .btn:hover{background:var(--hover)} .btn.primary{background:var(--apex);border-color:var(--apex);color:#fff} .btn.primary:hover{background:#6f00a8}
  .tabs{display:flex;gap:2px}
  .tab{font-family:var(--font-h);font-weight:600;font-size:13px;color:var(--text-2);padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--apex);border-bottom-color:var(--apex)} .tab:hover{color:var(--ink)}

  .body{padding:26px 32px 70px;max-width:1080px}

  /* dashboard grid */
  .dash{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start}
  @media(max-width:900px){.dash{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:20px 22px}
  .card h2{font-family:var(--font-h);font-weight:700;font-size:15px;color:var(--ink);margin-bottom:3px}
  .card .sub{font-size:12px;color:var(--text-2);margin-bottom:16px}
  .card .full{grid-column:1/-1}
  .span2{grid-column:1/-1}

  /* posture spectrum (beautiful, light) */
  .spectrum{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px;margin:4px 0 16px}
  .spectrum .seg.red{background:linear-gradient(90deg,#d0402f,#e0685a)} .spectrum .seg.amber{background:linear-gradient(90deg,#c98a1e,#e2ad48)} .spectrum .seg.held{background:repeating-linear-gradient(45deg,#e3e3e8,#e3e3e8 5px,#d4d4dc 5px,#d4d4dc 10px)}
  .keys{display:flex;gap:22px;flex-wrap:wrap}
  .key{display:flex;align-items:baseline;gap:8px} .key .num{font-family:var(--font-h);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1}
  .key.red .num{color:var(--red)} .key.amber .num{color:var(--amber)} .key.green .num{color:var(--green)} .key.held .num{color:var(--text-2)}
  .key .lab{font-size:11.5px;color:var(--text-2)} .key .lab b{display:block;color:var(--ink);font-weight:600}

  .viewtabs{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;margin:2px 0 16px}
  .viewtabs button{font-family:var(--font-h);font-weight:600;font-size:12px;padding:7px 14px;background:var(--surface);border:none;border-right:1px solid var(--line);cursor:pointer;color:var(--text-2)}
  .viewtabs button:last-child{border-right:none} .viewtabs button.on{background:var(--ink);color:#fff}

  /* register rows (light, grade rail) */
  .reg{display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:3px 1.7fr .6fr auto;gap:16px;align-items:center;padding:15px 4px 15px 16px;border-bottom:1px solid var(--line);position:relative}
  .row:last-child{border-bottom:none}
  .row::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px}
  .row.red::before{background:var(--red)} .row.amber::before{background:var(--amber)} .row.held::before{background:var(--held)}
  .row.held{opacity:.66}
  .fnd{font-family:var(--font-h);font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:4px;letter-spacing:-.01em}
  .mt{font-size:12px;color:var(--text-2)} .mt .d{opacity:.4;margin:0 6px}
  .tier{font-family:var(--font-m);font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .tier.measured{background:var(--green-soft);color:var(--green)} .tier.benchmarked{background:var(--cyan-soft);color:var(--cyan)} .tier.estimated{background:var(--amber-soft);color:var(--amber)} .tier.unverified{background:#f0f0f3;color:var(--held)}
  .c3{display:flex;align-items:center;gap:14px;justify-content:flex-end}
  .ev{font-family:var(--font-m);font-size:10px;color:var(--text-2);text-align:right;max-width:150px;line-height:1.4}
  .held-foot{margin-top:16px;font-size:12px;color:var(--text-2);display:flex;gap:9px;align-items:flex-start;line-height:1.5}
  .held-foot .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--held);flex:none;margin-top:2px}
  .svg-wrap{overflow-x:auto;margin:0 -4px}

  /* side cards */
  .stat{display:flex;align-items:baseline;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .stat:last-child{border-bottom:none} .stat .v{font-family:var(--font-h);font-weight:700;color:var(--ink)}
  .stat .v.muted{color:var(--text-2);font-weight:500}
  .feed{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .feed:last-child{border-bottom:none}
  .feed .dot{width:8px;height:8px;border-radius:50%;background:var(--purple);flex:none}
  .feed .nm{color:var(--ink);font-weight:600} .feed .to{color:var(--text-2);font-size:11.5px}
  .signoff{background:var(--apex-soft);border:1px solid rgba(133,0,204,.2);border-radius:var(--r);padding:13px 15px;font-size:12.5px;color:var(--text);line-height:1.5} .signoff b{color:var(--ink)}

  .empty{padding:40px;text-align:center;color:var(--text-2);font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
  .empty b{color:var(--ink);font-family:var(--font-h)}
  .narr{font-size:13.5px;line-height:1.6;color:var(--text-2);border-left:2px solid var(--apex);padding:2px 0 2px 16px;margin:18px 0 2px} .narr b{color:var(--ink);font-family:var(--font-h);font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="n">N</span>HARNESS</div>
  <div class="spacer"></div>
  <div class="ic" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg></div>
  <div class="ic" title="Account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/></svg></div>
  <div class="ic" title="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .3c0 1.7-2.5 2-2.5 3.7"/><path d="M12 17h.01"/></svg></div>
</header>

<div class="shell">
  <aside class="nav">
    <div class="grp">APP</div>
    <a href="#"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="16" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span> Runbooks</a>
    <a href="#"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M8.5 13.5L7 21l5-3 5 3-1.5-7.5"/></svg></span> Experts</a>
    <a href="#"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6-6M8.5 12.5l-2 2a3 3 0 104 4l2-2M15.5 11.5l2-2a3 3 0 10-4-4l-2 2"/></svg></span> MCP configs</a>
    <a href="#" class="on"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4.5M8.5 4.5h7M9 13v1M15 13v1"/></svg></span> Coworkers</a>
    <a href="#"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h4l2 5 3-10 2 5h3"/></svg></span> Execution</a>
    <a href="#"><span class="i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3 3 7 3s7-1.3 7-3v-6"/></svg></span> Value Ledger</a>
    <div class="user"><span class="av">JS</span>Jude Scally</div>
  </aside>

  <main class="main">
    <div class="head">
      <div class="crumb"><a href="#">Coworkers</a><span class="sep">›</span><a href="#">EBR Coworker</a><span class="sep">›</span>Fenwick Logistics</div>
      <div class="title-row">
        <div class="back"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
        <h1>EBR Coworker — Fenwick Logistics</h1>
      </div>
      <div class="chips">
        <span class="chip">Tenant</span>
        <span class="chip active"><span class="d"></span>Active</span>
        <span class="chip mode">Assisted</span>
      </div>
      <div class="btns"><button class="btn">Edit</button><button class="btn">Pause</button><button class="btn">Clone</button><button class="btn">Archive</button><button class="btn primary" style="margin-left:auto">Run EBR cycle</button></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="body"><div id="stage"></div></div>
  </main>
</div>

<script>
const FINDINGS=[
  {id:'f1',finding:'3 admin accounts without MFA',area:'Identity & access',grade:'red',tier:'measured',owner:'David',status:'open',ev:'M365 · list_admin_accounts',history:[8,7,5,4,3]},
  {id:'f5',finding:'CVE-2026-4471 on 6 endpoints',area:'Risk & vulnerabilities',grade:'red',tier:'benchmarked',owner:'David',status:'open',ev:'Security Tabletop · cve_exposure',history:[null,null,null,null,6]},
  {id:'f6',finding:'No documented incident-response plan',area:'Risk & governance',grade:'held',tier:'unverified',owner:'Vanessa',status:'held',ev:'inferred — no source',history:[null,null,null,null,null]},
  {id:'f2',finding:'Backup restore test overdue 41 days',area:'Backup & recovery',grade:'amber',tier:'measured',owner:'David',status:'open',ev:'Cove · get_restore_tests',history:[0,0,0,0,41]},
  {id:'f3',finding:'Windows patch compliance at 82%',area:'Patching',grade:'amber',tier:'measured',owner:'David',status:'open',ev:'N-query · patch_compliance',history:[71,74,78,80,82]},
  {id:'f4',finding:'Phishing click-rate 22%',area:'Awareness training',grade:'amber',tier:'estimated',owner:'Vanessa',status:'open',ev:'usecure export (by hand)',history:[34,31,28,25,22]},
];
const FEEDS=[{cw:'Security Tabletop',area:'Risk & vulnerabilities'},{cw:'Incident Response Analyst',area:'Incidents & tickets'},{cw:'Environment Health Monitor',area:'Devices & lifecycle'}];
const CYCLES=['Q3·25','Q4·25','Q1·26','Q2·26','Q3·26'];
const GC={red:'#c0392b',amber:'#a56a00',green:'#137a46',held:'#8a8a93'};
const TABS=['Overview','Configuration','Versions','Runs','Audit','Promotion'];
let S={tab:'Overview',regView:'register'};
const el=id=>document.getElementById(id);

function renderTabs(){el('tabs').innerHTML=TABS.map(t=>`<div class="tab ${t===S.tab?'on':''}" onclick="setTab('${t}')">${t}</div>`).join('');}
function setTab(t){S.tab=t;render();}
function setView(v){S.regView=v;render();}

function render(){
  renderTabs();
  let h='';
  if(S.tab==='Overview') h=overview();
  else if(S.tab==='Runs') h=runs();
  else h=`<div class="empty"><b>${S.tab}</b><br>Real HARNESS tab — carried in the shell for fidelity. The EBR dashboard lives on Overview.</div>`;
  el('stage').innerHTML=h;
}

function overview(){
  const r=FINDINGS.filter(f=>f.grade==='red').length,a=FINDINGS.filter(f=>f.grade==='amber').length,held=FINDINGS.filter(f=>f.grade==='held').length;
  const seg=(c,n)=>n?`<div class="seg ${c}" style="flex:${n}"></div>`:'';
  return `<div class="dash">
    <div class="card span2">
      <h2>Fenwick Logistics — risk register</h2>
      <div class="sub">The living deliverable · Q3 2026 · graded against NCSC 10 / Cyber Essentials · git-tracked evidence trail</div>
      <div class="spectrum">${seg('red',r)}${seg('amber',a)}${seg('held',held)}</div>
      <div class="keys">
        <div class="key red"><span class="num">${r}</span><span class="lab"><b>Red</b>act now</span></div>
        <div class="key amber"><span class="num">${a}</span><span class="lab"><b>Amber</b>watch</span></div>
        <div class="key green"><span class="num">3</span><span class="lab"><b>Improving</b>vs last cycle</span></div>
        <div class="key held"><span class="num">${held}</span><span class="lab"><b>Held</b>needs a human</span></div>
      </div>
      <div class="viewtabs" style="margin-top:18px">
        <button class="${S.regView==='register'?'on':''}" onclick="setView('register')">Register</button>
        <button class="${S.regView==='system'?'on':''}" onclick="setView('system')">System map</button>
        <button class="${S.regView==='time'?'on':''}" onclick="setView('time')">Over time</button>
      </div>
      ${S.regView==='register'?regTable():S.regView==='system'?systemMap():overTime()}
    </div>

    <div class="card">
      <h2>Value</h2>
      <div class="sub">Written to the Value Ledger each run</div>
      <div class="stat"><span>Time saved this cycle</span><span class="v">~3.5 hrs</span></div>
      <div class="stat"><span>Findings drafted</span><span class="v">5 of 6</span></div>
      <div class="stat"><span>Handed to a human</span><span class="v muted">1 (held)</span></div>
      <div class="stat"><span>Last run</span><span class="v muted">Today, 09:12</span></div>
    </div>

    <div class="card">
      <h2>Fed by coworkers</h2>
      <div class="sub">Build these and the register gets richer</div>
      ${FEEDS.map(f=>`<div class="feed"><span class="dot"></span><span><span class="nm">${f.cw}</span><br><span class="to">→ ${f.area}</span></span></div>`).join('')}
    </div>

    <div class="card span2">
      <div class="signoff"><b>Sign-off required before client send.</b> One red finding is included, so this cycle needs a named human to approve — Vanessa (account lead) is on record for Fenwick. Unverified findings are hard-blocked from the client view regardless. <b>Nothing has been sent.</b></div>
    </div>
  </div>`;
}

function regTable(){
  const order={red:0,amber:1,green:2,held:3};
  const rows=[...FINDINGS].sort((x,y)=>order[x.grade]-order[y.grade]).map(f=>`
    <div class="row ${f.grade}"><div></div>
      <div><div class="fnd">${f.finding}</div><div class="mt">${f.area}<span class="d">·</span>${f.owner}<span class="d">·</span>${f.status}</div></div>
      <div><span class="tier ${f.tier}">${f.tier}</span></div>
      <div class="c3">${spark(f)}<div class="ev">${f.ev}</div></div>
    </div>`).join('');
  return `<div class="reg">${rows}</div>
    <div class="held-foot"><span class="dot"></span><span><b style="color:var(--held)">Held.</b> The IR-plan gap is inferred, not measured — kept in the internal register (absence is itself a finding) but hard-blocked from the client view until a human vouches.</span></div>`;
}
function spark(f){
  const pts=f.history.filter(v=>v!==null);if(pts.length<2)return `<span class="ev" style="font-style:normal">new</span>`;
  const w=84,h=26,min=Math.min(...pts),max=Math.max(...pts),rng=(max-min)||1,step=w/(pts.length-1),nm=v=>h-4-((v-min)/rng)*(h-8);
  const d=pts.map((v,i)=>`${i?'L':'M'}${(i*step).toFixed(1)},${nm(v).toFixed(1)}`).join(' ');
  const last=pts[pts.length-1],first=pts[0],better=f.id==='f2'?false:last<first,col=better?GC.green:GC.amber,g='g'+f.id;
  const area=`M0,${h} L`+pts.map((v,i)=>`${(i*step).toFixed(1)},${nm(v).toFixed(1)}`).join(' L')+` L${w},${h} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${g}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".2"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${g})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${((pts.length-1)*step).toFixed(1)}" cy="${nm(last).toFixed(1)}" r="2.6" fill="${col}"/></svg>`;
}
function systemMap(){
  const W=860,H=500,cx=W/2,cy=H/2;const areas=[...new Set(FINDINGS.map(f=>f.area))];FEEDS.forEach(fd=>{if(!areas.includes(fd.area))areas.push(fd.area);});
  const R=150,Rl=232,Rc=258,n=areas.length,ap={};areas.forEach((a,i)=>{const g=(-90+i*360/n)*Math.PI/180;ap[a]={x:cx+R*Math.cos(g),y:cy+R*Math.sin(g),g};});
  const cv=(x1,y1,x2,y2)=>{const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1;return `M${x1},${y1} Q${mx-dy*0.12},${my+dx*0.12} ${x2},${y2}`;};
  let links=areas.map(a=>`<path d="${cv(cx,cy,ap[a].x,ap[a].y)}" fill="none" stroke="#e2e2e8" stroke-width="1.2"/>`).join('');
  let leaves=FINDINGS.map((f,i)=>{const p=ap[f.area],g=p.g+0.3*((i%2)?1:-1),lx=cx+Rl*Math.cos(g),ly=cy+Rl*Math.sin(g),hd=f.grade==='held';
    return `<path d="${cv(p.x,p.y,lx,ly)}" stroke="${hd?'#c9c9d0':GC[f.grade]}" stroke-width="1.3" ${hd?'stroke-dasharray="3 3"':''} fill="none" opacity=".6"/><circle cx="${lx}" cy="${ly}" r="6.5" fill="${hd?'#fff':GC[f.grade]}" stroke="${hd?'#8a8a93':'#fff'}" stroke-width="${hd?2:1.2}"/><text x="${lx}" y="${ly+(Math.sin(g)>0?18:-11)}" text-anchor="middle" font-family="Inter" font-size="9" fill="#6b6c72">${f.finding.length>22?f.finding.slice(0,20)+'…':f.finding}</text>`;}).join('');
  let an=areas.map(a=>{const p=ap[a];return `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#fff" stroke="#8500cc" stroke-width="1.6"/><text x="${p.x}" y="${p.y-11}" text-anchor="middle" font-family="Manrope" font-size="10.5" font-weight="600" fill="#18171c">${a}</text>`;}).join('');
  let fd=FEEDS.map(f=>{const p=ap[f.area],g=p.g,fx=cx+Rc*Math.cos(g),fy=cy+Rc*Math.sin(g);return `<path d="${cv(fx,fy,p.x,p.y)}" stroke="#0a95c4" stroke-width="1.5" fill="none" opacity=".85" marker-end="url(#ar)"/><rect x="${fx-56}" y="${fy-11}" width="112" height="22" rx="11" fill="#e7f6fb" stroke="#0a95c4"/><text x="${fx}" y="${fy+4}" text-anchor="middle" font-family="Inter" font-size="9" font-weight="600" fill="#086a8c">${f.cw}</text>`;}).join('');
  return `<div class="svg-wrap" style="margin-top:14px"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0a95c4"/></marker></defs>${links}${fd}${leaves}${an}<circle cx="${cx}" cy="${cy}" r="36" fill="#17131f"/><text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="Manrope" font-size="12" font-weight="700" fill="#fff">Fenwick</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-family="Inter" font-size="9" fill="#c3bdd0">Customer</text></svg></div>
  <div class="narr">Cyan arrows are other coworkers feeding a section. Build them and the register fills itself in.</div>`;
}
function overTime(){
  const tr=FINDINGS.filter(f=>f.history.filter(v=>v!==null).length>=2);
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px">${tr.map(f=>{
    const pts=f.history.map((v,i)=>({v,i})).filter(p=>p.v!==null),w=188,h=52,min=Math.min(...pts.map(p=>p.v)),max=Math.max(...pts.map(p=>p.v)),rng=(max-min)||1,step=w/(f.history.length-1),nm=v=>h-8-((v-min)/rng)*(h-16);
    const d=pts.map((p,i)=>`${i?'L':'M'}${(p.i*step).toFixed(1)},${nm(p.v).toFixed(1)}`).join(' '),first=pts[0].v,last=pts[pts.length-1].v,better=f.id==='f2'?false:last<first,col=better?GC.green:GC.amber;
    return `<div style="border:1px solid var(--line);border-radius:var(--r);padding:14px 16px"><div style="font-family:var(--font-h);font-weight:600;font-size:13px;color:var(--ink);margin-bottom:2px">${f.finding}</div><div style="font-family:var(--font-m);font-size:11px;color:${col};margin-bottom:8px">${first}→${last} · ${better?'↓ improving':(f.id==='f2'?'↑ slipped':'—')}</div><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%"><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${(p.i*step).toFixed(1)}" cy="${nm(p.v).toFixed(1)}" r="2.4" fill="${col}"/>`).join('')}</svg><div style="font-family:var(--font-m);font-size:9px;color:var(--text-2);display:flex;justify-content:space-between"><span>${CYCLES[0]}</span><span>${CYCLES[4]}</span></div></div>`;
  }).join('')}</div><div class="narr">The renewal story — same findings across five cycles. New-this-cycle findings carry no history and are shown honestly as new.</div>`;
}
function runs(){
  return `<div class="card"><h2>Run history</h2><div class="sub">Each run writes to the Value Ledger and appends to the register</div>
    <div class="stat"><span><b style="color:var(--ink)">Q3 2026 cycle</b> · today 09:12</span><span class="v" style="color:var(--green)">Completed · 5 findings</span></div>
    <div class="stat"><span>Q2 2026 cycle · 14 May</span><span class="v muted">Completed · 4 findings</span></div>
    <div class="stat"><span>Q1 2026 cycle · 10 Feb</span><span class="v muted">Completed · 4 findings</span></div>
    <div class="narr" style="margin-top:16px">Value → <b>Time saved: ~11 hrs across 3 cycles</b>. Every run is a commit; the register's git history is the audit trail (see the Audit tab).</div></div>`;
}
render();
</script>

# project.conf — WORKED EXAMPLE: the overnight alert digest (FICTIONAL)
#
# This makes the example a complete miniature project, so the checks can actually
# run against it:
#
#     cd examples/alert-digest && ../../check-gates.sh
#
# The scripts resolve project.conf relative to the working directory, so an
# example folder with its own conf is a self-contained project. Nothing here
# touches the real skeleton at the repo root.

PROJECT_NAME="Overnight alert digest (fictional example)"
PROCESS_TIER="full"

# No Intent Spec in this example. The Intent Spec is a separate, already-
# established document that this layer bolts onto — the example is about the
# evidence mechanism, so it is left out rather than faked. The §5 resolution
# check stays quiet when there is nothing to resolve against.
INTENT_SPEC=""
BUILD=""

# Gate files. Gate 1 only — the example exists to demonstrate the evidence
# ceiling, and one file is enough to do that. A missing Gate 2/3 is a legal
# state as long as it is not pretended otherwise.
GATE_1="ux.md"
GATE_2=""
GATE_3=""

FINDINGS="findings.yaml"
CORPUS_PATHS=""

# ── judgment slots ──────────────────────────────────────────────────────────
# Left UNASSIGNED on purpose. These are the questions the kickoff exists to ask
# a room, and a generated answer reads exactly like a real one while containing
# none of the judgment. An example must not model filling them in.
ROSTER=(
  "UNASSIGNED|Product|UNASSIGNED"
  "UNASSIGNED|Design|UNASSIGNED"
  "UNASSIGNED|Research|UNASSIGNED"
  "UNASSIGNED|Engineering|UNASSIGNED"
)
ACCOUNTABLE_OWNER="UNASSIGNED"
RESEARCH_OWNER="UNASSIGNED"
RISK_FUNCTION="UNASSIGNED"
ESCALATION_PATH="UNASSIGNED"
ESCALATION_PATH_TESTED="false"

# The five findings are a mix of sourced and unsourced by design.
EVIDENCE_BASIS="MIXED"
MANIFEST=""

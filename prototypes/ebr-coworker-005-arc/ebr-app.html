<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBR Coworker — HARNESS</title>
<!-- THE unified, clickable EBR app inside HARNESS. One SPA, everything wired:
     Coworkers list → build the EBR coworker through the steps → activate → its live risk-register
     dashboard (Overview/Runs/etc.) → the coworker family that feeds it. Left nav, tabs, stepper,
     toggles, findings, buttons all respond. Layperson-guided: jargon tooltips.
     Chrome + IA grounded in real HARNESS (Beth's screenshot 2026-08-27). Light/restrained = eng reality;
     the register is the extra-beautiful Apex-UI data viz within it. All data fictional (§9b). Supersedes
     the scattered landing/console/build-ebr/ebr-product/ebr-dashboard files (kept as separate tracks). -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#f5f5f7; --surface:#fff; --hover:#f6f4f9;
    --nav:#17131f; --nav-fg:#c3bdd0; --nav-fg-2:#7c7590; --nav-on-bg:#2a2140;
    --ink:#18171c; --text:#45464a; --text-2:#6b6c72;
    --line:#e7e7ec; --line-2:#d7d7de;
    --apex:#8500cc; --apex-soft:rgba(133,0,204,.07); --purple:#a24dff; --cyan:#0a95c4; --cyan-soft:#e7f6fb;
    --red:#c0392b; --red-soft:#fbecea; --amber:#a56a00; --amber-soft:#f8eeda; --green:#137a46; --green-soft:#e7f6ee; --held:#8a8a93;
    --lock:#a56a00; --lock-soft:#f8eeda; /* Pass 2: locked state — its own semantic role, not reused selection-purple */
    --r:6px; --r-lg:10px; --r-pill:999px;
    --sh:0 1px 2px rgba(20,10,40,.05),0 1px 3px rgba(20,10,40,.05); --sh-lg:0 6px 24px -8px rgba(20,10,40,.16);
    --font-h:'Manrope',-apple-system,sans-serif; --font-b:'Inter',-apple-system,sans-serif; --font-m:'Inter',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--canvas);color:var(--text);font-family:var(--font-b);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{text-decoration:none;color:inherit} button{font-family:inherit;cursor:pointer}

  .top{display:flex;align-items:center;gap:14px;height:52px;padding:0 18px;background:var(--nav);color:#fff}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--font-h);font-weight:700;font-size:15px;letter-spacing:.22em}
  .brand .n{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 38%,rgba(255,158,207,.22),rgba(185,139,255,.10) 55%,transparent 72%);
    box-shadow:inset 0 0 0 1px rgba(255,214,168,.18)}
  .brand .n svg{width:26px;height:26px;filter:drop-shadow(0 0 5px rgba(255,158,207,.45))}
  .top .spacer{flex:1}
  .top .ic{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--nav-fg)}
  .top .ic:hover{background:rgba(255,255,255,.08);color:#fff} .top .ic svg{width:18px;height:18px}

  .shell{display:grid;grid-template-columns:216px 1fr;min-height:calc(100vh - 52px)}
  .nav{background:var(--nav);padding:14px 12px;display:flex;flex-direction:column}
  .nav .grp{font-family:var(--font-m);font-size:9.5px;letter-spacing:.12em;color:var(--nav-fg-2);padding:6px 10px 8px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);font-size:13.5px;color:var(--nav-fg);margin-bottom:1px}
  .nav a .i{width:18px;height:18px;display:inline-flex;flex:none;opacity:.9} .nav a .i svg{width:18px;height:18px}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.on{background:var(--nav-on-bg);color:#fff}
  .nav .user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid rgba(255,255,255,.08);color:var(--nav-fg);font-size:12.5px}
  .nav .user .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--apex),var(--cyan));color:#fff;font-family:var(--font-h);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}

  .main{overflow-y:auto}
  .head{padding:20px 32px 0;background:var(--surface);border-bottom:1px solid var(--line)}
  .crumb{font-size:12.5px;color:var(--text-2);margin-bottom:10px} .crumb .lk{cursor:pointer} .crumb .lk:hover{color:var(--apex)} .crumb .sep{opacity:.4;margin:0 6px}
  .title-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .back{width:30px;height:30px;border:1px solid var(--line-2);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--text-2)} .back:hover{background:var(--hover)}
  h1{font-family:var(--font-h);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:-.01em}
  .page-sub{font-size:13.5px;color:var(--text-2);margin:-2px 0 16px;max-width:70ch}
  .chips{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .chip{font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--text-2)}
  .chip.active{background:var(--green-soft);border-color:transparent;color:var(--green)} .chip.active .d{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .chip.draft{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
  .chip.mode{background:var(--apex-soft);border-color:transparent;color:var(--apex)}
  .btns{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .btn{font-family:var(--font-h);font-weight:600;font-size:13px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:var(--r);padding:8px 14px}
  .btn:hover{background:var(--hover)} .btn.primary{background:var(--apex);border-color:var(--apex);color:#fff} .btn.primary:hover{background:#6f00a8} .btn.primary:disabled{opacity:.4;cursor:not-allowed}
  .btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#fff} .btn.cyan:hover{background:#0982ab}
  .tabs{display:flex;gap:2px;overflow-x:auto}
  .tab{font-family:var(--font-h);font-weight:600;font-size:13px;color:var(--text-2);padding:12px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap} .tab.on{color:var(--apex);border-bottom-color:var(--apex)} .tab:hover{color:var(--ink)}
  .body{padding:26px 32px 80px;max-width:1080px}

  /* jargon tooltip */
  .term{border-bottom:1px dotted var(--apex);cursor:help;position:relative;color:var(--ink);font-weight:500}
  .term sup{color:var(--apex);font-size:.7em}
  .term .tip{position:absolute;left:0;bottom:calc(100% + 8px);width:250px;background:var(--ink);color:#eee;border-radius:var(--r);padding:10px 12px;font-size:12px;font-weight:400;line-height:1.5;box-shadow:var(--sh-lg);opacity:0;visibility:hidden;transform:translateY(4px);transition:.15s;z-index:30;white-space:normal}
  .term .tip b{color:#fff} .term:hover .tip{opacity:1;visibility:visible;transform:translateY(0)}
  .term .tip::after{content:"";position:absolute;left:16px;top:100%;border:6px solid transparent;border-top-color:var(--ink)}

  /* Coworker<->Runbook honesty badge — one reusable component, 2 of 3 sites this pass (3rd is Pass 2's Runbooks screen) */
  .honesty-badge{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--amber);background:var(--amber-soft);color:var(--amber);font-family:var(--font-m);font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);cursor:help;position:relative;white-space:nowrap}
  .honesty-badge .tip{position:absolute;right:0;bottom:calc(100% + 8px);width:270px;background:var(--ink);color:#eee;border-radius:var(--r);padding:10px 12px;font-size:11.5px;font-weight:400;line-height:1.5;box-shadow:var(--sh-lg);opacity:0;visibility:hidden;transform:translateY(4px);transition:.15s;z-index:30;white-space:normal;text-align:left}
  .honesty-badge:hover .tip,.honesty-badge:focus .tip{opacity:1;visibility:visible;transform:translateY(0)}
  .honesty-badge .tip::after{content:"";position:absolute;right:16px;top:100%;border:6px solid transparent;border-top-color:var(--ink)}

  /* coworker family cards */
  .cw-strip{background:linear-gradient(120deg,#221241,#3a1266);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:26px;display:flex;align-items:center;gap:22px;color:#fff}
  .cw-strip .ic{width:48px;height:48px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none} .cw-strip .ic svg{width:24px;height:24px}
  .cw-strip .tx{flex:1} .cw-strip .db{display:inline-flex;align-items:center;gap:6px;background:var(--amber-soft);color:var(--amber);font-family:var(--font-m);font-size:10px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);margin-bottom:8px}
  .cw-strip h2{font-family:var(--font-h);font-weight:700;font-size:18px;color:#fff;margin-bottom:4px} .cw-strip p{font-size:13px;color:#e0d5ef;max-width:52ch}
  .sec-h{font-family:var(--font-h);font-weight:700;font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px} @media(max-width:900px){.grid{grid-template-columns:1fr 1fr}} @media(max-width:600px){.grid{grid-template-columns:1fr}}
  .cw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh);transition:.14s} .cw:hover{border-color:var(--apex);box-shadow:var(--sh-lg);transform:translateY(-2px)}
  .cw .cat{font-family:var(--font-m);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);margin-bottom:9px}
  .cw h3{font-family:var(--font-h);font-weight:700;font-size:16px;color:var(--ink);margin-bottom:7px} .cw p{font-size:12.5px;color:var(--text-2);line-height:1.5;margin-bottom:14px;min-height:52px}
  .cw .feed{font-size:11px;color:var(--apex);background:var(--apex-soft);border-radius:var(--r);padding:6px 9px;margin-bottom:13px;line-height:1.4}
  .cw .st{display:flex;align-items:center;gap:8px} .cw .st .avail{font-family:var(--font-m);font-size:10.5px;color:var(--cyan);background:var(--cyan-soft);border-radius:var(--r-pill);padding:3px 9px}

  /* build stepper */
  .stepper{display:flex;gap:2px;margin-bottom:24px;overflow-x:auto}
  .stp{flex:1;min-width:110px;padding:12px 6px;border-bottom:2px solid var(--line);text-align:center} .stp .n{font-family:var(--font-m);font-size:9px;color:var(--text-2);display:block;margin-bottom:3px} .stp .t{font-family:var(--font-h);font-weight:600;font-size:12.5px;color:var(--text-2)}
  .stp.on{border-bottom-color:var(--apex)} .stp.on .t{color:var(--ink)} .stp.on .n{color:var(--apex)} .stp.done .n{color:var(--green)} .stp.done .t{color:var(--text)} .stp:hover .t{color:var(--ink)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:26px}
  .panel h2{font-family:var(--font-h);font-weight:800;font-size:21px;color:var(--ink);letter-spacing:-.01em;margin-bottom:8px}
  .lede{font-size:15px;color:var(--text-2);max-width:64ch;line-height:1.6;margin-bottom:22px}
  .actions{margin-top:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap} .actions .lk{font-size:13px;color:var(--text-2)} .actions .lk:hover{color:var(--apex);cursor:pointer}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:600px){.cards{grid-template-columns:1fr}}
  .card{border:1.5px solid var(--line);border-radius:var(--r-lg);padding:17px;background:var(--surface);transition:.14s;position:relative} .card:hover,.card.picked{border-color:var(--apex);background:var(--apex-soft)}
  .card .rec{position:absolute;top:-10px;right:14px;background:var(--apex);color:#fff;font-family:var(--font-m);font-size:9px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill)}
  .card .nm{font-family:var(--font-h);font-weight:700;font-size:15px;color:var(--ink);margin-bottom:5px} .card .d{font-size:12.5px;color:var(--text-2);line-height:1.5}
  .drop{border:2px dashed var(--line-2);border-radius:var(--r-lg);padding:28px;text-align:center;background:var(--hover);margin-bottom:14px} .drop .big{font-family:var(--font-h);font-weight:700;font-size:16px;color:var(--ink);margin-bottom:4px} .drop .sm{font-size:12.5px;color:var(--text-2)}
  .shape-row{display:grid;grid-template-columns:repeat(3,1fr);gap:11px} @media(max-width:600px){.shape-row{grid-template-columns:1fr}}
  .shape{border:1.5px solid var(--line);border-radius:var(--r);padding:13px;background:var(--surface);transition:.14s} .shape:hover,.shape.picked{border-color:var(--apex);background:var(--apex-soft)} .shape .t{font-family:var(--font-h);font-weight:600;font-size:13px;color:var(--ink);margin-bottom:3px} .shape .d{font-size:11px;color:var(--text-2);line-height:1.4}
  .src{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden} .src .h{display:flex;align-items:center;gap:12px;padding:12px 14px} .src .h:hover{background:var(--hover)} .src .h .s{font-family:var(--font-h);font-weight:600;color:var(--ink);flex:none;width:170px} @media(max-width:600px){.src .h .s{width:auto;flex:1}} .src .h .p{flex:1;font-size:12px;color:var(--text-2)} @media(max-width:600px){.src .h .p{display:none}}
  .pill{font-family:var(--font-m);font-size:9px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap} .pill.auto{background:var(--green-soft);color:var(--green)} .pill.cw{background:var(--apex-soft);color:var(--apex)} .pill.client{background:var(--cyan-soft);color:var(--cyan)} .pill.you{background:#f0f0f3;color:var(--text-2)}
  .src .tech{max-height:0;overflow:hidden;transition:.18s;background:var(--hover)} .src .tech.open{max-height:100px;padding:12px 14px;border-top:1px solid var(--line)} .src .tech .kv{font-family:var(--font-m);font-size:10.5px;color:var(--text);line-height:1.7} .src .tech .kv b{color:var(--ink)}
  .caret{font-family:var(--font-m);font-size:10px;color:var(--text-2)}
  .gate-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-bottom:none;font-size:12.5px} .gate-row:first-child{border-radius:var(--r) var(--r) 0 0} .gate-row:last-child{border-bottom:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
  .gate-row .s{flex:1;font-weight:600;color:var(--ink)} .gate-row .a{font-family:var(--font-m);font-size:10px;font-weight:700;width:110px;text-align:right} .gate-row.does .a{color:var(--green)} .gate-row.you .a{color:var(--amber)} .gate-row.you{background:var(--amber-soft)}
  .tgl{width:36px;height:21px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:.15s} .tgl.on{background:var(--apex)} .tgl .k{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s} .tgl.on .k{left:17px}
  .callout{border-left:3px solid var(--apex);background:var(--apex-soft);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;margin:16px 0;font-size:13px;color:var(--text);line-height:1.55} .callout b{color:var(--ink)}
  label.chk{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--text);margin-bottom:11px;line-height:1.45;cursor:pointer} label.chk input{margin-top:2px;width:16px;height:16px;accent-color:var(--apex);flex:none}
  .gate-box{border:2px solid var(--apex);background:var(--apex-soft);border-radius:var(--r-lg);padding:20px;margin:8px 0}
  .gate-box h3{font-family:var(--font-h);font-size:15px;color:var(--ink);margin-bottom:10px}

  /* dashboard */
  .dash{display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start} @media(max-width:900px){.dash{grid-template-columns:1fr}}
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);padding:20px 22px} .dcard.span2{grid-column:1/-1}
  .dcard h2{font-family:var(--font-h);font-weight:700;font-size:15px;color:var(--ink);margin-bottom:3px} .dcard .sub{font-size:12px;color:var(--text-2);margin-bottom:16px}
  .spectrum{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px;margin:4px 0 16px} .spectrum .seg.red{background:linear-gradient(90deg,#d0402f,#e0685a)} .spectrum .seg.amber{background:linear-gradient(90deg,#c98a1e,#e2ad48)} .spectrum .seg.held{background:repeating-linear-gradient(45deg,#e3e3e8,#e3e3e8 5px,#d4d4dc 5px,#d4d4dc 10px)}
  .keys{display:flex;gap:22px;flex-wrap:wrap} .key{display:flex;align-items:baseline;gap:8px} .key .num{font-family:var(--font-h);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1} .key.red .num{color:var(--red)} .key.amber .num{color:var(--amber)} .key.green .num{color:var(--green)} .key.held .num{color:var(--text-2)} .key .lab{font-size:11.5px;color:var(--text-2)} .key .lab b{display:block;color:var(--ink);font-weight:600}
  .viewtabs{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;margin:18px 0 16px} .viewtabs button{font-family:var(--font-h);font-weight:600;font-size:12px;padding:7px 14px;background:var(--surface);border:none;border-right:1px solid var(--line);color:var(--text-2)} .viewtabs button:last-child{border-right:none} .viewtabs button.on{background:var(--ink);color:#fff}
  .reg{display:flex;flex-direction:column} .row{display:grid;grid-template-columns:3px 1.7fr .6fr auto;gap:16px;align-items:center;padding:15px 4px 15px 16px;border-bottom:1px solid var(--line);position:relative} .row:last-child{border-bottom:none} .row::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:2px} .row.red::before{background:var(--red)} .row.amber::before{background:var(--amber)} .row.held::before{background:var(--held)} .row.held{opacity:.66} .row:hover{background:var(--hover)}
  .fnd{font-family:var(--font-h);font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:4px;letter-spacing:-.01em} .mt{font-size:12px;color:var(--text-2)} .mt .d{opacity:.4;margin:0 6px}
  .tier{font-family:var(--font-m);font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap} .tier.measured{background:var(--green-soft);color:var(--green)} .tier.benchmarked{background:var(--cyan-soft);color:var(--cyan)} .tier.estimated{background:var(--amber-soft);color:var(--amber)} .tier.unverified{background:#f0f0f3;color:var(--held)}
  .c3{display:flex;align-items:center;gap:14px;justify-content:flex-end} .ev{font-family:var(--font-m);font-size:10px;color:var(--text-2);text-align:right;max-width:150px;line-height:1.4}
  .fdetail{grid-column:1/-1;background:var(--hover);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:4px 0 2px;font-size:12.5px;color:var(--text);line-height:1.6} .fdetail b{color:var(--ink)}
  .stat{display:flex;align-items:baseline;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px} .stat:last-child{border-bottom:none} .stat .v{font-family:var(--font-h);font-weight:700;color:var(--ink)} .stat .v.muted{color:var(--text-2);font-weight:500}
  .feed{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px} .feed:last-child{border-bottom:none} .feed:hover .nm{color:var(--apex)} .feed .dot{width:8px;height:8px;border-radius:50%;background:var(--purple);flex:none} .feed .nm{color:var(--ink);font-weight:600} .feed .to{color:var(--text-2);font-size:11.5px}
  .signoff{background:var(--apex-soft);border:1px solid rgba(133,0,204,.2);border-radius:var(--r);padding:13px 15px;font-size:12.5px;color:var(--text);line-height:1.5} .signoff b{color:var(--ink)}
  .held-foot{margin-top:16px;font-size:12px;color:var(--text-2);display:flex;gap:9px;align-items:flex-start;line-height:1.5} .held-foot .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--held);flex:none;margin-top:2px}
  .narr{font-size:13.5px;line-height:1.6;color:var(--text-2);border-left:2px solid var(--apex);padding:2px 0 2px 16px;margin:18px 0 2px} .narr b{color:var(--ink);font-family:var(--font-h);font-weight:600}
  .svg-wrap{overflow-x:auto;margin:0 -4px}

<script>
const TIPS={
  coworker:"An AI <b>coworker</b> is an agent with a job description, a runbook, and a risk policy. It does repeatable work and proposes results — a human always approves before anything ships.",
  register:"A <b>risk register</b> is one living list of every finding for a client — owned, dated, graded, kept over time. The durable thing the review produces, not a report you rebuild each quarter.",
  connector:"A <b>connector</b> (MCP) is a secure link to a system you already use — N-central, Microsoft 365 — so the coworker reads live data instead of you copy-pasting it.",
  tier:"A <b>confidence tier</b>: Measured (from a connected source), Benchmarked (vs a standard), Estimated (inferred), or Unverified (a guess it won't make).",
  held:"<b>Held</b> = Unverified. The coworker refuses to guess, so it keeps this off anything a client sees until a person vouches for it.",

/* ---- FINDINGS — reconciled shape, 2026-09-01 (ebr-coworker-rebuild brief §"File layout") ----

   Base fields (id/finding/area/grade/tier/owner/status/ev/history/why) are unchanged — every
   existing renderer in this file keeps working untouched. Added fields, by source:

  const chips=S.activated?`<span class="chip">Tenant</span><span class="chip active"><span class="d"></span>Active</span><span class="chip mode">${T('assisted','Assisted')}</span>`:`<span class="chip">Tenant</span><span class="chip draft">◐ Draft</span><span class="chip mode">${T('assisted','Assisted')}</span>`;
  const actions=S.activated?`<button class="btn">Edit</button><button class="btn">Pause</button><button class="btn">Clone</button><button class="btn">Archive</button><button class="btn cyan" style="margin-left:auto" onclick="openReport()">View client report</button><button class="btn primary" onclick="runCycle()">Run EBR cycle</button>`:`<button class="btn" onclick="closeEbr()">Cancel</button>`;
  el('head').innerHTML=`<div class="crumb"><span class="lk" onclick="setNav('coworkers')">Coworkers</span><span class="sep">›</span><span class="lk" onclick="closeEbr()">EBR Coworker</span><span class="sep">›</span>Fenwick Logistics</div>
    <div class="title-row"><div class="back" onclick="closeEbr()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div><h1>EBR Coworker — Fenwick Logistics</h1></div>
    <div class="chips">${chips}</div><div class="btns">${actions}</div>
    ${S.activated?`<div class="tabs">${DTABS.map(t=>`<div class="tab ${t===S.tab?'on':''}" onclick="setTab('${t}')">${t}</div>`).join('')}</div>`:`<div style="height:8px"></div>`}`;
}
function shape(){return SHAPES.find(x=>x.id===S.shape);}
function gapAreas(){return AREAS.filter(a=>a.avail==='client'||a.avail==='you');}
function renderBuild(){
  ebrHead();
  const s=S.step;let h=`<div class="stepper">${BUILD.map((t,i)=>`<div class="stp ${i===s?'on':(i<s?'done':'')}" onclick="goStep(${i})"><span class="n">STEP ${i+1}</span><span class="t">${t}</span></div>`).join('')}</div>`;

  if(s===0){h+=`<div class="panel"><h2>Show me your report and I’ll build a thing</h2>
    <p class="lede">Bring the review you already make — the actual thing you sent a client last quarter. The messier it is, the more useful. Or start from a template. Anything you add becomes the first entries in the ${T('register')}.</p>
    <div class="drop" onclick="pick('workbook')"><div class="big">Drop your last EBR here</div><div class="sm">.xlsx · .pptx · .docx · .pdf — nothing leaves your tenant</div></div>
    <div class="or">or pick a shape to walk through</div>
    <div class="shape-row">${SHAPES.map(sh=>`<div class="shape ${sh.template?'tmpl':''} ${S.shape===sh.id?'picked':''}" onclick="pick('${sh.id}')"><div class="t">${sh.name}</div><div class="d">${sh.desc}</div><div style="font-family:var(--font-m);font-size:10px;color:${sh.template?'var(--cyan)':'var(--apex)'};margin-top:8px">${sh.meta}</div></div>`).join('')}</div>
    <div class="addfiles"><div style="font-family:var(--font-h);font-weight:700;font-size:13.5px;color:var(--ink);margin:0 0 6px">Anything else that helps? <span style="font-weight:500;color:var(--text-2)">(optional)</span></div>
      <div style="font-size:12px;color:var(--text-2);margin-bottom:10px">Kickoff transcripts, account notes, a previous risk register — what you’d hand a new analyst. Context, not structure.</div>
      <div>${renderChips()}</div>
      <div class="add-input"><input id="addf" placeholder="e.g. Fenwick-risk-register-Q2.xlsx" value="${S.addDraft}" oninput="S.addDraft=this.value" onkeydown="if(event.key==='Enter')addFile()"><button class="btn" onclick="addFile()">+ Add file</button></div></div>
    <div class="actions"><button class="btn primary" ${S.shape?'':'disabled'} onclick="goStep(1)">${shape()&&shape().template?'Use this template →':'Read it →'}</button></div></div>`;}

  else if(s===1){h+=`<div class="panel"><h2>Connect your AI</h2><p class="lede">A coworker pairs an N-able AI expert with your ${T('runbook','runbook')}. The expert reasons; your runbook keeps it on your rails. It proposes; you decide.</p>
    <div class="cards"><div class="card ${S.ai==='nzo'?'picked':''}" onclick="setAI('nzo')"><div class="rec">RECOMMENDED</div><div class="nm">N-zo</div><div class="d">N-able’s own assistant. Already knows your stack. Advises and drafts, never acts alone.</div></div>
    <div class="card ${S.ai==='claude'?'picked':''}" onclick="setAI('claude')"><div class="nm">Claude Code</div><div class="d">Bring your own agent. Same build, same approval model.</div></div></div>
    <div class="callout">Whichever you pick, the rule holds: nothing reaches a client without a named human ${T('activate','sign-off')}.</div>
    <div style="display:flex;align-items:center;gap:10px;margin:14px 0"><span style="font-size:12px;color:var(--text-2)">Which runbook will this coworker run?</span>${honestyBadge()}</div>
    <div class="actions"><span class="lk" onclick="goStep(0)">← Back</span><button class="btn primary" ${S.ai?'':'disabled'} onclick="goStep(2)">Continue →</button></div></div>`;}

  else if(s===2){const sh=shape();
    const structTabs=`<div class="tabs" style="border-bottom:1px solid var(--line);margin-bottom:20px"><div class="tab ${S.structTab==='read'?'on':''}" onclick="setStructTab('read')">Read it</div><div class="tab ${S.structTab==='sources'?'on':''}" onclick="setStructTab('sources')">Sources</div></div>`;
    const readBody=`<p class="lede">Structure only — what sections exist, what repeats, where the grades live. Each becomes a stream of findings in the register.${S.extraFiles.length?` Plus ${S.extraFiles.length} extra file${S.extraFiles.length>1?'s':''} for context.`:''}</p>
    <div class="console" id="pc">${S.parseLog.map(l=>`<div class="cl ${l.cls}"><span class="ts">${l.t}</span><span>${l.text}</span></div>`).join('')}</div>
    ${S.parsed?`${sh.template?`<div class="callout"><b>Started from Stefanie’s framework.</b> The structure is the template, risk register built in — every finding a clean slate you fill over cycles.</div>`:sh.quality==='low'?`<div class="warncall"><b>This one barely parsed.</b> Nothing repeats between quarters. Honest answer: start from the template instead, or have a conversation first.</div>`:sh.quality==='medium'?`<div class="warncall"><b>Partial parse.</b> Headings found, grades implied by slide colour. The register will guess the grading scale and need correcting on cycle one.</div>`:`<div class="callout"><b>Clean parse.</b> Consistent tabs, a grading column, and a carry-forward tab — proof this is a series, not a one-off.</div>`}`:'<div style="font-size:12.5px;color:var(--text-2)">Reading…</div>'}`;
    const sourcesBody=`<p class="lede">Plain on top — enough to read to a client. Open any row for the ${T('connector')} setup your engineer needs. Availability is scouted, not assumed.</p>
    ${AREAS.map(a=>`<div class="src"><div class="h" onclick="tech('${a.sec.replace(/'/g,"\\'")}')"><span class="s">${a.sec}</span><span class="p">${a.plain}</span><span class="pill ${a.avail}">${({auto:'Connected',cw:'From a coworker',client:'Ask the client',you:'Your judgment'})[a.avail]}</span><span class="caret">${S.openTech[a.sec]?'▲':'▼'}</span></div><div class="tech ${S.openTech[a.sec]?'open':''}"><div class="kv"><b>Setup:</b> ${techStr(a)} · <b>Ceiling:</b> ${({measured:'Measured',benchmarked:'Benchmarked',estimated:'Estimated',unverified:'Your judgment'})[a.tier]} · <b>Owner:</b> ${a.owner}</div></div></div>`).join('')}
    <div class="callout"><b>Two areas are fed by other coworkers</b> (risk, incidents) — build those and this fills in on its own. <b>Two have no connector at all</b> — the next step is how you fill those without chasing the client yourself.</div>`;
    h+=`<div class="panel"><h2>Structure & sources</h2>${structTabs}${S.structTab==='sources'?sourcesBody:readBody}
    <div class="actions"><span class="lk" onclick="goStep(1)">← Back</span>${S.parsed?`<button class="btn primary" onclick="goStep(3)">Fill the gaps →</button>`:''}</div></div>`;}

  else if(s===3){const gaps=gapAreas();h+=`<div class="panel"><h2>Fill what no system can tell you</h2><p class="lede">Some answers only the client has — the soft-skill questions that get skipped. Instead of chasing them, the coworker drafts an interview, you approve it, and a secure link goes to the client. Answers flow straight into the register.</p>
    ${gaps.map(a=>{const st=S.interview[a.sec]||'none';return `<div class="iv-card"><div class="ivt"><span class="s">${a.sec}</span>${st==='none'?'':`<span class="iv-state ${st}">${st==='draft'?'Draft ready':st==='sent'?'Sent to client':'Answers received'}</span>`}</div>
      <div style="font-size:12.5px;color:var(--text-2);margin-bottom:${st==='none'?'12':'10'}px">${a.plain}</div>
      ${st!=='none'?`<div class="iv-q"><span class="who">Coworker asks the client</span>${a.sec==='Awareness training'?'When did staff last complete phishing-awareness training, and roughly what share finished it?':'Of the risks we flagged last quarter, which have you decided to fund, defer, or accept — and who signed off?'}</div>${st==='back'?`<div class="iv-q" style="background:var(--green-soft);border-color:#cdeeda"><span class="who">Client replied</span>${a.sec==='Awareness training'?'Training ran in June, about 80% completed. New starters not yet enrolled.':'Funding the MFA rollout; deferring the IR plan to next quarter — signed by the ops director.'}</div>`:''}`:''}
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${st==='none'?`<button class="btn" onclick="iv('${a.sec.replace(/'/g,"\\'")}','draft')">Draft an interview</button>`:''}${st==='draft'?`<button class="btn primary" onclick="iv('${a.sec.replace(/'/g,"\\'")}','sent')">Approve &amp; send secure link</button> <span class="lk" onclick="iv('${a.sec.replace(/'/g,"\\'")}','none')">edit</span>`:''}${st==='sent'?`<button class="btn" onclick="iv('${a.sec.replace(/'/g,"\\'")}','back')">Simulate client reply</button>`:''}${st==='back'?`<span style="font-size:12px;color:var(--green)">✓ Folded into the register as an Estimated finding — a human still vouches before it goes client-facing.</span>`:''}</div></div>`;}).join('')}
    <div style="font-size:12px;color:var(--text-2);margin-top:6px">You never have to send an interview — you can fill these yourself. The point is the coworker does the chasing, not you.</div>
    <div class="actions"><span class="lk" onclick="goStep(2)">← Back</span><button class="btn primary" onclick="goStep(4)">Decide how much it does →</button></div></div>`;}

  else if(s===4){const does=countDoes(),back=AREAS.length-does;h+=`<div class="panel"><h2>How much should it do on day one?</h2><p class="lede">You don’t hand over the whole register to trust it. It drafts only what it can stand behind and hands you the rest, graded by ${T('tier','confidence')}. Start small; give it more as it earns it.</p>
    <div class="cards" style="margin-bottom:16px"><div class="card ${S.preset==='sure'?'picked':''}" onclick="setPreset('sure')"><div class="rec">START HERE</div><div class="nm">Only what it’s sure of</div><div class="d">Drafts measured/benchmarked; hands you the guesses.</div></div><div class="card ${S.preset==='whole'?'picked':''}" onclick="setPreset('whole')"><div class="nm">Draft the whole register</div><div class="d">Attempts everything; flags low-confidence for you.</div></div></div>
    ${AREAS.map(a=>{const d=autoDoes(a);return `<div class="gate-row ${d?'does':'you'}"><div class="tgl ${d?'on':''}" onclick="flip('${a.sec.replace(/'/g,"\\'")}')"><span class="k"></span></div><span class="tier ${a.tier}">${({measured:'Measured',benchmarked:'Benchmarked',estimated:'Estimated',unverified:'Your judgment'})[a.tier]}</span><span class="s">${a.sec}</span><span class="a">${d?'Coworker drafts':'You do this'}</span></div>`;}).join('')}
    <div class="callout">Day one: it drafts <b>${does} of ${AREAS.length}</b> and hands you <b>${AREAS.length-does}</b>. ${T('held','Unverified')} never reaches a client until a human vouches.</div>
    <div class="handhold"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M4 20v-1a5 5 0 015-5"/><path d="M15 11l2 2 4-4"/><path d="M14 20v-1a4 4 0 013-3.9"/></svg></div>
      <div><h4>Add the Advisor for what it hands back <span class="prem">Premium</span></h4><p>The findings it hands you are the judgment calls. The Advisor turns a raw finding into plain talking points and a recommended next step — so the person presenting doesn’t have to be the person who understands the vulnerability. Built for the account lead, not just the engineer.</p>
      <label class="chk" style="margin-bottom:0"><input type="checkbox" ${S.handhold?'checked':''} onchange="S.handhold=this.checked;render()"><span>Include the Advisor to walk me through the handed-back findings${back?` (${back} this cycle)`:''}.</span></label></div></div>
    <div class="actions"><span class="lk" onclick="goStep(3)">← Back</span><button class="btn primary" onclick="goStep(5)">See the register →</button></div></div>`;}

  else if(s===5){h+=`<div class="panel"><h2>Here’s the register I’d build</h2><p class="lede">A draft ${T('register')}. Immutable once you activate it, so read it now. This is the durable artifact — one living register per client, graded, tracked, evidence kept.</p>
    ${posture()}
    <div class="viewtabs"><button class="${S.regView==='register'?'on':''}" onclick="setView('register')">Register</button><button class="${S.regView==='system'?'on':''}" onclick="setView('system')">System map</button><button class="${S.regView==='time'?'on':''}" onclick="setView('time')">Over time</button></div>
    ${S.regView==='register'?regTable():S.regView==='system'?systemMap():overTime()}
    <div class="callout" style="margin-top:18px">Powered by <b>${S.ai==='nzo'?'N-zo':'Claude Code'}</b>${S.handhold?' + Advisor':''} · built from <b>${shape()?shape().name:'—'}</b>${S.extraFiles.length?` + ${S.extraFiles.length} context file${S.extraFiles.length>1?'s':''}`:''} · drafts <b>${countDoes()} of ${AREAS.length}</b> areas day one. Trigger: on-demand (not calendar-fired). Sign-off required before client-facing.</div>
    <div class="actions"><span class="lk" onclick="goStep(4)">← Back</span><button class="btn primary" onclick="goStep(6)">Review and activate →</button></div></div>`;}

  else if(s===6){const a=S.ack,all=a.read&&a.judgment&&a.record;h+=`<div class="panel"><h2>You activate it, not me</h2><p class="lede">A coworker that switches itself on is one nobody agreed to. Three confirmations — none a formality.</p>
    <div class="gate-box"><h3>Before this goes live</h3>
    <label class="chk"><input type="checkbox" ${a.read?'checked':''} onchange="ack('read',this.checked)"><span>I’ve read the draft register and it matches how we run an EBR.</span></label>
    <label class="chk"><input type="checkbox" ${a.judgment?'checked':''} onchange="ack('judgment',this.checked)"><span>I understand it learned our <b>structure</b>, not our <b>judgment</b> — I’ll correct grades, especially early.</span></label>
    <label class="chk"><input type="checkbox" ${a.record?'checked':''} onchange="ack('record',this.checked)"><span>This becomes our <b>system of record</b>; a <b>named person</b> signs off before anything reaches a client.</span></label>
    <button class="btn primary" ${all?'':'disabled'} onclick="activate()">Activate this coworker</button></div>
    <div class="warncall"><b>Still unresolved:</b> whether the sign-off owner is the technical practitioner (David) or the account lead (Vanessa). This screen asks you to name someone; the product doesn’t yet enforce who.</div>
    <div class="actions"><span class="lk" onclick="goStep(5)">← Back</span></div></div>`;}
  el('stage').innerHTML=h;
  if(s===2 && !S.parsed) runParse();
}
function renderChips(){return S.extraFiles.map((f,i)=>`<span class="file-chip">${f.name} <span class="kind">${f.kind}</span> <span class="x" onclick="rmFile(${i})">×</span></span>`).join('')||'<span style="font-size:12px;color:var(--text-2)">None yet.</span>';}
function guessKind(n){n=n.toLowerCase();if(/transcript|call|meeting|\.vtt/.test(n))return 'transcript';if(/risk|register/.test(n))return 'risk register';if(/note/.test(n))return 'notes';if(/\.xlsx|\.csv/.test(n))return 'spreadsheet';return 'context';}
function addFile(){const v=(S.addDraft||'').trim();if(!v)return;S.extraFiles.push({name:v,kind:guessKind(v)});S.addDraft='';render();}
function rmFile(i){S.extraFiles.splice(i,1);render();}
function iv(sec,st){S.interview[sec]=st;render();}
async function runParse(){const sh=shape();S.parseLog=[];const w=ms=>new Promise(r=>setTimeout(r,ms));const plog=(cls,text)=>{S.parseLog.push({cls,text,t:String(S.parseLog.length).padStart(2,'0')});const c=el('pc');if(c){c.innerHTML=S.parseLog.map(l=>`<div class="cl ${l.cls}"><span class="ts">${l.t}</span><span>${l.text}</span></div>`).join('');c.scrollTop=c.scrollHeight;}};
  if(sh.template){plog('dim','loading Stefanie EBR framework…');await w(500);plog('cw',`powered by ${S.ai==='nzo'?'N-zo':'Claude Code'}`);await w(300);for(const t of sh.tabs){plog('ok','  '+t);await w(120);}await w(250);plog('ok','risk register — built into the framework');await w(300);plog('dim','— template loaded. every finding is yours to fill. —');S.parsed=true;render();return;}
  plog('dim',`opening ${sh.name.toLowerCase()}…`);await w(500);plog('cw',`powered by ${S.ai==='nzo'?'N-zo':'Claude Code'}`);await w(300);plog('',`detected ${sh.tabs.length} section(s)`);await w(350);for(const t of sh.tabs){plog(sh.quality==='low'?'err':'ok','  '+t);await w(140);}
  if(S.extraFiles.length){await w(300);for(const f of S.extraFiles){plog('cw',`  + ${f.name} (${f.kind}) — read for context`);await w(150);}}
  await w(300);if(sh.quality==='high'){plog('ok','grading column found — RAG scale, consistent');await w(260);plog('ok','carry-forward tab found — becomes the register history');await w(260);plog('warn','no rationale column — grades recorded, reasons are not');}else if(sh.quality==='medium'){plog('warn','no grading column — grades implied by slide colour');await w(260);plog('warn','no carry-forward — cannot tell what was open last quarter');}else{plog('err','no repeating structure between quarters');await w(260);plog('err','cannot draft a register from this without guessing');}
  await w(350);plog('dim','— structure read. judgment not read, and not readable. —');S.parsed=true;render();}

/* ---- Capstone diff screen — restored from build-ebr.html's final step (2026-09-01 rebuild) ----
   Sits between Activate (3-checkbox gate) and the Dashboard, per the rebuild brief's Section A
   step 7. Two columns, field-level mapping traced to what the reconciled Setup screens actually
   produce (not invented): shape()/S.extraFiles from "Your report", gapAreas()/S.interview from
   "Fill the gaps", countDoes()/AREAS.length/S.handhold from "How much it does", S.ack from
   "Activate". Teach-back ("correct one grade") already lives on the Dashboard's Overview tab in
   this file — not duplicated here, per the brief's "don't expand Teach-back" instruction. */
function renderCapstone(){
  const sh=shape(), does=countDoes(), total=AREAS.length, back=total-does;
  const gapsClosed=Object.values(S.interview).filter(v=>v==='back').length;
  const brought=[
    `${sh?sh.name:'A report'} rebuilt from scratch each cycle${S.extraFiles.length?`, plus ${S.extraFiles.length} file${S.extraFiles.length>1?'s':''} you gathered by hand`:''}`,
    sh&&sh.quality==='low'?'No repeating structure between quarters — it lived in your head':'Grades kept from memory and spot-checks, not a dated record',
    `${gapAreas().length} area${gapAreas().length===1?'':'s'} with no connector at all — chased by hand or guessed`,
    'No record of what a client declined, and no evidence trail if anyone asks "prove it"',
  ];
  const now=[
    `A living ${T('register')} — findings owned, dated, tracked across cycles`,
    `<b>${does} of ${total}</b> areas drafted automatically — only what it can stand behind`,
    `<b>${back}</b> handed to you${S.handhold?', with the Advisor to translate them':''}`,
    `${gapsClosed} gap${gapsClosed===1?'':'s'} closed by asking the client directly — a secure link, not you chasing them`,
    'Every finding traces to kept evidence — signed off by a named human before anything reaches a client',
  ];
  el('head').innerHTML=`<div class="crumb"><span class="lk" onclick="setNav('coworkers')">Coworkers</span><span class="sep">›</span>EBR Coworker<span class="sep">›</span>Fenwick Logistics</div>
    <div class="title-row"><h1>EBR Coworker — Fenwick Logistics</h1></div>
    <div class="chips"><span class="chip active"><span class="d"></span>Active</span><span class="chip mode">${T('assisted','Assisted')}</span></div>
    <div style="height:8px"></div>`;
  el('stage').innerHTML=`<div class="panel">
    <div class="chip active" style="display:inline-flex;margin-bottom:16px"><span class="d"></span>ACTIVE · version 1 · immutable</div>
    <h2>Built. Now teach it your judgment.</h2>
    <p class="lede">Left: the report you brought. Right: your living register. It got the structure right — teach it a grade on the dashboard and next cycle it proposes yours, not its own.</p>
    <div class="cards">
      <div class="card"><div class="nm">What you brought</div><ul style="margin:8px 0 0 18px;padding:0;font-size:12.5px;color:var(--text-2);line-height:1.7">${brought.map(b=>`<li>${b}</li>`).join('')}</ul></div>
      <div class="card picked"><div class="nm">What you have now</div><ul style="margin:8px 0 0 18px;padding:0;font-size:12.5px;color:var(--ink);line-height:1.7">${now.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    </div>
    <div class="actions"><button class="btn primary" onclick="goToDashboard()">Go to your dashboard →</button></div>
  </div>`;
}

/* ---- Dashboard ---- */
function renderDashboard(){
  ebrHead();
  if(S.reportOpen){ el('stage').innerHTML=renderReport(); return; }
  if(S.tab==='Overview') el('stage').innerHTML=overview();
  else if(S.tab==='Runs') el('stage').innerHTML=runsTab();
  else if(S.tab==='Audit') el('stage').innerHTML=`<div class="dcard"><h2>Audit trail</h2><div class="sub">Every change is a git commit — the dated evidence chain</div><div class="stat"><span>Q3 2026 register committed · today 09:12</span><span class="v muted">by N-zo, approved Vanessa</span></div><div class="stat"><span>Grade corrected: phishing kept Amber</span><span class="v muted">David · teach-back</span></div><div class="stat"><span>Q2 2026 cycle committed · 14 May</span><span class="v muted">by N-zo, approved Vanessa</span></div><div class="narr" style="margin-top:14px">"Prove it to opposing counsel" — the register’s git history is the attestation trail. Nothing is deleted; declined risks stay on record.</div></div>`;
  else el('stage').innerHTML=`<div class="empty"><b>${S.tab}</b><br>Real HARNESS tab, in the shell for fidelity. The EBR dashboard lives on <span style="color:var(--apex);cursor:pointer" onclick="setTab('Overview')">Overview</span>.</div>`;
}
function overview(){
  const r=FINDINGS.filter(f=>f.grade==='red').length,a=FINDINGS.filter(f=>f.grade==='amber').length,held=FINDINGS.filter(f=>f.grade==='held').length;
  const seg=(c,n)=>n?`<div class="seg ${c}" style="flex:${n}"></div>`:'';
  return `<div class="dash">
    <div class="dcard span2"><h2>Fenwick Logistics — risk register</h2><div class="sub">The living deliverable · Q3 2026 · graded against NCSC 10 / Cyber Essentials · git-tracked</div>
      <div class="spectrum">${seg('red',r)}${seg('amber',a)}${seg('held',held)}</div>
      <div class="keys"><div class="key red"><span class="num">${r}</span><span class="lab"><b>Red</b>act now</span></div><div class="key amber"><span class="num">${a}</span><span class="lab"><b>Amber</b>watch</span></div><div class="key green"><span class="num">3</span><span class="lab"><b>Improving</b>vs last cycle</span></div><div class="key held"><span class="num">${held}</span><span class="lab"><b>Held</b>needs a human</span></div></div>
      <div class="viewtabs"><button class="${S.regView==='register'?'on':''}" onclick="setView('register')">Register</button><button class="${S.regView==='system'?'on':''}" onclick="setView('system')">System map</button><button class="${S.regView==='time'?'on':''}" onclick="setView('time')">Over time</button></div>
      ${S.regView==='register'?regTable():S.regView==='system'?systemMap():overTime()}</div>
    <div class="dcard"><h2>Value</h2><div class="sub">Written to the Value Ledger each run</div>
      <div class="stat"><span>Time saved this cycle</span><span class="v">~3.5 hrs</span></div><div class="stat"><span>Findings drafted</span><span class="v">${countDoesLabel()}</span></div><div class="stat"><span>Handed to a human</span><span class="v muted">1 (held)</span></div><div class="stat"><span>Runs to date</span><span class="v muted">${S.runs}</span></div></div>
    <div class="dcard"><h2>Fed by coworkers</h2><div class="sub">Build these and the register gets richer</div>${FEEDS.map(f=>`<div class="feed" onclick="setNav('coworkers')" style="cursor:pointer"><span class="dot"></span><span><span class="nm">${f.cw}</span><br><span class="to">→ ${f.area}</span></span></div>`).join('')}</div>
    <div class="dcard span2"><div class="signoff"><b>Sign-off required before client send.</b> One red finding is included, so this cycle needs a named human — Vanessa (account lead) is on record for Fenwick. ${T('held','Unverified')} findings are hard-blocked regardless. <b>Nothing has been sent.</b></div></div>
    <div class="dcard span2"><h2>Teach it your judgment</h2><div class="sub">Correct a grade and the coworker keeps your reasoning — next cycle it proposes yours, not the default. This is how it gets better at the thing that matters.</div>
      <div class="tb-box"><div class="prop">It graded <b>“Phishing click-rate 22%”</b> <span class="g" style="background:var(--amber);display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle"></span> <b>Amber</b> (above the 15% benchmark). Your call — this client just onboarded 40 new starters.</div>
        <div class="tb-grades"><div class="tb-grade ${S.tbGrade==='red'?'picked':''}" onclick="setTb('red')"><span class="g" style="background:var(--red)"></span>Red</div><div class="tb-grade ${S.tbGrade==='amber'?'picked':''}" onclick="setTb('amber')"><span class="g" style="background:var(--amber)"></span>Amber (keep)</div><div class="tb-grade ${S.tbGrade==='green'?'picked':''}" onclick="setTb('green')"><span class="g" style="background:var(--green)"></span>Green</div></div>
        <textarea class="tb-note" placeholder="Why? e.g. 'New-starter cohort skews this — trending down, on track.' The coworker keeps your reasoning, not just the grade." oninput="S.tbNote=this.value">${S.tbNote}</textarea>
        ${S.tbSaved?`<div class="tb-saved"><b>Saved to your judgment.</b> Next cycle the coworker proposes <b>${S.tbGrade?S.tbGrade[0].toUpperCase()+S.tbGrade.slice(1):'your grade'}</b> for this pattern and shows your reasoning alongside it — written to learned-judgment, committed to git.</div>`:`<button class="btn primary" ${S.tbGrade?'':'disabled'} onclick="saveTb()">Save this correction</button>`}
      </div></div>
  </div>`;
}
function countDoesLabel(){return '5 of 6';}
function regTable(){
  const order={red:0,amber:1,green:2,held:3};
  return `<div class="reg">${[...FINDINGS].sort((x,y)=>order[x.grade]-order[y.grade]).map(f=>`
    <div class="row ${f.grade}" onclick="toggleFinding('${f.id}')"><div></div>
      <div><div class="fnd">${f.finding}</div><div class="mt">${f.area}<span class="d">·</span>${f.owner}<span class="d">·</span>${f.status}</div></div>
      <div><span class="tier ${f.tier}">${f.tier}</span></div>
      <div class="c3">${spark(f)}<div class="ev">${f.ev}</div></div>
    </div>${S.openFinding===f.id?`<div class="fdetail"><b>What it means:</b> ${f.why}<br><b>Owner:</b> ${f.owner} · <b>Confidence:</b> ${f.tier} · <b>Evidence:</b> ${f.ev}${f.grade==='held'?' — <b style="color:var(--held)">held from client view until vouched</b>':''}</div>`:''}`).join('')}</div>
    <div class="held-foot"><span class="dot"></span><span><b style="color:var(--held)">Held.</b> The IR-plan gap is inferred, not measured — kept internally (absence is a finding) but hard-blocked from the client view. Click any row for detail.</span></div>`;
}
function spark(f){const pts=f.history.filter(v=>v!==null);if(pts.length<2)return `<span class="ev" style="font-style:normal">new</span>`;const w=84,h=26,min=Math.min(...pts),max=Math.max(...pts),rng=(max-min)||1,step=w/(pts.length-1),nm=v=>h-4-((v-min)/rng)*(h-8);const d=pts.map((v,i)=>`${i?'L':'M'}${(i*step).toFixed(1)},${nm(v).toFixed(1)}`).join(' ');const last=pts[pts.length-1],first=pts[0],better=f.id==='f2'?false:last<first,col=better?GC.green:GC.amber,g='g'+f.id;const area=`M0,${h} L`+pts.map((v,i)=>`${(i*step).toFixed(1)},${nm(v).toFixed(1)}`).join(' L')+` L${w},${h} Z`;return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${g}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".2"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${g})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${((pts.length-1)*step).toFixed(1)}" cy="${nm(last).toFixed(1)}" r="2.6" fill="${col}"/></svg>`;}
function systemMap(){const W=840,H=490,cx=W/2,cy=H/2;const areas=[...new Set(FINDINGS.map(f=>f.area))];FEEDS.forEach(fd=>{if(!areas.includes(fd.area))areas.push(fd.area);});const R=148,Rl=228,Rc=254,n=areas.length,ap={};areas.forEach((a,i)=>{const g=(-90+i*360/n)*Math.PI/180;ap[a]={x:cx+R*Math.cos(g),y:cy+R*Math.sin(g),g};});const cv=(x1,y1,x2,y2)=>{const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1;return `M${x1},${y1} Q${mx-dy*0.12},${my+dx*0.12} ${x2},${y2}`;};let links=areas.map(a=>`<path d="${cv(cx,cy,ap[a].x,ap[a].y)}" fill="none" stroke="#e2e2e8" stroke-width="1.2"/>`).join('');let leaves=FINDINGS.map((f,i)=>{const p=ap[f.area],g=p.g+0.3*((i%2)?1:-1),lx=cx+Rl*Math.cos(g),ly=cy+Rl*Math.sin(g),hd=f.grade==='held';return `<path d="${cv(p.x,p.y,lx,ly)}" stroke="${hd?'#c9c9d0':GC[f.grade]}" stroke-width="1.3" ${hd?'stroke-dasharray="3 3"':''} fill="none" opacity=".6"/><circle cx="${lx}" cy="${ly}" r="6.5" fill="${hd?'#fff':GC[f.grade]}" stroke="${hd?'#8a8a93':'#fff'}" stroke-width="${hd?2:1.2}"/><text x="${lx}" y="${ly+(Math.sin(g)>0?18:-11)}" text-anchor="middle" font-family="Inter" font-size="9" fill="#6b6c72">${f.finding.length>22?f.finding.slice(0,20)+'…':f.finding}</text>`;}).join('');let an=areas.map(a=>{const p=ap[a];return `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#fff" stroke="#8500cc" stroke-width="1.6"/><text x="${p.x}" y="${p.y-11}" text-anchor="middle" font-family="Manrope" font-size="10.5" font-weight="600" fill="#18171c">${a}</text>`;}).join('');let fd=FEEDS.map(f=>{const p=ap[f.area],g=p.g,fx=cx+Rc*Math.cos(g),fy=cy+Rc*Math.sin(g);return `<path d="${cv(fx,fy,p.x,p.y)}" stroke="#0a95c4" stroke-width="1.5" fill="none" opacity=".85" marker-end="url(#ar)"/><rect x="${fx-54}" y="${fy-11}" width="108" height="22" rx="11" fill="#e7f6fb" stroke="#0a95c4"/><text x="${fx}" y="${fy+4}" text-anchor="middle" font-family="Inter" font-size="9" font-weight="600" fill="#086a8c">${f.cw}</text>`;}).join('');return `<div class="svg-wrap" style="margin-top:6px"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0a95c4"/></marker></defs>${links}${fd}${leaves}${an}<circle cx="${cx}" cy="${cy}" r="35" fill="#17131f"/><text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="Manrope" font-size="12" font-weight="700" fill="#fff">Fenwick</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-family="Inter" font-size="9" fill="#c3bdd0">Customer</text></svg></div><div class="narr">Cyan arrows are other coworkers feeding a section. Build them and the register fills itself in.</div>`;}
function overTime(){const tr=FINDINGS.filter(f=>f.history.filter(v=>v!==null).length>=2);return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:6px">${tr.map(f=>{const pts=f.history.map((v,i)=>({v,i})).filter(p=>p.v!==null),w=188,h=52,min=Math.min(...pts.map(p=>p.v)),max=Math.max(...pts.map(p=>p.v)),rng=(max-min)||1,step=w/(f.history.length-1),nm=v=>h-8-((v-min)/rng)*(h-16);const d=pts.map((p,i)=>`${i?'L':'M'}${(p.i*step).toFixed(1)},${nm(p.v).toFixed(1)}`).join(' '),first=pts[0].v,last=pts[pts.length-1].v,better=f.id==='f2'?false:last<first,col=better?GC.green:GC.amber;return `<div style="border:1px solid var(--line);border-radius:var(--r);padding:14px 16px"><div style="font-family:var(--font-h);font-weight:600;font-size:13px;color:var(--ink);margin-bottom:2px">${f.finding}</div><div style="font-family:var(--font-m);font-size:11px;color:${col};margin-bottom:8px">${first}→${last} · ${better?'↓ improving':(f.id==='f2'?'↑ slipped':'—')}</div><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="max-width:100%"><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${(p.i*step).toFixed(1)}" cy="${nm(p.v).toFixed(1)}" r="2.4" fill="${col}"/>`).join('')}</svg></div>`;}).join('')}</div><div class="narr">The renewal story — same findings across five cycles. New findings carry no history, shown honestly as new.</div>`;}
function runsTab(){return `<div class="dcard"><h2>Run history</h2><div class="sub">Each run writes to the Value Ledger and appends to the register</div>
  <div class="stat"><span><b style="color:var(--ink)">Q3 2026 cycle</b> · today 09:12</span><span class="v" style="color:var(--green)">Completed · 5 findings</span></div>
  <div class="stat"><span>Q2 2026 cycle · 14 May</span><span class="v muted">Completed · 4 findings</span></div>
  <div class="stat"><span>Q1 2026 cycle · 10 Feb</span><span class="v muted">Completed · 4 findings</span></div>
  <div class="narr" style="margin-top:14px">Value → <b>Time saved: ~11 hrs across 3 cycles</b>. Every run is a commit; git history is the audit trail.</div>
  <div class="actions"><button class="btn primary" onclick="runCycle()">Run EBR cycle now</button></div></div>`;}

/* interactions */
/* ---- client report + exports ---- */
/* REC{} map retired 2026-09-01 — its copy now lives as .ask on each FINDINGS entry (data reconciliation, see AREAS/FINDINGS comment above). */
function clientFindings(){return FINDINGS.filter(f=>f.grade!=='held');}
function plainNum(s){return s.replace('22%','around one in five').replace('82%','most machines').replace('41 days','over a month').replace('6 endpoints','six machines').replace('3 admin accounts','several admin accounts');}
function renderReport(){
  return `<div class="report">
    <div class="exportbar"><span class="lk" style="margin-right:auto;color:var(--text-2)" onclick="closeReport()">← Back to dashboard</span>
      <span class="lbl">Export:</span><button class="btn" onclick="exportCSV()">Excel</button><button class="btn" onclick="exportPptx()">PowerPoint</button><button class="btn" onclick="exportDoc()">Word</button><button class="btn" onclick="exportPDF()">PDF</button></div>
    <div class="rep-cover"><div class="ey">EXECUTIVE BUSINESS REVIEW · Q3 2026</div><h2>Fenwick Logistics</h2><div class="meta">Prepared by Bracken IT Group · presented by Vanessa · reviewed against NCSC 10 / Cyber Essentials</div></div>
    <div class="rep-sec"><h3>A note from Vanessa</h3><p class="rep-note">Your security posture improved on every measure we track this quarter — but two items need a decision from you now. Below is where you stand, in plain terms, and what we recommend. The full detail behind every point is on file if you want it.</p></div>
    <div class="rep-sec"><h3>What we found</h3>${clientFindings().map(f=>`<div class="rep-find"><span class="g" style="background:${GC[f.grade]}"></span><div><div class="ft">${plainNum(f.finding)}</div><div class="fm">${f.why}</div><div class="fr">Our recommendation — ${f.ask}</div></div></div>`).join('')}</div>
    <div class="rep-sec"><h3>What’s improved since last review</h3><p class="rep-note">Admin accounts without protection are down from eight to three. The share of machines kept fully up to date has risen steadily all year. Staff clicking a test phishing email is down from a third to around one in five. The direction is right on every front — this is the story worth telling at renewal.</p></div>
    <div class="rep-sec"><h3>Decisions for you</h3>
      <div class="decision"><span>Fund MFA enforcement on the remaining admin accounts</span><span class="dv" style="color:var(--red)">Recommended now</span></div>
      <div class="decision"><span>Approve remediation of the exposed machines</span><span class="dv" style="color:var(--red)">Recommended now</span></div>
      <div class="decision"><span>Put a documented incident-response plan in place</span><span class="dv" style="color:var(--amber)">For discussion</span></div>
    </div>
    <div class="rep-sec"><h3>Next 12 months</h3><p class="rep-note" style="color:var(--text-2)">[ To be completed with you at the review — where you are, where we’ll take you, and what it costs. This section is Vanessa’s to own. ]</p></div>
    <div style="font-family:var(--font-m);font-size:10.5px;color:var(--text-2);border-top:1px solid var(--line);padding-top:12px;line-height:1.6">Seed data — fictional. Held / unverified findings are excluded from this client view (the full internal register is on file). Numbers are stated in plain language here; the raw figures live in the register. Exports write back to your own workbook or deck — your columns and order preserved.</div>
  </div>`;
}
function csvEsc(s){return '"'+String(s).replace(/"/g,'""')+'"';}
function download(name,mime,content){const b=new Blob([content],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);}
function exportCSV(){const rows=[['Grade','Finding','What it means for the business','Our recommendation','Owner','Confidence']].concat(clientFindings().map(f=>[f.grade,f.finding,f.why,f.ask,f.owner,f.tier]));download('Fenwick-EBR-Q3-2026.csv','text/csv',rows.map(r=>r.map(csvEsc).join(',')).join('\n'));toast('Exported to Excel — written back to your workbook, columns preserved');}
function exportDoc(){const html='<html><head><meta charset="utf-8"><title>Fenwick EBR</title></head><body style="font-family:Calibri,Arial,sans-serif;max-width:640px"><h1>Fenwick Logistics — Executive Business Review, Q3 2026</h1><p><i>Prepared by Bracken IT Group · presented by Vanessa</i></p><h2>What we found</h2>'+clientFindings().map(f=>`<h3>${plainNum(f.finding)}</h3><p>${f.why}</p><p><b>Our recommendation:</b> ${f.ask}</p>`).join('')+'</body></html>';download('Fenwick-EBR-Q3-2026.doc','application/msword',html);toast('Exported to Word');}
function exportPDF(){toast('Opening print — choose “Save as PDF”');setTimeout(()=>window.print(),350);}
function exportPptx(){toast('PowerPoint export is a mock here — the real build writes a branded deck to your template');}
function openReport(){S.reportOpen=true;render();window.scrollTo(0,0);}
function closeReport(){S.reportOpen=false;render();}
function pick(id){S.shape=id;S.parsed=false;S.parseLog=[];render();}
function setTb(g){S.tbGrade=g;render();}
function saveTb(){S.tbSaved=true;render();}
function setAI(a){S.ai=a;render();}
function setStructTab(t){S.structTab=t;render();}
function setPreset(p){S.preset=p;S.overrides={};render();}
function flip(sec){const cur=autoDoes(AREAS.find(x=>x.sec===sec));S.overrides[sec]=!cur;render();}
function tech(sec){S.openTech[sec]=!S.openTech[sec];render();}
function ack(k,v){S.ack[k]=v;render();}
function goStep(n){S.step=n;render();window.scrollTo(0,0);}
function activate(){S.activated=true;S.capstoneSeen=false;render();window.scrollTo(0,0);}
function goToDashboard(){S.capstoneSeen=true;S.tab='Overview';render();window.scrollTo(0,0);toast('Coworker activated — welcome to your live register');}
function setTab(t){S.tab=t;S.openFinding=null;render();}
function setView(v){S.regView=v;render();}
function toggleFinding(id){S.openFinding=S.openFinding===id?null:id;render();}
function runCycle(){S.runs++;toast('EBR cycle complete — register updated, committed to git');render();}
render();
</script>

const CW_WALL_LABEL = { wrongdata:'Data problem', manual:'Manual pull', nomcp:'No connector', makeit:"Doesn't exist yet" };

function cwRoutesFor(key){ return CW_ROUTES[key] || []; }
function cwIsOpen(r){ return !cwResolved[r.id]; }
function cwOpenCount(key){ return cwRoutesFor(key).filter(cwIsOpen).length; }
function cwOpenTotal(){ return DR_TABS.reduce((n,t)=>n+cwOpenCount(t.key),0); }

function cwCsv(name, rows){
  const csv = rows.map(r=>r.map(f=>{const s=String(f==null?'':f);return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function cwFindRoute(id){ for (const k in CW_ROUTES){ const hit = CW_ROUTES[k].find(r=>r.id===id); if(hit) return hit; } return null; }
function cwDownload(id){ const r=cwFindRoute(id); if(r&&r.dl) cwCsv(r.dl.name, r.dl.rows); }
function cwRequest(id){ cwRequested[id]=true; drSetTab(drTab); }
function cwMake(id){ cwMade[id]=true; drSetTab(drTab); }
function cwReduce(id){ cwResolved[id]='reduced'; drSetTab(drTab); }
function cwAtSource(id){ cwResolved[id]='atsource'; drSetTab(drTab); }
function cwCapture(id){
  const el=document.getElementById('cw-cap-'+id);
  const v=(el&&el.value.trim())||'';
  if(!v){ if(el){ el.style.borderColor='var(--br-color-state-danger)'; el.placeholder='Nothing recorded — a blank stays blank rather than being guessed.'; } return; }
  cwResolved[id]=v; drSetTab(drTab);
}
function cwAddTool(){ const el=document.getElementById('cw-newtool'); const v=(el&&el.value.trim())||''; if(!v) return; if(!cwExtraTools.includes(v)) cwExtraTools.push(v); drSetTab(drTab); }

function cwRouteHtml(r){
  const resolved = cwResolved[r.id];
  const label = CW_WALL_LABEL[r.wall];
  if (resolved){
    const txt = resolved==='reduced' ? r.reduced : resolved==='atsource' ? (r.atSource + ' — re-pull next cycle picks it up') : resolved;
    return `<div class="cw-route resolved"><div class="cw-route-head"><span class="cw-wall done">✓ ${label} — settled</span><span class="cw-field">${r.field}</span></div><p class="cw-what"><strong>Recorded:</strong> ${txt}</p></div>`;
  }
  const steps = r.steps ? `<ol class="cw-steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>` : '';
  const made = r.make ? (cwMade[r.id]
      ? `<p class="cw-made">✓ ${r.made}</p><p class="cw-note"><strong>Still open for this cycle:</strong> ${r.makeDesc}</p>`
      : `<div class="cw-actions"><button class="btn primary" onclick="cwMake('${r.id}')">${r.make}</button></div><p class="cw-note">${r.makeDesc}</p>`) : '';
  const req = r.request ? (cwRequested[r.id]
      ? `<p class="cw-made" style="color:var(--br-color-brand-primary);">✓ ${r.requested}</p>`
      : `<div class="cw-actions"><button class="btn ghost" onclick="cwRequest('${r.id}')">${r.request}</button></div>`) : '';
  const dl = r.dl ? `<div class="cw-actions"><button class="btn ghost" onclick="cwDownload('${r.id}')">⬇ ${r.dl.label}</button></div><p class="cw-note">Pre-filled with what we already hold, so nobody retypes what the system knows.</p>` : '';
  const reduce = r.reduce ? `<div class="cw-actions"><button class="btn primary" onclick="cwReduce('${r.id}')">${r.reduce}</button><button class="btn ghost" onclick="cwAtSource('${r.id}')">${r.atSource}</button></div><p class="cw-note">The number reads as filled right now. It should not count as finalized until this is settled.</p>` : '';
  const cap = r.capture ? `<div class="cw-capture"><label class="visually-hidden" for="cw-cap-${r.id}">Record</label><input type="text" id="cw-cap-${r.id}" placeholder="${r.capture}" /><button class="btn primary" onclick="cwCapture('${r.id}')">Record it</button></div>` : '';
  return `<div class="cw-route wall-${r.wall}"><div class="cw-route-head"><span class="cw-wall ${r.wall}">${label}</span><span class="cw-field">${r.field}</span></div><p class="cw-src">Source: ${r.src}</p><p class="cw-what">${r.what}</p>${steps}${reduce}${made}${req}${dl}${cap}</div>`;
}

function cwToolsPanel(){
  if (drCycle !== 1) return '';
  return `<div class="content-card cw-panel" style="margin-top:12px;"><h3>Tools we couldn't reach</h3><p class="oc-lede">Onboarding matched the tools it recognised. Anything it has never heard of is a hole in the deck it cannot see — so naming it changes what this draft is allowed to claim.</p>${CW_TOOLS_MISSING.map(t=>`<p class="cw-what"><strong>${t}</strong> — no connector exists.</p>`).join('')}${cwExtraTools.map(t=>`<p class="cw-what" style="color:var(--br-color-state-danger);"><strong>${t}</strong> — you named it, no connector exists.</p>`).join('')}${(!CW_TOOLS_MISSING.length && !cwExtraTools.length)?`<p class="cw-what">Everything onboarding recognised is reachable this cycle. Warranty/EOS is now a solved N-central asset-export field, not a gap.</p>`:''}<div class="cw-capture"><label class="visually-hidden" for="cw-newtool">Name a tool we missed</label><input type="text" id="cw-newtool" placeholder="Something we missed? e.g. Cloudflare" /><button class="btn ghost" onclick="cwAddTool()">Add it</button></div>${cwExtraTools.length?`<div class="gap-banner" style="margin-top:10px;"><span class="gb-icon">⚠</span><span class="gb-text"><strong>${cwExtraTools.join(', ')} in play and unreadable</strong> · this cycle's risk read is incomplete, not clean</span></div>`:''}<div class="cw-actions" style="margin-top:12px;"><button class="btn primary" onclick="cwExportWorkbook()">⬇ Export the filled workbook (.csv)</button></div><p class="cw-note">${cwOpenTotal()?`${cwOpenTotal()} unsettled item${cwOpenTotal()>1?'s':''} export with their reason attached, not as blanks.`:'Every wall settled — the workbook exports clean.'}</p></div>`;
}

/* ══════════════════════════════════════════════════════════
   DELTA REVIEW — cycle-2 mode. The 2x lever, per handoff:
   review ~12 deltas, not 549 cells; one queue, not 8 sheets;
   machine-sourced + upstream-Expert-cleared deltas auto-clear;
   standing decisions persist; only judgment calls open the register.
   Meeting still happens (Beth) — this shrinks SETUP, not the room.
   ══════════════════════════════════════════════════════════ */
let drCycle = 2;                          // 1 = first full draft (v1 behaviour) · 2 = delta review (cycle 2+)
const DR_LAST_CYCLE = 'Q1 2026';
const DR_BASELINE_HOURS = 1.5;            // Technica's own manual EBR prep baseline (conservative end)

// srcKind: system (first-party field pull) · expert (consumed from another Harness Coworker) · standing (decision carried)
// kind: auto (no review needed) · judgment (needs Priya's call → opens the register)
const DELTAS = [
  // ── Hardware ──
  { id:'hw-a1', sheet:'hardware', field:'Devices managed', was:'47', now:'50', srcKind:'system', source:'N-central', kind:'auto',
    note:'3 new enrolments (RGM-LT-022/023/024) — Windows 11, already in policy.' },
  { id:'hw-a2', sheet:'hardware', field:'Warranty', was:'none expired in-window', now:'RGM-LT-021 expired Jul 2026', srcKind:'system', source:'N-central asset export', kind:'auto',
    note:'Read from the warranty-expiry column of the same N-central asset export that already fills this sheet — a solved pull, not a connector to build.' },
  { id:'hw-a3', sheet:'hardware', field:'Patch compliance', was:'94%', now:'96%', srcKind:'expert', source:'Patch Management Expert', kind:'auto',
    note:'Patch Management Expert ran this cycle (patched_count / failed_count) — the QBR Coworker consumes its result, it does not re-check patches.' },
  { id:'hw-j1', sheet:'hardware', field:'End-of-life OS', was:'2 on Windows 10', now:'3 on Windows 10', srcKind:'system', source:'N-central', kind:'judgment', findingId:'f9',
    note:'RGM-LT-019 fell out of support since last cycle — one more device to name as a budget line.' },
  // ── Employee Review ──
  { id:'em-a1', sheet:'employee', field:'Active licensed users', was:'22', now:'20', srcKind:'system', source:'Microsoft Entra ID', kind:'auto',
    note:'2 leavers disabled in Entra; licences reclaimed. Offboarding is a mechanical delta.' },
  { id:'em-a2', sheet:'employee', field:'Training completion', was:'82%', now:'86%', srcKind:'system', source:'KnowBe4', kind:'auto',
    note:'KnowBe4 sync — +4 points since last cycle.' },
  { id:'em-a3', sheet:'employee', field:'Shared-mailbox MFA exemption', was:'—', now:'carried', srcKind:'standing', source:'Standing decision', kind:'auto',
    note:'2 shared mailboxes marked exempt last cycle. Carried forward — answered once, not re-asked.' },
  { id:'em-j1', sheet:'employee', field:'MFA — new hire', was:'known service acct only', now:'+1 named user unregistered', srcKind:'system', source:'Microsoft Entra ID', kind:'judgment', findingId:'f12',
    note:'New account (started 4 Aug) with no MFA method. Onboarding grace, or a miss? Your call.' },
  // ── Risk Review ──
  { id:'rk-a1', sheet:'risk', field:'New detection (High)', was:'—', now:'auto-contained', srcKind:'expert', source:'Incident Triage Expert', kind:'auto',
    note:'A new High-severity signal appeared this cycle — Incident Triage Expert classified it P2 and it was auto-contained. No client-facing action; surfaced so it is not invisible.' },
  { id:'rk-a2', sheet:'risk', field:'Quarterly incident log', was:'—', now:'3 P2 tickets, root-caused', srcKind:'expert', source:'Ticket Response + Incident Triage + Log Analysis Experts', kind:'auto',
    note:'Ticket Response pulled and classified the tickets, Incident Triage set severity, Log Analysis wrote the summary. Three Coworkers, consumed as one pre-cleared delta.' },
  { id:'rk-j1', sheet:'risk', field:'Backup enrolment gap', was:'47/50', now:'48/50', srcKind:'system', source:'Cove', kind:'judgment', findingId:'f2',
    note:'Improved by one device. The "why" the sources could not answer is still open — carries forward as a judgment call.' },
  { id:'rk-j2', sheet:'risk', field:'Legacy remote-access appliance', was:'flagged — monitor', now:'still Unverified', srcKind:'system', source:'N-central', kind:'judgment', findingId:'f4',
    note:'No new evidence this cycle. Still single-source, unconfirmed — needs eyes before it goes in the room.' }
];

const STANDING_DECISIONS = [
  { id:'sd1', text:'2 shared mailboxes exempt from the MFA requirement', when:DR_LAST_CYCLE },
  { id:'sd2', text:'Service account (scanner) MFA exception — accepted', when:'Q3 2025' },
  { id:'sd3', text:'RGM-FW-01 legacy appliance — monitor, no remediation committed', when:DR_LAST_CYCLE }
];

const DELTA_SHEETS = ['hardware','employee','risk'];   // Beth's scope: the 3 high-volume machine-export sheets
function deltasFor(sheet){ return DELTAS.filter(d=>d.sheet===sheet); }
function deltaAuto(){ return DELTAS.filter(d=>d.kind==='auto'); }
function deltaJudgment(){ return DELTAS.filter(d=>d.kind==='judgment'); }

function srcBadge(d){
  const cls = d.srcKind==='expert' ? 'expert' : d.srcKind==='standing' ? 'standing' : 'system';
  return `<span class="src-badge ${cls}">${d.source}</span>`;
}

// Lever 2 — tier the review. Judgment deltas inherit their linked finding's defensibility tier;
// auto deltas carry a tier that says how hard the source was to trust. Standing deltas carry none.
const TIER_LABEL = { measured:'Measured', benchmarked:'Benchmarked', estimated:'Estimated', unverified:'Unverified' };
const DELTA_TIER = { 'hw-a1':'measured','hw-a2':'measured','hw-a3':'benchmarked','em-a1':'measured','em-a2':'benchmarked','rk-a1':'measured','rk-a2':'measured' };
function deltaTier(d){
  if(d.findingId){ const f=findings.find(x=>x.id===d.findingId); if(f) return f.tier; }
  return DELTA_TIER[d.id] || null;
}
function deltaTierBadge(d){ const t=deltaTier(d); return t ? `<span class="tierbadge ${t}">${TIER_LABEL[t]}</span>` : ''; }

function drSetCycle(n){ if(drCycle===n) return; drCycle=n; renderDraftReview(); window.scrollTo({top:0,behavior:'instant' in window?'instant':'auto'}); }

function deltaGoto(id){
  const d = DELTAS.find(x=>x.id===id); if(!d) return;
  if(d.findingId){ drTab='risk'; renderDraftReview(); selectFinding(d.findingId); }
  else { drTab=d.sheet; renderDraftReview(); }
  window.scrollTo({top:0,behavior:'instant' in window?'instant':'auto'});
}

// Compact lane at the top of each of the 3 scoped sheets (cycle 2 only)
function deltaLane(sheet){
  if(drCycle!==2) return '';
  const ds = deltasFor(sheet);
  if(!ds.length) return '';
  const open = ds.filter(d=>d.kind==='judgment').length;
  return `
    <div class="delta-lane">
      <div class="dl-head">Changed since ${DR_LAST_CYCLE} — ${ds.length} delta${ds.length>1?'s':''}${open?`, ${open} need${open>1?'':'s'} your call`:', all cleared'}</div>
      ${ds.map(d=>`
        <div class="dl-row" ${d.kind==='judgment'?`onclick="deltaGoto('${d.id}')" role="button" tabindex="0" style="cursor:pointer;"`:''}>
          <span class="dl-dot ${d.kind}"></span>
          <span class="dl-txt"><b>${d.field}:</b> ${d.was!=='—'?`<span class="dc-was" style="text-decoration:line-through;opacity:.7;">${d.was}</span> → `:''}<b>${d.now}</b> ${deltaTierBadge(d)}${d.kind==='auto'?` <span class="delta-clear">✓ ${d.srcKind==='expert'?'Expert-cleared':d.srcKind==='standing'?'carried':'no review'}</span>`:` <span class="delta-call">needs your call →</span>`}</span>
        </div>`).join('')}
    </div>`;
}

function renderDeltaQueue(){
  const mount = document.getElementById('dr-delta-queue');
  if(!mount) return;
  if(drCycle!==2){ mount.innerHTML=''; return; }
  const autos = deltaAuto(), judg = deltaJudgment();
  const total = DELTAS.length;
  const row = d => `
    <div class="delta-row ${d.kind}" ${d.kind==='judgment'?`onclick="deltaGoto('${d.id}')" role="button" tabindex="0"`:''}>
      <span class="delta-field">${d.field}<span class="df-sheet">${d.sheet}</span></span>
      <span class="delta-change">${d.was!=='—'?`<span class="dc-was">${d.was}</span> → `:''}<span class="dc-now">${d.now}</span> — <span style="color:var(--br-color-ink-muted);">${d.note}</span></span>
      <span class="delta-src">${deltaTierBadge(d)}${srcBadge(d)}${d.kind==='auto'?'<span class="delta-clear">no review</span>':'<span class="delta-call">open →</span>'}</span>
    </div>`;
  mount.innerHTML = `
    <div class="delta-queue">
      <div class="dq-head">
        <div>
          <h2>Cycle 2 · Delta review — ${total} changes since ${DR_LAST_CYCLE}</h2>
          <p class="dq-sub">Ridgemont's last locked draft is the baseline. The Coworker re-pulled all 8 sheets; only what <em>moved</em> is here. ${judg.length} of ${total} need a human call — the rest cleared themselves.</p>
        </div>
      </div>

      <div class="dq-prep">
        <div class="dqp-stat"><span class="dqp-num strike">549</span><span class="dqp-lbl">cells in the workbook, most machine-filled</span></div>
        <span class="dqp-arrow">→</span>
        <div class="dqp-stat"><span class="dqp-num">${judg.length}</span><span class="dqp-lbl">judgment calls you actually review this cycle</span></div>
        <div class="dq-reach">Reviewing ${judg.length} deltas instead of auditing 549 cells is what lets you run EBRs for <strong>more clients</strong> — a C/D client, normally skipped because the prep isn't worth it, gets reviewed too. Setup drops from the current <strong>~3h</strong> toward the <strong>~1.5h</strong> that makes it worthwhile, and a D-tier client toward <strong>~15 min</strong>. The meeting still happens; the <em>setup</em> is what shrank. <span class="cs-inline">[CS: LOW — illustrative target, untested; 3h→1.5h→15min per the 2026-08-14 workshop]</span></div>
      </div>

      <div class="dq-group judgment">
        <div class="dq-group-head">⚠ Needs your call — ${judg.length}</div>
        ${judg.map(row).join('')}
      </div>

      <div class="dq-group auto">
        <div class="dq-group-head">✓ Cleared automatically — ${autos.length}</div>
        ${autos.map(row).join('')}
      </div>

      <div class="dq-standing">
        <div class="dqs-head">Standing decisions carried — ${STANDING_DECISIONS.length}, answered once</div>
        ${STANDING_DECISIONS.map(s=>`<div class="dqs-row"><span>${s.text}</span><span class="dqs-when">set ${s.when} · not re-asked</span></div>`).join('')}
      </div>

      <span class="cs-tag">[A — cycle-2 delta set is illustrative fictional data; the ~12-delta / 549-cell ratio and 2x prep target are design hypotheses, not measured. Expert-cleared deltas map to the real seeded Experts in seed_experts.py.]</span>
    </div>`;
}

function renderCycleToggle(){
  document.querySelectorAll('#dr-cycle-toggle .cycle-btn').forEach((b,i)=>b.classList.toggle('active', (i===0&&drCycle===1)||(i===1&&drCycle===2)));
  const note = document.getElementById('dr-cycle-note');
  if(note) note.textContent = drCycle===2
    ? `Delta review — reviewing what changed since ${DR_LAST_CYCLE}. Switch to Cycle 1 to see the full first-draft flow.`
    : `First full draft — every finding built from scratch. Switch to Cycle 2 for the delta review that makes re-runs fast.`;
}

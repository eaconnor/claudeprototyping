<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d1410;width:460px;height:520px}
  .map-stage{width:460px;height:520px;background:#0d1410;background-image:linear-gradient(rgba(90,255,160,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(90,255,160,.06) 1px,transparent 1px);background-size:28px 28px}
  .map-stage text{font-family:'JetBrains Mono',monospace}
  .blip-ring{fill:none;stroke-width:1.4}
  .blip-active .blip-ring{stroke:#5aff9f} .blip-active .blip-dot{fill:#5aff9f}
  .blip-dormant .blip-ring{stroke:#4a5a52} .blip-dormant .blip-dot{fill:#4a5a52}
  .map-label{fill:#c8e6d4;font-size:9.5px}
  .map-sub{fill:#5f7a6c;font-size:8px}
  .map-line{stroke:#2a3a32;stroke-width:1;stroke-dasharray:2 3}
</style></head><body>
<div class="stage map-stage">
  <svg width="460" height="520" viewBox="0 0 400 460">
    <line class="map-line" x1="200" y1="60" x2="90" y2="150"/>
    <line class="map-line" x1="200" y1="60" x2="310" y2="150"/>
    <line class="map-line" x1="200" y1="60" x2="140" y2="250"/>
    <line class="map-line" x1="200" y1="60" x2="260" y2="330"/>
    <line class="map-line" x1="200" y1="60" x2="80" y2="360"/>
    <g class="blip-active"><circle class="blip-ring" cx="200" cy="60" r="16"/><circle class="blip-dot" cx="200" cy="60" r="4"/></g>
    <text class="map-label" x="216" y="57">QBR ADVISOR</text><text class="map-sub" x="216" y="68">HQ · 92% · the wedge</text>
    <g class="blip-active"><circle class="blip-ring" cx="90" cy="150" r="13"/><circle class="blip-dot" cx="90" cy="150" r="4"/></g>
    <text class="map-label" x="50" y="130">INCIDENT RESPONSE</text><text class="map-sub" x="60" y="170">78%</text>
    <g class="blip-active"><circle class="blip-ring" cx="310" cy="150" r="13"/><circle class="blip-dot" cx="310" cy="150" r="4"/></g>
    <text class="map-label" x="270" y="130">ENV HEALTH MONITOR</text><text class="map-sub" x="290" y="170">65% · 2 flagged</text>
    <circle cx="310" cy="150" r="20" fill="none" stroke="#ff6b5a" stroke-width="1" stroke-dasharray="3 3"/>
    <g class="blip-active"><circle class="blip-ring" cx="140" cy="250" r="13"/><circle class="blip-dot" cx="140" cy="250" r="4"/></g>
    <text class="map-label" x="98" y="230">SECURITY TABLETOP</text><text class="map-sub" x="110" y="270">81%</text>
    <g class="blip-dormant"><circle class="blip-ring" cx="80" cy="360" r="11" stroke-dasharray="3 3"/><circle class="blip-dot" cx="80" cy="360" r="3"/></g>
    <text class="map-label" x="20" y="345" fill="#5f7a6c">ALERT FLOOD SUPPRESSOR</text><text class="map-sub" x="45" y="380">dormant · do not lead</text>
  </svg>
</div>
</body></html>

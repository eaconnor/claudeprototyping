function loadCanvasData(ideaHash) {
  try {
    const s = localStorage.getItem('chorus_canvas_' + ideaHash);
    return s ? JSON.parse(s) : {};
  } catch(e) { return {}; }
}

function saveCanvasData(ideaHash, data) {
  try { localStorage.setItem('chorus_canvas_' + ideaHash, JSON.stringify(data)); } catch(e) {}
}

const CANVAS_DIM_MAP = [
  { key: 'MOORE',      dims: ['VALUE PROP'],                  maxBonus: 2.5 },
  { key: 'JTBD',       dims: ['VALUE PROP', 'PAIN EVIDENCE'], maxBonus: 2.0 },
  { key: 'BLUE_OCEAN', dims: ['VALUE PROP', 'COMPANY FIT'],   maxBonus: 1.5 },
  { key: 'ANSOFF',     dims: ['COMPANY FIT'],                 maxBonus: 2.0 },
  { key: 'KANO',       dims: ['PAIN EVIDENCE'],               maxBonus: 2.0 },
  { key: 'DOBLIN',     dims: ['10 TYPES'],                    maxBonus: 2.5 },
  { key: 'FIVE_ES',    dims: ['UX — 5Es'],                    maxBonus: 2.5 },
  { key: 'SDT',        dims: ['SELF-ACTUAL.'],                maxBonus: 2.5 },
];

function applyCanvasBoosts(scores, ideaHash) {
  const canvasData = loadCanvasData(ideaHash);
  CANVAS_DIM_MAP.forEach(mapping => {
    const cDef = CANVASES.find(c => c.key === mapping.key);
    if (!cDef) return;
    const cData = canvasData[mapping.key] || {};
    const filled = cDef.slots.filter(s => cData[s.k] && cData[s.k].trim()).length;
    if (filled === 0) return;
    const fillFrac = filled / cDef.slots.length;
    const bonus = fillFrac * mapping.maxBonus;
    mapping.dims.forEach(dimName => {
      const entry = scores.find(s => s.dim === dimName);
      if (!entry) return;
      entry.score = Math.min(10, entry.score + bonus);
      if (!['R', 'D'].includes(entry.tag)) entry.tag = 'D';
      entry.trace = entry.trace || [];
      entry.trace.push({
        signal: `canvas: ${cDef.label} (${filled}/${cDef.slots.length} filled)`,
        excerpt: null,
        tag: 'D'
      });
    });
  });
}

function setCanvasSlot(ideaHash, canvasKey, slotKey, value) {
  const data = loadCanvasData(ideaHash);
  if (!data[canvasKey]) data[canvasKey] = {};
  if (value && value.trim()) data[canvasKey][slotKey] = value.trim();
  else delete data[canvasKey][slotKey];
  saveCanvasData(ideaHash, data);
}

function renderCanvases(ideaHash) {
  const data = loadCanvasData(ideaHash);

  const blocks = CANVASES.map(c => {
    const cdata = data[c.key] || {};
    const filled = c.slots.filter(s => cdata[s.k] && cdata[s.k].trim()).length;
    const total = c.slots.length;
    const isOpen = filled > 0; // auto-open canvases with content
    const completeClass = filled === total ? 'complete' : '';

    const slotRows = c.slots.map(s => {
      const val = cdata[s.k] || '';
      const slotId = `slot-${c.key}-${s.k}-${ideaHash}`;
      return `
        <div class="canvas-slot">
          <span class="canvas-slot-label">${escapeHtml(s.l)}</span>
          <div class="canvas-slot-value ${val ? '' : 'gap'}"
               id="${slotId}-display"
               data-canvas="${escapeAttr(c.key)}"
               data-slot="${escapeAttr(s.k)}"
               data-hash="${escapeAttr(ideaHash)}"
               data-hint="${escapeAttr(s.hint || '')}"
               data-slot-id="${escapeAttr(slotId)}">
            ${val ? escapeHtml(val) : (s.hint ? escapeHtml(s.hint) : 'click to fill')}
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="canvas-block">
        <div class="canvas-head" onclick="toggleCanvasBlock('${c.key}-${ideaHash}')">
          <span class="canvas-name">${escapeHtml(c.label)}</span>
          <span>
            <span class="canvas-count ${completeClass}" id="count-${c.key}-${ideaHash}">${filled} of ${total} filled</span>
            <span class="canvas-arrow" id="arrow-${c.key}-${ideaHash}">${isOpen ? '▾' : '▸'}</span>
          </span>
        </div>
        <div class="canvas-slots" id="slots-${c.key}-${ideaHash}" style="display:${isOpen ? 'block' : 'none'};">
          ${slotRows}
        </div>
      </div>
    `;
  }).join('');

  return blocks;
}

function toggleCanvasBlock(id) {
  const el = document.getElementById('slots-' + id);
  const arrow = document.getElementById('arrow-' + id);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (arrow) arrow.textContent = open ? '▸' : '▾';
}

function editCanvasSlot(ideaHash, canvasKey, slotKey, slotId, hint) {
  const display = document.getElementById(slotId + '-display');
  if (!display) return;
  const data = loadCanvasData(ideaHash);
  const currentVal = (data[canvasKey] && data[canvasKey][slotKey]) || '';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'canvas-slot-edit';
  input.value = currentVal;
  input.placeholder = hint || '';
  display.replaceWith(input);
  input.focus();
  input.select();

  let finished = false;
  const finish = (save) => {
    if (finished) return;
    finished = true;
    const newVal = save ? input.value.trim() : currentVal;
    if (save) {
      setCanvasSlot(ideaHash, canvasKey, slotKey, newVal);
    }
    // re-render display with the new value directly (no localStorage round-trip)
    const newDisplay = document.createElement('div');
    newDisplay.id = slotId + '-display';
    newDisplay.className = 'canvas-slot-value ' + (newVal ? '' : 'gap');
    newDisplay.textContent = newVal || (hint || 'click to fill');
    newDisplay.setAttribute('data-canvas', canvasKey);
    newDisplay.setAttribute('data-slot', slotKey);
    newDisplay.setAttribute('data-hash', ideaHash);
    newDisplay.setAttribute('data-hint', hint || '');
    newDisplay.setAttribute('data-slot-id', slotId);
    if (input.parentNode) input.replaceWith(newDisplay);
    refreshCanvasCount(ideaHash, canvasKey);
  };

  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter')  { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
}

// delegated click handler for canvas slot values
document.addEventListener('click', function(e) {
  const el = e.target.closest && e.target.closest('.canvas-slot-value');
  if (!el) return;
  // ignore clicks during editing
  if (el.tagName === 'INPUT') return;
  const ideaHash   = el.getAttribute('data-hash');
  const canvasKey  = el.getAttribute('data-canvas');
  const slotKey    = el.getAttribute('data-slot');
  const slotId     = el.getAttribute('data-slot-id');
  const hint       = el.getAttribute('data-hint') || '';
  if (!ideaHash || !canvasKey || !slotKey) return;
  editCanvasSlot(ideaHash, canvasKey, slotKey, slotId, hint);
});

function refreshCanvasCount(ideaHash, canvasKey) {
  const data = loadCanvasData(ideaHash);
  const c = CANVASES.find(x => x.key === canvasKey);
  if (!c) return;
  const cdata = data[canvasKey] || {};
  const filled = c.slots.filter(s => cdata[s.k] && cdata[s.k].trim()).length;
  const total = c.slots.length;
  const count = document.getElementById(`count-${canvasKey}-${ideaHash}`);
  if (count) {
    count.textContent = `${filled} of ${total} filled`;
    count.className = 'canvas-count' + (filled === total ? ' complete' : '');
  }
}

function loadCriteria() {
  try {
    const s = localStorage.getItem('chorus_criteria');
    return s ? JSON.parse(s) : { 1: [], 2: [], 3: [], 4: [] };
  } catch(e) { return { 1: [], 2: [], 3: [], 4: [] }; }
}

function saveCriteria(data) {
  try { localStorage.setItem('chorus_criteria', JSON.stringify(data)); } catch(e) {}
}

function addCriterion(gateNum, text, type) {
  const data = loadCriteria();
  if (!data[gateNum]) data[gateNum] = [];
  data[gateNum].push({ id: Date.now().toString(36), text, type, met: false });
  saveCriteria(data);
}

function toggleCriterion(gateNum, id) {
  const data = loadCriteria();
  const item = (data[gateNum] || []).find(c => c.id === id);
  if (item) item.met = !item.met;
  saveCriteria(data);
}

function deleteCriterion(gateNum, id) {
  const data = loadCriteria();
  data[gateNum] = (data[gateNum] || []).filter(c => c.id !== id);
  saveCriteria(data);
}

function criteriaMetBonus(gateNum) {
  const data = loadCriteria();
  const list = data[gateNum] || [];
  if (!list.length) return 0;
  const met = list.filter(c => c.met).length;
  return met / list.length; // 0–1 bonus toward level
}

function renderCriteriaSection(gateNum) {
  const data = loadCriteria();
  const list = data[gateNum] || [];
  const metCount = list.filter(c => c.met).length;

  const items = list.map(c => `

    </div>

  const countLabel = list.length
    ? `<span class="criteria-met-count">${metCount}/${list.length} met</span>`
    : '';

  return `

}

function submitCriterion(gateNum) {
  const input = document.getElementById('criteria-input-' + gateNum);
  const typeEl = document.getElementById('criteria-type-' + gateNum);
  const text = input ? input.value.trim() : '';
  if (!text) return;
  addCriterion(gateNum, text, typeEl ? typeEl.value : 'CHECK');
  if (input) input.value = '';
  rerenderGateCriteria(gateNum);
}

function rerenderGateCriteria(gateNum) {
  const el = document.getElementById('criteria-section-' + gateNum);
  if (el) el.outerHTML = renderCriteriaSection(gateNum);
}

function toggleCriteriaList(gateNum) {
  const body = document.getElementById('criteria-body-' + gateNum);
  const arrow = document.getElementById('criteria-arrow-' + gateNum);
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? 'block' : 'none';
  if (arrow) arrow.textContent = hidden ? '▾' : '▸';
}

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < Math.min(str.length, 200); i++)
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return Math.abs(h).toString(36).slice(0, 8);
}

function calcGateLevel(gate, scoreMap) {
  const dimScores = gate.dims.map(d => scoreMap[d] ? scoreMap[d].score : 0);
  const avg = dimScores.reduce((a, b) => a + b, 0) / dimScores.length;
  const evidenced = gate.dims.filter(d => scoreMap[d] && ['R','D'].includes(scoreMap[d].tag)).length;
  const evidenceBonus = evidenced / gate.dims.length;
  const critBonus = criteriaMetBonus(gate.num);
  return Math.min(5, Math.round((avg / 10) * 3.5 + evidenceBonus * 0.75 + critBonus * 0.75));
}

function loadGateLevels(hash) {
  try {
    const s = localStorage.getItem('chorus_gates_' + hash);
    return s ? JSON.parse(s) : [0, 0, 0, 0];
  } catch(e) { return [0, 0, 0, 0]; }
}

function saveGateLevels(hash, levels) {
  try { localStorage.setItem('chorus_gates_' + hash, JSON.stringify(levels)); } catch(e) {}
}

function mergeGateLevels(stored, fresh) {
  return stored.map((s, i) => Math.max(s, fresh[i] || 0));
}

function renderGates(scores, ideaText) {
  const scoreMap = {};
  scores.forEach(s => { scoreMap[s.dim] = s; });

  const hash = simpleHash(ideaText);
  const stored = loadGateLevels(hash);
  const fresh = GATES.map(g => calcGateLevel(g, scoreMap));
  const merged = mergeGateLevels(stored, fresh);
  saveGateLevels(hash, merged);

  const cards = GATES.map((gate, i) => {
    const prevLevel = i > 0 ? merged[i - 1] : 5;
    const isLocked = prevLevel < gate.unlockAt;
    const level = merged[i];
    const isNew = fresh[i] > stored[i];

    const segs = Array.from({ length: 10 }, (_, s) => {
      const filled = s < level * 2;
      const cls = filled ? (level >= 4 ? 'filled' : 'filled-warn') : '';
      return `<div class="gate-xp-seg ${cls}"></div>`;
    }).join('');

    const lockNote = isLocked
      ? `<span class="gate-lock">🔒 GATE ${i} → LVL ${gate.unlockAt} to unlock</span>`
      : '';

    const newBadge = isNew && !isLocked
      ? `<div class="gate-new-badge">↑ LEVELED UP</div>`
      : '';

    return `
      <div class="gate-card ${isLocked ? 'locked' : ''}">
        ${newBadge}
        <div class="gate-top">
          <span class="gate-num">GATE ${gate.num}</span>
          <span class="gate-question">${escapeHtml(gate.question)}</span>
          ${lockNote}
        </div>
        <div class="gate-level-row">
          <span class="gate-lvl-label">LVL ${level} / 5</span>
          <div class="gate-xp-track">${segs}</div>
        </div>
        <div class="gate-dims">${gate.dims.join(' · ')}</div>
        ${renderCriteriaSection(gate.num)}
      </div>
    `;
  }).join('');

  return `<div class="gates-wrap">${cards}</div>`;
}

// ══════════════════════════════════════════════════════
// PATTERN ANALYSIS — Bradley watches what gets killed
// ══════════════════════════════════════════════════════

const DIM_KEYS = ['VALUE PROP','COMPANY FIT','10 TYPES','PAIN EVIDENCE','WILL TO PAY','SELF-ACTUAL.','UX — 5Es'];

function analyzePatterns() {
  const ideas = loadIdeas();
  const killed = ideas.filter(i => i.outcome === 'killed');
  if (killed.length < 3) return [];

  const proposals = [];
  DIM_KEYS.forEach(dim => {
    const scores = killed.map(i => i.scores[dim]).filter(s => s !== undefined);
    if (scores.length < 3) return;
    const avg = scores.reduce((a,b) => a+b, 0) / scores.length;
    if (avg < 5) {
      const std = loadStandard();
      const current7 = std.dimensions[dim] ? std.dimensions[dim].bar7 : '';
      proposals.push({
        dim,
        avg: avg.toFixed(1),
        count: killed.length,
        current: current7,
        proposed: `Require evidence at Gate 1 — ${killed.length} killed ideas averaged ${avg.toFixed(1)}/10 here.`
      });
    }
  });
  return proposals;
}

        <div class="history-item">
          <span class="hist-outcome hist-${idea.outcome || 'paused'}">${(idea.outcome || 'unlogged').toUpperCase()}</span>
          <span class="hist-name">${escapeHtml((idea.name || 'Unnamed').substring(0, 60))}</span>

  ` : `<div style="font-family:'Kalam',cursive;font-size:0.9rem;opacity:0.5;margin-top:16px;">No ideas logged yet. Run an idea and log the outcome.</div>`;

// ══════════════════════════════════════════════════════
// PROPOSAL ACCEPT / REJECT
// ══════════════════════════════════════════════════════

let _currentProposals = [];

function acceptProposal(i) {
  const p = _currentProposals[i];
  if (!p) return;
  const std = loadStandard();
  if (std.dimensions[p.dim]) {
    std.dimensions[p.dim].history.push({
      version: std.version,
      bar7: std.dimensions[p.dim].bar7,
      at: new Date().toISOString().slice(0,10),
      reason: p.proposed
    });
    std.dimensions[p.dim].bar7 = p.proposed;
  }
  std.version += 1;
  std.updatedAt = new Date().toISOString().slice(0,10);
  std.updatedBy = 'Bradley — pattern analysis';
  saveStandard(std);
  document.getElementById('standard-content').innerHTML = renderStandard();
  _currentProposals = analyzePatterns();
}

function rejectProposal(i) {
  const el = document.getElementById(`proposal-${i}`);
  if (el) {
    el.style.opacity = '0.4';
    el.style.pointerEvents = 'none';
    el.querySelector('.proposal-actions').innerHTML = '<span style="font-family:Space Mono,monospace;font-size:0.7rem;color:var(--ink);opacity:0.6;">Rejected.</span>';
  }
}

function initOutcomePanel() {

  document.getElementById('log-outcome-btn').addEventListener('click', function() {
    if (!_currentOutcome || !_currentIdeaData) return;
    const reason = document.getElementById('outcome-reason').value.trim();
    saveIdea(Object.assign({}, _currentIdeaData, {
      outcome: _currentOutcome,
      killReason: reason || null,
      scoredAt: new Date().toISOString().slice(0,10)
    }));
    document.getElementById('outcome-logged').style.display = 'block';
    document.getElementById('log-outcome-btn').disabled = true;
    document.getElementById('log-outcome-btn').textContent = 'LOGGED ✓';
    // refresh standard with new patterns
    _currentProposals = analyzePatterns();
    document.getElementById('standard-content').innerHTML = renderStandard();
  });
}

document.getElementById('run-btn').addEventListener('click', function() {
  const text = document.getElementById('idea-text').value.trim();
  if (!text) {
    document.getElementById('idea-text').focus();
    return;
  }
  const contextText = document.getElementById('context-text').value.trim();

  // Transition to output
  document.getElementById('state-input').style.display = 'none';
  document.getElementById('state-output').style.display = 'block';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('panels').style.display = 'none';

  // Simulate reading delay
  setTimeout(function() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('panels').style.display = 'flex';

    const sig = detectSignals(text);
    const extracted = extractIdea(text);
    const scores = buildScores(text, contextText);
    const avg = (scores.reduce((a,s) => a+s.score, 0) / scores.length).toFixed(1);

    // store for outcome logging
    const scoreMap = {};
    scores.forEach(s => { scoreMap[s.dim] = s.score; });
    _currentIdeaData = {
      name: extracted.name || text.trim().split(/\s+/).slice(0,6).join(' '),
      text: text,
      context: contextText,
      scores: scoreMap,
      chorusScore: avg
    };
    _currentOutcome = null;
    _currentProposals = analyzePatterns();

    document.getElementById('gates-content').innerHTML     = renderGates(scores, text);
    document.getElementById('bradley-content').innerHTML   = renderBradley(text, sig, extracted);
    document.getElementById('scorecard-content').innerHTML = renderScoreCard(scores);
    document.getElementById('research-content').innerHTML  = renderResearch(scores, contextText, text);
    document.getElementById('brief-content').innerHTML     = renderBrief(text, contextText, extracted, scores, simpleHash(text));
    document.getElementById('standard-content').innerHTML  = renderStandard();

    // Attach copy button
    const copyBtn = document.getElementById('copy-brief-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', function() {
        const txt = this.getAttribute('data-text').replace(/&#10;/g, '\n');
        navigator.clipboard.writeText(txt).then(() => {
          this.textContent = 'COPIED ✓';
          setTimeout(() => { this.textContent = 'COPY BRIEF'; }, 1800);
        }).catch(() => {
          this.textContent = 'COPY FAILED';
        });
      });
    }
  }, 400);
});

document.getElementById('reset-btn').addEventListener('click', function() {
  document.getElementById('state-output').style.display = 'none';
  document.getElementById('state-input').style.display  = 'flex';
  document.getElementById('idea-text').value = '';
  document.getElementById('context-text').value = '';
  _evidenceLinks = [];
  renderEvidenceList();
  document.getElementById('panels').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
  // reset outcome panel
  _currentOutcome = null;
  _currentIdeaData = null;
  ['shipped','killed','paused'].forEach(o => {
    document.getElementById('btn-' + o).classList.remove('active-shipped','active-killed','active-paused');
  });
  document.getElementById('outcome-reason-block').style.display = 'none';
  document.getElementById('outcome-logged').style.display = 'none';
  document.getElementById('outcome-reason').value = '';
  document.getElementById('log-outcome-btn').disabled = false;
  document.getElementById('log-outcome-btn').textContent = 'LOG OUTCOME →';
});

// init on page load
initOutcomePanel();
</script>
</body>
</html>

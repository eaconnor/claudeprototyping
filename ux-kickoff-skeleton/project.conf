# project.conf — the only file you edit to drop this skeleton into a project.
#
# This is the MINIMAL sibling of ux-spec-skeleton — check-gates.sh, check-blocked.sh
# and check-roster.sh only. If you need drift-detection, judgment-contract
# enforcement, design-system linting, never-events, or the rest of that toolkit's
# thirteen scripts, start from ux-spec-skeleton instead and treat this file's
# ROSTER/RACI/ESCALATION_PATH fields as the addition to port over.
#
# Why a second, smaller skeleton exists at all: a UX-led kickoff produces a roster,
# RACI, an evidence-basis call and an escalation path before it produces any of
# ux-spec-skeleton's gate content — and that groundwork needs a place to live from
# day one, in the first commit, not bolted on to a heavier toolkit later.

PROJECT_NAME="‹your-project›"

# Canonical intent document — use templates/UX-INTENT-SPEC.template.md from
# ux-spec-skeleton (RACI, evidence_basis, change requests and scoped sign-off as
# core structure) or the base Intent_Spec_Example.md if that groundwork already
# lives elsewhere. Leave empty if none exists yet — that is the pre-spec phase, not
# a missing step.
INTENT_SPEC=""

# ---- ROSTER & RACI ----------------------------------------------------------
# Accountability is a property of a DECISION, not of the project as a whole. Real
# teams end up with several people each accountable for a different area — that is
# correct RACI, not a defect. One line per person: name · project role · R/A/C/I per
# discipline. check-roster.sh parses this block; keep the pipe-delimited shape.
#
# format: NAME | PROJECT ROLE | PRODUCT-RACI | DESIGN-RACI | RESEARCH-RACI | ENGINEERING-RACI
# blank RACI cells are fine — UNASSIGNED is a legal value, unasked is not.
ROSTER=(
  "‹name› | ‹what they are doing on the team› | ‹R/A/C/I› | ‹R/A/C/I› | ‹R/A/C/I› | ‹R/A/C/I›"
)

# The project-wide signer, distinct from any single area's A above. Required even
# when every area already has its own accountable name — some actions don't belong
# to one area, and this is who they resolve to.
ACCOUNTABLE_OWNER="‹a real person›"

# Who is assigned to research, and therefore whose job it is to set up the evidence
# layer and choose what form it takes. MUST BE A PERSON, NOT A FUNCTION — "UX",
# "research", "the team" read as unowned. check-roster.sh rejects them.
RESEARCH_OWNER="‹a real person›"

# Legal / privacy / security co-signer. Live from day one if this project touches
# anything about an identifiable person — lawfulness is FLOOR, never gated on
# problem validation. UNASSIGNED here is a legal value, but it becomes a HUMAN row
# in OPEN.md the moment anyone needs a T3 signature and there's nobody to give it.
RISK_FUNCTION="‹legal / privacy / security — a real function, or UNASSIGNED›"

# Who a signature conflict, or a refusal to sign, goes to. The toolkit never
# adjudicates a conflict itself — it only makes it visible via an OPEN.md HUMAN row,
# owned by whoever is named here. An escalation path that has never actually been
# used is untested, not proven; ESCALATION_PATH_TESTED defaults to false honestly.
ESCALATION_PATH="‹a real person — often a GM or sponsor above ACCOUNTABLE_OWNER›"
ESCALATION_PATH_TESTED="false"

# EVIDENCE BASIS of the intent spec named above — separate from that document's own
# workflow status. "I don't know" resolves to HYPOTHESES: a positive claim requires
# someone able to point at evidence, and admitting a first draft is a guess is not a
# penalty. check-roster.sh reports this; it does not judge it.
#   HYPOTHESES  nobody can point at evidence for the load-bearing claims yet
#   FINDINGS    every load-bearing claim has a source someone can point at
#   MIXED       some of each
EVIDENCE_BASIS="HYPOTHESES"

# Gate files, in gate order. Same shape as ux-spec-skeleton's — copy those files in
# directly if you outgrow this skeleton's simplified frontmatter.
GATE_1="ux.md"
GATE_2="vision.md"
GATE_3="design.md"

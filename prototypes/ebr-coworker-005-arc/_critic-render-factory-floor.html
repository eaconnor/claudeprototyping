<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:460px;height:520px}
  .factory-stage{width:460px;height:520px;background:#f4f1ea;padding:20px}
  .belt{height:10px;background:repeating-linear-gradient(90deg,#c9c2ac 0 14px,#b5ad93 14px 16px);border-radius:5px;position:relative;margin:18px 0}
  .station{display:flex;flex-direction:column;align-items:center;gap:6px}
  .station .box{width:64px;height:64px;border-radius:10px;background:#fff;border:2px solid #c9c9d2;display:flex;align-items:center;justify-content:center;position:relative;font-family:'JetBrains Mono',monospace}
  .station.on .box{border-color:#137a46}
  .station.weak .box{border-color:#8a8a93;opacity:.55}
  .station .light{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
  .station.on .light{background:#137a46} .station.warn .light{background:#a56a00} .station.weak .light{background:#8a8a93}
  .station .lab{font-family:'JetBrains Mono',monospace;font-size:9px;color:#5a5347;text-align:center;max-width:78px;line-height:1.3}
  .kit{width:26px;height:20px;background:rgba(192,70,255,.10);border:1.5px solid #c046ff;border-radius:3px}
  .stations-row{display:flex;justify-content:space-between;padding:0 6px}
  .kits-row{display:flex;justify-content:flex-end;gap:8px;padding:0 10px;margin-top:8px;align-items:center}
</style></head><body>
<div class="stage factory-stage">
  <div class="stations-row">
    <div class="station on"><div class="light"></div><div class="box">QBR</div><div class="lab">QBR Advisor<br>92%</div></div>
    <div class="station on"><div class="light"></div><div class="box">IR</div><div class="lab">Incident Response<br>78%</div></div>
    <div class="station warn"><div class="light"></div><div class="box">EH</div><div class="lab">Env Health<br>65% · flagged</div></div>
    <div class="station on"><div class="light"></div><div class="box">ST</div><div class="lab">Security Tabletop<br>81%</div></div>
    <div class="station weak"><div class="light"></div><div class="box">AF</div><div class="lab">Alert Flood<br>dormant</div></div>
  </div>
  <div class="belt"></div>
  <div class="kits-row"><div class="kit"></div><div class="kit"></div><div class="kit"></div><span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#5a5347">→ kits, done, handed back</span></div>
</div>
</body></html>

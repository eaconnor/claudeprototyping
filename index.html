document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

{\n  width: 28px; height: 28px;\n  display: inline-block;\n  position: relative;\n  transform: translateY(4px);\n}\n.brand-mark .dot { position: absolute; }\n.brand-mark .sq { width: 14px; height: 14px; background: var(--ultramarine); left: 0; top: 0; }\n.brand-mark .ci { width: 14px; height: 14px; background: var(--vermillion); border-radius: 50%; right: 0; top: 0; }\n.brand-mark .tr {\n  width: 0; height: 0;\n  border-left: 7px solid transparent;\n  border-right: 7px solid transparent;\n  border-bottom: 12px solid var(--cadmium);\n  left: 7px; bottom: 0;\n}\n.brand h1 {\n  font-family: 'Space Mono', monospace;\n  font-weight: 700;\n  font-size: clamp(28px, 3.6vw, 44px);\n  letter-spacing: -0.02em;\n  line-height: 1;\n}\n.brand .sub {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--mute);\n}\n.project-name {\n  font-family: 'Space Mono', monospace;\n  font-size: 12px;\n  color: var(--ink);\n  text-align: right;\n  letter-spacing: 0.02em;\n  line-height: 1.6;\n}\n.project-name .label {\n  color: var(--mute);\n  text-transform: uppercase;\n  letter-spacing: 0.14em;\n  font-size: 10px;\n}\n.project-name input {\n  font-family: 'Space Mono', monospace;\n  font-size: 13px;\n  font-weight: 700;\n  background: transparent;\n  border: none;\n  border-bottom: 1.5px dashed var(--mute);\n  color: var(--ink);\n  text-align: right;\n  padding: 2px 0;\n  outline: none;\n  width: 200px;\n}\n.project-name input:focus { border-bottom-color: var(--vermillion); }\n\n/* === ROOM NAV === */\n.rooms {\n  display: flex;\n  gap: 0;\n  margin-bottom: 32px;\n  border-bottom: 1.5px solid var(--line);\n}\n.room-tab {\n  font-family: 'Space Mono', monospace;\n  font-weight: 700;\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  padding: 14px 22px;\n  background: transparent;\n  border: none;\n  border-right: 1.5px solid var(--line);\n  cursor: pointer;\n  color: var(--mute);\n  position: relative;\n  transition: color 0.1s, background 0.1s;\n}\n.room-tab:first-child { border-left: 1.5px solid var(--line); }\n.room-tab:hover { color: var(--ink); background: rgba(0,0,0,0.03); }\n.room-tab.active {\n  color: var(--ink);\n  background: var(--card);\n}\n.room-tab.active::after {\n  content: '';\n  position: absolute;\n  left: 0; right: 0; bottom: -1.5px;\n  height: 3px;\n  background: var(--accent, var(--ink));\n}\n.room-tab[data-room=\"george\"] { --accent: var(--vermillion); }\n.room-tab[data-room=\"frameworks\"] { --accent: var(--ultramarine); }\n.room-tab[data-room=\"paul\"] { --accent: var(--ochre); }\n.room-tab[data-room=\"juliet\"] { --accent: var(--violet); }\n.room-tab[data-room=\"library\"] { --accent: var(--green-earth); }\n.room-tab[data-room=\"bradley\"] { --accent: var(--ultramarine); }\n.room-tab .room-idx {\n  display: inline-block;\n  width: 18px; height: 18px;\n  line-height: 18px;\n  text-align: center;\n  font-size: 10px;\n  background: var(--ink);\n  color: var(--paper);\n  margin-right: 8px;\n  vertical-align: 2px;\n}\n.room-tab.active .room-idx { background: var(--accent, var(--ink)); }\n.room-tab.has-flag::before {\n  content: '';\n  position: absolute;\n  top: 8px; right: 8px;\n  width: 6px; height: 6px;\n  background: var(--green-earth);\n  border-radius: 50%;\n}\n\n.room { display: none; }\n.room.active { display: block; }\n\n/* === PANELS === */\n.panel {\n  border: 2px solid var(--line);\n  background: var(--card);\n  box-shadow: 6px 6px 0 var(--line);\n  padding: 24px;\n}\n.panel-tight { padding: 18px 20px; }\n.panel-flat { box-shadow: none; }\n.panel h3, .panel h2 {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  margin-bottom: 14px;\n  color: var(--ink);\n  display: flex;\n  align-items: center;\n  gap: 10px;\n}\n.panel h3 .tag, .panel h2 .tag {\n  font-size: 9px;\n  background: var(--ink);\n  color: var(--paper);\n  padding: 2px 6px;\n  letter-spacing: 0.1em;\n}\n\ntextarea, input.text {\n  width: 100%;\n  padding: 14px;\n  font-family: 'Kalam', cursive;\n  font-size: 16px;\n  line-height: 1.55;\n  border: 1.5px solid var(--line);\n  background: var(--paper);\n  color: var(--ink);\n  resize: vertical;\n  outline: none;\n}\ntextarea:focus, input.text:focus { border-color: var(--vermillion); }\ntextarea.mono { font-family: 'Space Mono', monospace; font-size: 13px; }\n\n/* === BUTTONS === */\n.btn {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  padding: 10px 16px;\n  border: 1.5px solid var(--line);\n  background: var(--paper);\n  color: var(--ink);\n  cursor: pointer;\n  transition: transform 0.08s, background 0.1s, color 0.1s;\n}\n.btn:hover { background: var(--ink); color: var(--paper); transform: translate(-1px, -1px); }\n.btn.primary { background: var(--ink); color: var(--paper); }\n.btn.primary:hover { background: var(--vermillion); border-color: var(--vermillion); }\n.btn.ghost { border-color: var(--mute); color: var(--mute); }\n.btn.ghost:hover { border-color: var(--ink); color: var(--ink); background: transparent; }\n.btn.danger:hover { background: var(--vermillion); border-color: var(--vermillion); color: var(--paper); }\n.btn.go { border-color: var(--green-earth); color: var(--green-earth); }\n.btn.go:hover { background: var(--green-earth); border-color: var(--green-earth); color: var(--paper); }\n.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }\n\n/* === GEORGE ROOM === */\n.george-grid {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) 280px;\n  gap: 28px;\n  align-items: start;\n}\n.george-main { display: flex; flex-direction: column; gap: 24px; }\n.george-aside { display: flex; flex-direction: column; gap: 24px; position: sticky; top: 20px; }\n\n.george-meta {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-end;\n  gap: 16px;\n  margin-bottom: 14px;\n}\n.george-meta .who {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--vermillion);\n  display: flex; align-items: center; gap: 8px;\n}\n.george-meta .who::before {\n  content: '';\n  width: 10px; height: 10px;\n  background: var(--vermillion);\n  display: inline-block;\n}\n.george-meta .turn {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  color: var(--mute);\n}\n.george-meta .turn b { color: var(--ink); }\n\n/* George remarks column (right) */\n.remarks {\n  padding: 18px 18px 22px;\n  position: relative;\n  min-height: 240px;\n}\n.remarks::before {\n  content: '';\n  position: absolute;\n  top: 14px; bottom: 14px; left: 0;\n  width: 3px;\n  background: var(--vermillion);\n}\n.remarks h4 {\n  font-family: 'Space Mono', monospace;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--vermillion);\n  margin-bottom: 12px;\n  padding-left: 10px;\n}\n.remarks-list { display: flex; flex-direction: column; gap: 14px; padding-left: 10px; }\n.remark {\n  font-family: 'Kalam', cursive;\n  font-size: 15px;\n  line-height: 1.4;\n  color: var(--ink);\n  position: relative;\n  padding-left: 16px;\n  animation: writeIn 0.35s ease-out both;\n}\n.remark::before {\n  content: '—';\n  position: absolute;\n  left: 0; top: 0;\n  color: var(--vermillion);\n  font-weight: 700;\n}\n.remark.dim { color: var(--mute); }\n.remark.cite {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  color: var(--ink2);\n  background: var(--paper);\n  padding: 4px 8px;\n  border-left: 2px solid var(--vermillion);\n  margin-left: 12px;\n}\n.remark.cite::before { display: none; }\n@keyframes writeIn {\n  from { opacity: 0; transform: translateX(6px); }\n  to { opacity: 1; transform: translateX(0); }\n}\n.remarks-empty {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  color: var(--mute);\n  padding-left: 10px;\n  line-height: 1.6;\n}\n\n/* === FOUR LENSES === */\n.lenses { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }\n.lens {\n  display: grid;\n  grid-template-columns: 70px 1fr auto;\n  gap: 16px;\n  align-items: center;\n  padding: 14px 0;\n  border-bottom: 1px dashed var(--mute2);\n  cursor: pointer;\n}\n.lens:last-child { border-bottom: none; }\n.lens-label {\n  font-family: 'Space Mono', monospace;\n  font-size: 14px;\n  font-weight: 700;\n  letter-spacing: 0.06em;\n}\n.lens-bar {\n  display: flex;\n  gap: 4px;\n  align-items: center;\n}\n.lens-cell {\n  width: 100%;\n  height: 18px;\n  border: 1.5px solid var(--line);\n  background: var(--paper);\n  position: relative;\n  flex: 1;\n  cursor: pointer;\n}\n.lens-cell.filled { background: var(--ultramarine); }\n.lens-cell.weak { background: var(--cadmium); }\n.lens-cell.strong { background: var(--green-earth); }\n.lens-cell:hover { outline: 2px solid var(--vermillion); outline-offset: 1px; z-index: 2; }\n.lens-meta {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  color: var(--mute);\n  white-space: nowrap;\n}\n.lens-meta b { color: var(--ink); font-size: 12px; }\n.lens-overridden {\n  display: inline-block;\n  font-size: 9px;\n  background: var(--ochre);\n  color: var(--ink);\n  padding: 1px 5px;\n  margin-left: 6px;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n}\n\n.lens-evidence {\n  grid-column: 1 / -1;\n  margin-top: 10px;\n  padding: 12px 14px;\n  background: var(--paper);\n  border-left: 3px solid var(--ultramarine);\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  line-height: 1.7;\n  color: var(--ink2);\n  display: none;\n}\n.lens.open .lens-evidence { display: block; }\n.lens-evidence .row { margin-bottom: 6px; }\n.lens-evidence .row:last-child { margin-bottom: 0; }\n.lens-evidence .kw {\n  display: inline-block;\n  background: var(--card);\n  padding: 1px 6px;\n  margin: 0 4px 4px 0;\n  border: 1px solid var(--mute2);\n  font-size: 10px;\n}\n.lens-evidence .kw.hit { border-color: var(--ultramarine); color: var(--ultramarine); }\n.lens-evidence .kw.miss { color: var(--mute2); }\n.lens-evidence .actions { margin-top: 8px; display: flex; gap: 8px; align-items: center; }\n.lens-evidence .actions .lbl { color: var(--mute); }\n.mini-btn {\n  font-family: 'Space Mono', monospace;\n  font-size: 10px;\n  padding: 3px 8px;\n  border: 1px solid var(--line);\n  background: var(--paper);\n  cursor: pointer;\n}\n.mini-btn:hover { background: var(--ink); color: var(--paper); }\n.mini-btn.active { background: var(--ochre); border-color: var(--ochre); }\n\n/* === FRAMEWORK SUGGESTION === */\n.suggestion {\n  border: 2px solid var(--vermillion);\n  background: var(--card);\n  box-shadow: 6px 6px 0 var(--vermillion);\n  padding: 24px;\n  display: none;\n}\n.suggestion.show { display: block; }\n.suggestion .head {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  margin-bottom: 16px;\n}\n.suggestion .head .tag {\n  font-family: 'Space Mono', monospace;\n  font-size: 10px;\n  font-weight: 700;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--vermillion);\n}\n.suggestion .reason {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  color: var(--mute);\n  letter-spacing: 0.06em;\n}\n.suggestion .name {\n  font-family: 'Space Mono', monospace;\n  font-size: 32px;\n  font-weight: 700;\n  color: var(--ink);\n  letter-spacing: -0.02em;\n  margin-bottom: 4px;\n  line-height: 1;\n}\n.suggestion .when {\n  font-family: 'Kalam', cursive;\n  font-size: 16px;\n  color: var(--ink2);\n  margin-bottom: 14px;\n}\n.suggestion .why {\n  font-family: 'Space Mono', monospace;\n  font-size: 12px;\n  color: var(--ink2);\n  line-height: 1.6;\n  padding: 12px 14px;\n  background: var(--paper);\n  border-left: 3px solid var(--vermillion);\n  margin-bottom: 16px;\n}\n.suggestion .cats {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px;\n  margin-bottom: 16px;\n}\n.suggestion .ca um); }\n.b-stat .lens-row .l b.s3 { background: var(--ultramarine); }\n.b-stat .lens-row .l b.s4 { background: var(--green-earth); }\n.b-stat .lens-row .l b.s5 { background: var(--green-earth); }\n\n.bradley-route {\n  border: 2px solid var(--ultramarine);\n  background: var(--card);\n  box-shadow: 6px 6px 0 var(--ultramarine);\n  padding: 22px;\n  margin-bottom: 18px;\n}\n.bradley-route .head {\n  font-family: 'Space Mono', monospace;\n  font-size: 10px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--ultramarine);\n  margin-bottom: 8px;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.bradley-route .head::before {\n  content: '';\n  width: 8px; height: 8px;\n  background: var(--ultramarine);\n  display: inline-block;\n}\n.bradley-route .next {\n  font-family: 'Space Mono', monospace;\n  font-size: 24px;\n  font-weight: 700;\n  margin-bottom: 8px;\n  letter-spacing: -0.02em;\n  color: var(--ink);\n}\n.bradley-route .next .arrow { color: var(--ultramarine); margin: 0 8px; }\n.bradley-route .why {\n  font-family: 'Kalam', cursive;\n  font-size: 15px;\n  color: var(--ink2);\n  line-height: 1.5;\n}\n\n.bradley-log {\n  border: 1.5px solid var(--line);\n  background: var(--paper);\n  padding: 16px 18px;\n  max-height: 380px;\n  overflow-y: auto;\n}\n.bradley-log h3 {\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  margin-bottom: 14px;\n  color: var(--ink);\n  display: flex; justify-content: space-between;\n}\n.bradley-log h3 small { font-size: 9px; color: var(--mute); }\n.b-event {\n  display: grid;\n  grid-template-columns: 70px 14px 1fr auto;\n  gap: 10px;\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  padding: 6px 0;\n  border-bottom: 1px dashed var(--mute2);\n  align-items: baseline;\n}\n.b-event:last-child { border-bottom: none; }\n.b-event .t { color: var(--mute); }\n.b-event .d {\n  width: 8px; height: 8px;\n  background: var(--mute);\n  margin-top: 4px;\n}\n.b-event.audit .d { background: var(--vermillion); }\n.b-event.framework .d { background: var(--ultramarine); }\n.b-event.paul .d { background: var(--ochre); }\n.b-event.juliet .d { background: var(--violet); }\n.b-event.system .d { background: var(--green-earth); }\n.b-event .msg { color: var(--ink2); }\n.b-event .tag {\n  font-size: 9px;\n  background: var(--ink);\n  color: var(--paper);\n  padding: 1px 5px;\n  letter-spacing: 0.08em;\n}\n.b-empty {\n  font-family: 'Kalam', cursive;\n  font-size: 14px;\n  color: var(--mute);\n  text-align: center;\n  padding: 30px 12px;\n}\n\n/* === BRIEF ROOM === */\n.brief-room .panel { margin-bottom: 18px; }\n.brief-helper {\n  font-family: 'Kalam', cursive;\n  font-size: 15px;\n  color: var(--ink2);\n  margin-bottom: 14px;\n  line-height: 1.5;\n  max-width: 640px;\n}\n.brief-stats {\n  display: flex;\n  gap: 24px;\n  margin-top: 10px;\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  color: var(--mute);\n}\n.brief-stats b { color: var(--ink); }\n\n/* === TWEAKS PANEL (custom, lightweight) === */\n.tweaks-btn {\n  position: fixed;\n  bottom: 24px;\n  right: 24px;\n  width: 44px; height: 44px;\n  border: 1.5px solid var(--line);\n  background: var(--paper);\n  box-shadow: 4px 4px 0 var(--line);\n  cursor: pointer;\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n  font-weight: 700;\n  z-index: 500;\n}\n.tweaks-btn:hover { background: var(--ink); color: var(--paper); }\n.tweaks {\n  display: none;\n  position: fixed;\n  bottom: 80px; right: 24px;\n  width: 280px;\n  background: var(--card);\n  border: 2px solid var(--line);\n  box-shadow: 6px 6px 0 var(--line);\n  z-index: 500;\n  padding: 16px;\n  font-family: 'Space Mono', monospace;\n  font-size: 11px;\n}\n.tweaks.show { display: block; }\n.tweaks h4 {\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  margin-bottom: 12px;\n  border-bottom: 1.5px solid var(--line);\n  padding-bottom: 6px;\n  display: flex; justify-content: space-between;\n}\n.tweak-row { margin-bottom: 14px; }\n.tweak-row label {\n  display: block;\n  font-size: 10px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--mute);\n  margin-bottom: 4px;\n}\n.tweak-seg { display: flex; gap: 0; border: 1px solid var(--line); }\n.tweak-seg button {\n  flex: 1;\n  padding: 6px;\n  font-size: 10px;\n  font-family: 'Space Mono', monospace;\n  font-weight: 700;\n  background: var(--paper);\n  border: none;\n  border-right: 1px solid var(--line);\n  cursor: pointer;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n}\n.tweak-seg button:last-child { border-right: none; }\n.tweak-seg button.on { background: var(--ink); color: var(--paper); }\n\n@media (max-width: 900px) {\n  .george-grid { grid-template-columns: 1fr; }\n  .george-aside { position: static; }\n  .paul-grid { grid-template-columns: 1fr; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"shell\">\n\n  <!-- TOPBAR -->\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <span class=\"brand-mark\">\n        <span class=\"sq dot\"><\u002Fspan>\n        <span class=\"ci dot\"><\u002Fspan>\n        <span class=\"tr dot\"><\u002Fspan>\n      <\u002Fspan>\n      <div>\n        <h1>The House<\u002Fh1>\n        <div class=\"sub\">A band protocol<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div><\u002Fdiv>\n    <div class=\"project-name\">\n      <span class=\"label\">Project<\u002Fspan><br>\n      <input type=\"text\" id=\"projectName\" value=\"The Band\">\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ROOM NAV -->\n  <nav class=\"rooms\" id=\"rooms\">\n    <button class=\"room-tab active\" data-room=\"brief\"><span class=\"room-idx\">01<\u002Fspan>Brief<\u002Fbutton>\n    <button class=\"room-tab\" data-room=\"bradley\"><span class=\"room-idx\">02<\u002Fspan>Bradley<\u002Fbutton>\n    <button class=\"room-tab\" data-room=\"george\"><span class=\"room-idx\">03<\u002Fspan>George<\u002Fbutton>\n    <button class=\"room-tab\" data-room=\"frameworks\"><span class=\"room-idx\">04<\u002Fspan>Frameworks<\u002Fbutton>\n    <button class=\"room-tab\" data-room=\"paul\"><span class=\"room-idx\">05<\u002Fspan>Paul<\u002Fbutton>\n    <button class=\"room-tab\" data-room=\"juliet\"><span class=\"room-idx\">06<\u002Fspan>Juliet<\u002Fbutton>\n    <button class=\"room-tab\" data-room=\"library\"><span class=\"room-idx\">07<\u002Fspan>Library<\u002Fbutton>\n  <\u002Fnav>\n\n  <!-- ROOM: BRIEF -->\n  <section class=\"room active brief-room\" data-room=\"brief\">\n    <div class=\"panel\">\n      <h3>Project Brief <span class=\"tag\">SHARED<\u002Fspan><\u002Fh3>\n      <p class=\"brief-helper\">Bring what you know. Fragments are fine. The brief is the seed — every room reads it.<\u002Fp>\n      <textarea id=\"briefMain\" placeholder=\"What are you making? For whom? Why? What does done look like?\n\nDrop fragments. Sentences. Lists. Anything you have. You'll refine it elsewhere.\"><\u002Ftextarea>\n      <div class=\"brief-stats\">\n        <span>Words: <b id=\"wordCount\">0<\u002Fb><\u002Fspan>\n        <span>Chars: <b id=\"charCount\">0<\u002Fb><\u002Fspan>\n        <span>Last touched: <b id=\"lastTouched\">—<\u002Fb><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel panel-tight\" style=\"margin-top: 18px;\">\n      <h3>Where to next<\u002Fh3>\n      <p style=\"font-family: Kalam; font-size: 15px; color: var(--ink2); line-height: 1.5;\">George reads briefs through four lenses — WHAT, WHO, WHY, HOW — and suggests a framework for the thinnest one. Paul refines drafts. The library holds what you've made.<\u002Fp>\n      <div class=\"btn-row\" style=\"margin-top: 14px;\">\n        <button class=\"btn primary\" onclick=\"goRoom('george')\">Open George →<\u002Fbutton>\n        <button class=\"btn\" onclick=\"goRoom('frameworks')\">Browse frameworks<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ROOM: GEORGE -->\n  <section class=\"room\" data-room=\"george\">\n    <div class=\"george-meta\">\n      <div class=\"who\">George — reflection &amp; audit<\u002Fdiv>\n      <div class=\"turn\">Turn <b id=\"georgeTurn\">0<\u002Fb> / 10 · 10-turn session boundary<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"george-grid\">\n      <div class=\"george-main\">\n\n        <div class=\"panel\">\n          <h3>Brief <span class=\"tag\">LIVE<\u002Fspan><\u002Fh3>\n          <textarea id=\"briefGeorge\" placeholder=\"The brief from room 01 mirrors here. Type to update — both rooms stay in sync.\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div class=\"panel\">\n          <h3>Four Lenses <span class=\"tag\">AUDIT<\u002Fspan><\u002Fh3>\n          <p style=\"font-family: Space Mono; font-size: 11px; color: var(--mute); line-height: 1.6; margin-bottom: 6px;\">Auto-scored from brief evidence. Click any lens to see what was matched and override the score.<\u002Fp>\n          <div class=\"lenses\" id=\"lenses\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"suggestion\" id=\"suggestion\">\n          <div class=\"head\">\n            <div class=\"tag\">George suggests a framework<\u002Fdiv>\n            <div class=\"reason\" id=\"sugReason\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"name\" id=\"sugName\"><\u002Fdiv>\n          <div class=\"when\" id=\"sugWhen\"><\u002Fdiv>\n          <div class=\"why\" id=\"sugWhy\"><\u002Fdiv>\n          <div class=\"cats\" id=\"sugCats\"><\u002Fdiv>\n          <div class=\"btn-row\">\n            <button class=\"btn primary\" onclick=\"acceptSuggestion()\">Open workspace →<\u002Fbutton>\n            <button class=\"btn\" onclick=\"tryAnother()\">Try another<\u002Fbutton>\n            <button class=\"btn ghost\" onclick=\"dismissSuggestion()\">Dismiss<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"ready-gate\" id=\"readyGate\">\n          <span class=\"pip\"><\u002Fspan>\n          <div class=\"progress\">\n            <b id=\"gateLabel\">Not ready yet<\u002Fb>\n            <span id=\"gateDetail\">George wants 3+ lenses scoring 3 or higher, and at least one framework instance worked. Currently: 0 strong lenses, 0 frameworks.<\u002Fspan>\n          <\u002Fdiv>\n          <button class=\"btn go\" id=\"gateBtn\" style=\"display:none;\" onclick=\"goRoom('paul')\">Open Paul →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <aside class=\"george-aside\">\n        <div class=\"panel remarks panel-flat\" style=\"background: var(--card); border: 1.5px solid var(--line); box-shadow: 4px 4px 0 var(--line);\">\n          <h4>George's column<\u002Fh4>\n          <div class=\"remarks-list\" id=\"remarksList\">\n            <div class=\"remarks-empty\">Nothing yet. Start writing the brief — short observations will appear here as you type. George stays terse. One thing at a time.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"panel panel-tight\" style=\"background: var(--paper); border: 1.5px solid var(--line); box-shadow: 4px 4px 0 var(--line);\">\n          <h3>House rules<\u002Fh3>\n          <ul style=\"font-family: Space Mono; font-size: 10px; line-height: 1.7; color: var(--ink2); list-style: none; padding: 0;\">\n            <li>· No anthropomorphizing.<\u002Fli>\n            <li>· Default sparse.<\u002Fli>\n            <li>· Your judgment, your keeping.<\u002Fli>\n            <li>· Ten turns per session.<\u002Fli>\n            <li>· The brief is the seed.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ROOM: FRAMEWORKS -->\n  <section class=\"room\" data-room=\"frameworks\">\n    <p class=\"fw-intro\">Frameworks live here as workspaces. Open one to fill it in. Each save becomes an instance in the Library — you can keep iterating (v1, v2, v3) or open multiple in parallel.<\u002Fp>\n\n    <div class=\"fw-section\">\n      <div class=\"fw-section-head\">\n        <h3>Sticky-note frameworks<\u002Fh3>\n        <div class=\"lens-key\">— categorize and accumulate<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fw-grid\" id=\"stickyGrid\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"fw-section\">\n      <div class=\"fw-section-head\">\n        <h3>Drawing frameworks<\u002Fh3>\n        <div class=\"lens-key\">— map entities and flows<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fw-grid\" id=\"drawingGrid\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"fw-section\">\n      <div class=\"fw-section-head\">\n        <h3>Canvas frameworks<\u002Fh3>\n        <div class=\"lens-key\">— structured layouts<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fw-grid\" id=\"canvasGrid\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ROOM: PAUL -->\n  <section class=\"room\" data-room=\"paul\">\n    <div class=\"george-meta paul-meta\">\n      <div class=\"who\">Paul — editorial mirror<\u002Fdiv>\n      <div class=\"turn\">No turn limit · refinement is ongoing, not frivolous<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel\">\n      <h3>What Paul does <span class=\"tag\">EDITORIAL<\u002Fspan><\u002Fh3>\n      <p style=\"font-family: Kalam; font-size: 15px; color: var(--ink2); line-height: 1.5;\">Bring a draft. Any rough work — a brief section, framework notes, a paragraph that's almost right. Paul tightens, clarifies, polishes. <b>Never<\u002Fb> changes your voice or judgment. Never adds ideas that weren't there.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"paul-grid\">\n      <div class=\"paul-input\">\n        <div class=\"panel\" style=\"padding: 0;\">\n          <div style=\"padding: 18px 22px 0;\"><h3 style=\"margin: 0;\">Your draft <span class=\"tag\">BRING<\u002Fspan><\u002Fh3><\u002Fdiv>\n          <div style=\"padding: 14px 22px 18px;\">\n            <textarea id=\"paulInput\" placeholder=\"Paste or write anything that needs tightening — a sentence, a paragraph, framework notes. Then click Refine.\"><\u002Ftextarea>\n            <div class=\"paul-actions\" style=\"margin-top: 12px;\">\n              <button class=\"btn primary\" onclick=\"paulRefine()\">Refine →<\u002Fbutton>\n              <button class=\"btn ghost\" onclick=\"paulPullBrief()\">Pull from brief<\u002Fbutton>\n              <button class=\"btn ghost\" onclick=\"paulClear()\">Clear<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"paul-card\" id=\"paulCard\">\n        <div class=\"head\">\n          <span>Refined<\u002Fspan>\n          <span id=\"paulCardMeta\">—<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"empty\" id=\"paulEmpty\">Bring a draft. Paul will refine it — show what was tightened, what was flagged, what stayed. Your voice doesn't move.<\u002Fdiv>\n        <div class=\"body\" id=\"paulBody\" style=\"display:none;\"><\u002Fdiv>\n        <div class=\"foot\" id=\"paulFoot\" style=\"display:none;\">\n          <button class=\"btn ghost\" onclick=\"paulCopy()\">Copy refined<\u002Fbutton>\n          <button class=\"btn ghost\" onclick=\"paulDiscard()\">Discard<\u002Fbutton>\n          <button class=\"btn go\" onclick=\"paulAccept()\">Accept &amp; file<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"paul-notes\" id=\"paulNotes\" style=\"margin-top: 18px; display: none;\">\n      <b>What changed:<\u002Fb>\n      <ul id=\"paulChangesList\"><\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ROOM: JULIET -->\n  <section class=\"room\" data-room=\"juliet\">\n    <div class=\"george-meta juliet-meta\">\n      <div class=\"who\">Juliet — private freewrite<\u002Fdiv>\n      <div class=\"turn\">No turn counter · Bradley cannot see this<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"juliet-banner\">\n      <span class=\"lock\"><\u002Fspan>\n      <div>\n        <b>Local only.<\u002Fb><br>\n        <span>Nothing here flows anywhere. Not to the brief, not to Bradley, not into the library. Write what can't be shared. Burn it after if you want.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"panel\">\n      <h3>Freewrite <span class=\"tag\">PRIVATE<\u002Fspan><\u002Fh3>\n      <textarea id=\"julietInput\" placeholder=\"Anything. Drafts you'd never share. The stuff that needs to come out of your head before you can think.\"><\u002Ftextarea>\n      <div class=\"juliet-actions\">\n        <div class=\"left\">\n          <button class=\"btn violet\" onclick=\"julietSave()\">Save private<\u002Fbutton>\n          <button class=\"btn burn\" onclick=\"julietBurn()\">Burn<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"meta\">\n          <span id=\"julietMeta\">—<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"juliet-entries\" id=\"julietEntries\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ROOM: LIBRARY -->\n  <section class=\"room\" data-room=\"library\">\n    <p class=\"lib-intro\">Everything filed. Framework instances, Paul refinements, audit checkpoints. Click any card to re-open and iterate — your work compounds.<\u002Fp>\n    <div class=\"lib-grid\" id=\"libGrid\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ROOM: BRADLEY -->\n  <section class=\"room\" data-room=\"bradley\">\n    <div class=\"george-meta bradley-meta\">\n      <div class=\"who\">Bradley — silent router<\u002Fdiv>\n      <div class=\"turn\">PM layer · reads state, doesn't speak unless asked<\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"bradley-intro\">Bradley sits on top of the work. He doesn't suggest. He notices. This room is what he sees: where you are, what's been filed, what's load-bearing. The next room is a guess based on state — yours to take or ignore.<\u002Fp>\n\n    <div class=\"bradley-route\" id=\"bradleyRoute\">\n      <div class=\"head\">Next room<\u002Fdiv>\n      <div class=\"next\" id=\"bradleyNext\">—<\u002Fdiv>\n      <div class=\"why\" id=\"bradleyWhy\">—<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"bradley-grid\">\n      <div class=\"b-stat\">\n        <div class=\"lbl\">Brief<\u002Fdiv>\n        <div class=\"val\" id=\"bStatBrief\">0<span class=\"unit\">w<\u002Fspan><\u002Fdiv>\n        <div class=\"sub\" id=\"bStatBriefSub\">No brief yet.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"b-stat\">\n        <div class=\"lbl\">Four lenses<\u002Fdiv>\n        <div class=\"val\" id=\"bStatLensAvg\">—<span class=\"unit\">/5 avg<\u002Fspan><\u002Fdiv>\n        <div class=\"lens-row\" id=\"bStatLensRow\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"b-stat\">\n        <div class=\"lbl\">Frameworks filed<\u002Fdiv>\n        <div class=\"val\" id=\"bStatFw\">0<\u002Fdiv>\n        <div class=\"sub\" id=\"bStatFwSub\">No instances yet.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"b-stat\">\n        <div class=\"lbl\">Paul refinements<\u002Fdiv>\n        <div class=\"val\" id=\"bStatPaul\">0<\u002Fdiv>\n        <div class=\"sub\" id=\"bStatPaulSub\">Nothing refined yet.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"bradley-log\">\n      <h3>Project log <small>Newest first · Juliet never appears here<\u002Fsmall><\u002Fh3>\n      <div id=\"bradleyLog\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- (Library section end above) -->\n\n<\u002Fdiv>\n\n<!-- OVERLAY (framework workspace) -->\n<div class=\"overlay\" id=\"overlay\">\n  <div class=\"workspace\">\n    <div class=\"workspace-head\">\n      <div class=\"ttl\">\n        <h2 id=\"wsTitle\">Framework<\u002Fh2>\n        <div class=\"meta\" id=\"wsMeta\">—<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"actions\">\n        <button class=\"btn ghost\" onclick=\"closeWorkspace()\">Cancel<\u002Fbutton>\n        <button class=\"btn go\" onclick=\"saveWorkspace()\">Save &amp; file<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"workspace-body\" id=\"wsBody\"><\u002Fdiv>\n    <div class=\"workspace-foot\">\n      <span id=\"wsFootLeft\">—<\u002Fspan>\n      <span id=\"wsFootRight\">Double-click a category header to quick-add a note.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- TWEAKS -->\n<button class=\"tweaks-btn\" id=\"tweaksBtn\" title=\"Tweaks\">⚙<\u002Fbutton>\n<div class=\"tweaks\" id=\"tweaksPanel\">\n  <h4>Tweaks <button class=\"btn ghost\" style=\"padding: 2px 6px; font-size: 9px;\" onclick=\"toggleTweaks()\">×<\u002Fbutton><\u002Fh4>\n  <div class=\"tweak-row\">\n    <label>George voice<\u002Flabel>\n    <div class=\"tweak-seg\" data-tweak=\"voice\">\n      <button data-val=\"quiet\">Quiet<\u002Fbutton>\n      <button data-val=\"normal\" class=\"on\">Normal<\u002Fbutton>\n      <button data-val=\"loud\">Loud<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tweak-row\">\n    <label>Lens strictness<\u002Flabel>\n    <div class=\"tweak-seg\" data-tweak=\"strict\">\n      <button data-val=\"loose\">Loose<\u002Fbutton>\n      <button data-val=\"normal\" class=\"on\">Normal<\u002Fbutton>\n      <button data-val=\"strict\">Strict<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tweak-row\">\n    <label>Brief mirror<\u002Flabel>\n    <div class=\"tweak-seg\" data-tweak=\"mirror\">\n      <button data-val=\"auto\" class=\"on\">Auto<\u002Fbutton>\n      <button data-val=\"off\">Off<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top: 1px solid var(--mute2); padding-top: 10px; margin-top: 4px;\">\n    <button class=\"btn ghost\" style=\"width: 100%; font-size: 10px;\" onclick=\"resetState()\">Reset all state<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script src=\"d397d346-a85b-4788-b92e-2ee98f549a92\"><\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
